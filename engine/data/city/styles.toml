# Architectural styles for the procedural Spanish city (forja_city).
#
# Each style is data: add or tweak one and every building that uses it
# changes, no code involved. Materials are "<kind> #rrggbb" with kinds
# stucco, plaster, brick, ashlar, granite, tiles (<pattern>) and moulding.
# Tile patterns: checker_green, checker_blue, diamond_blue, frieze, white.
#
# References: Madrid centro (Lavapiés, Huertas, Malasaña), Madrid de los
# Austrias (Plaza de la Villa), Valencian Ensanche (Gran Vía, Colón,
# Plaza del Ayuntamiento), Valencian modernismo, Ruzafa and Cabanyal.

[[style]]
id = "madrid_centro"
city = "madrid"
floors = [4, 5]
ground_height = 4.2
floor_height = 3.2
bay = [2.8, 3.3]
window_width = 1.1
window_height = 2.3
walls = ["stucco #efe4cc", "stucco #ead2a6", "plaster #d8a468", "stucco #c98a64", "stucco #f4efe4", "plaster #e6c48e", "stucco #b9705a"]
ground = "ashlar #e8dcc4"
surround = ["moulding #f6f1e6", "moulding #efe6d4"]
surround_kind = "lintel"
balcony = "individual"
railing = "bars"
shutters = ["louvre #4e3420", "louvre #33241a", "louvre #6a4628", "roller #e6e0d4", "louvre #2f3d2e"]
frames = ["#f1eee6", "#3a2a1e", "#6b4a2e"]
roof = "clay"
cornice = "eave"
shops = 0.85
graffiti = 0.6
awnings = 0.05
flower_pots = 0.35
wall_lamps = true
dormers = true

