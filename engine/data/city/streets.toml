# Street profiles for forja_city.
#
# A profile says what a street is: its cross-section (building line to
# building line `width`, roadway `carriageway`, median), paving, kerb and
# gutter, dressing (lamps, trees, bollards, bins, containers, benches,
# terraces, catenaries), traffic control, and what it allows the facades
# facing it (`front`, see forja_city::lot::FrontRules: reach_frac,
# reach_max, mirador_reach, awning_walk, awning_clear, shops, narrow,
# portal, height_ratio).
#
# `carriageway = 0` means a shared surface (plataforma única) at
# `shared_height`: no kerbs, paint, traffic lights or poles.
# Surfaces name ground materials: Asphalt, Cobble, Granite, SidewalkHex,
# SidewalkSlab.

