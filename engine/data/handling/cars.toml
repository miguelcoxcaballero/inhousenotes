# Handling data in the spirit of handling.meta. Any field left out takes the
# sedan default (see VehicleConfig). Wheel positions come from the model's
# wheel nodes when bound with bind_vehicle_model.
#
# Grip is the tyres' peak friction: road cars corner at 0.8-1.0 g and stop
# from 100 km/h in 35-45 m. The balance fields (rear_grip, anti_roll_front,
# brake_bias) keep every car nose-led; the assists (traction_control, abs,
# stability_control, countersteer_assist) are tuned per class. The figures
# are checked by crates/forja_gameplay/tests/handling.rs.

