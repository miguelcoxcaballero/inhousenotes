# Graphics options (F9 in the game edits and saves this file).
#
# auto = true picks a preset from the GPU at startup: High on discrete GPUs
# (dynamic resolution holds 60 FPS on mid-range cards), Medium on older or
# entry-level discrete cards and strong integrated GPUs, Low otherwise.
# With auto = false the named preset sets every cost knob below; use
# preset = "custom" to keep hand-edited values. Presets only change costs
# (resolutions, sample counts, update rates); the look (exposure, tonemap,
# lights, fog) is the same in all of them. See docs/performance.md.
auto = true
preset = "high"

# Presentation: FIFO with v-sync; without it Mailbox when available.
vsync = true
# Frames the CPU may queue ahead of the display (1-3).
frame_latency = 2

# Dynamic resolution: the internal resolution moves between
# min_render_scale and render_scale to keep the GPU under target_fps.
target_fps = 60.0
dynamic_resolution = true
render_scale = 1.0
min_render_scale = 0.75

# Sun shadows: texels per cascade side, cascades with soft PCSS penumbrae,
# refresh interval of the two far cascades, fraction of shadow distance.
shadow_resolution = 2048
pcss_cascades = 2
far_cascade_interval = 2
shadow_distance_scale = 1.0

# Screen-space effects.
ssao = true
ssao_half_res = true
ssr = true
ssr_steps = 32
contact_shadows = true
taa = true
bloom = true
# Depth of field of cutscenes / photo mode (High and Ultra).
dof = true

# Local lights per frame after frustum culling (closest first; the light
# clusters bound the per-pixel cost) and spot lights with a shadow map (0-4).
max_lights = 4096
spot_shadows = 4
# Largest texture side uploaded (bigger textures start at a smaller mip;
# applies on the next map load).
max_texture_size = 4096
# Sun shadow casters smaller than this many shadow texels (bounding
# radius) are skipped.
shadow_caster_texels = 2.5
# Multiplies the LOD triangle budget (lower = coarser LODs sooner).
lod_detail = 1.0

# Frame profiler overlay at startup (F11 toggles it) and CSV log path.
profiler_overlay = false
profiler_csv = ""
