# Quaternius Robot Expressive (43-bone skinned rig).
name = "robot_humanoid"
initial = "locomotion"

[[state]]
name = "locomotion"
blend = { param = "speed", points = [[0.0, "Idle"], [1.8, "Walking"], [6.0, "Running"]] }

[[state]]
name = "jump"
clip = "Jump"
looping = false

[[state]]
name = "punch"
clip = "Punch"
looping = false

[[state]]
name = "dead"
clip = "Death"
looping = false

[[transition]]
from = "*"
to = "dead"
when = [{ param = "dead", gt = 0.5 }]
fade = 0.1

[[transition]]
from = "locomotion"
to = "jump"
when = [{ param = "jump", gt = 0.5 }]
fade = 0.08

[[transition]]
from = "jump"
to = "locomotion"
on_finish = true
fade = 0.2

[[transition]]
from = "locomotion"
to = "punch"
when = [{ param = "melee", gt = 0.5 }]
fade = 0.08

[[transition]]
from = "punch"
to = "locomotion"
on_finish = true
fade = 0.15

[[layer]]
name = "wave"
clip = "Wave"
mask_root = "Shoulder.R"
weight_param = "wave"
