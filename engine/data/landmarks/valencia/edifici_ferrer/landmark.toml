# Edifici Ferrer, Carrer de Ciril Amoros 29-31 / Carrer de Pizarro 16, Pla del Remei (Eixample),
# Valencia. Vicente Ferrer Perez, 1908 (date on the crest; Catastro 1905). Valencian modernisme /
# Secession: white stucco on a limestone ground floor, three street fronts (Ciril Amoros 15.8 m,
# the 14.1 m chamfer facing ESE, Pizarro 7.4 m), each crowned by a wavy gable with ceramic
# trencadis garlands of green leaves and pink roses; the chamfer gable carries "1908", a round
# oculus and a basket of roses, the Ciril Amoros gable an oval oculus; ceramic rose trees on the
# corner strips; two timber miradors and iron balconies; Secession medallions and green/white
# checker tiles; tile panels with female faces under the second-floor windows.
#
# Generated by scratchpad ferrer/gen.py; every number is in sources.toml [facts].

[landmark]
name = "Edifici Ferrer"
slug = "edifici_ferrer"
main_facade = 5
notes = "Modernista apartment building (1908) on the chamfered corner of Ciril Amoros and Pizarro; the NW and SW sides are party walls."

[landmark.info]
architect = "Vicente Ferrer Pérez"
built = "1908 (Catastro 1905)"
style = "Valencian modernisme (Secession)"
heritage = "Bé de Rellevància Local (2005)"
address = "Carrer de Ciril Amorós 29, València"

