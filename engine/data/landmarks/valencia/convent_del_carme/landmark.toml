# Convent del Carme (Centre del Carme Cultura Contemporania) and its church of the Santissima Creu,
# Barri del Carme, Valencia. Generated by scratchpad carme/gen.py; dimensions and sources in sources.toml [facts].
#
# PLAN. Convent = OSM relation 8082637 (+ its building:parts); the church is not in it: it is Catastro
# context 209 (OSM way 264453281), modelled here from that ring and hidden as context. The church is built
# in a frame along its axis (azimuth 17.0): the front on the Placa del Carme faces 197; facade screen
# 19.7 m wide (retable 13.6 m, centred 9.86 m from the west end: Catastro column-base notches), the oval
# chapel of the Mare de Deu del Carme (Gasco) east of it, the bell tower (6.55 m square, turned 31.5 deg
# with the Carrer del Museu) west of it behind the trapezoidal former chapel of Sant Elies.
#
# HEIGHTS. IGN PNOA-LiDAR building heights (wms-mapa-lidar.idee.es GetFeatureInfo, 2.5 m cells, about
# 2.7 m south of the PNOA orthophoto), checked against photo ratios: screen cornice 27.5, nave ridge 20.6,
# eaves 16.8, west chapels 11.5, oval chapel cornice 17.5 and lantern 26.7, Communion dome 23-24, tower
# shaft 29.5, belfry 36.0, statue 42.3 (LiDAR max 43); convent wings 12-17 m, Gothic cloister 8.5.

[landmark]
name = "Convent del Carme"
slug = "convent_del_carme"
main_facade = "facing:197:6"
notes = "Former Carmelite convent (Centre del Carme Cultura Contemporania, Real Monasterio de Nuestra Senora del Carmen) with the parish church of the Santissima Creu: retable facade-screen by fray Gaspar de San Martin (1644 onwards), bell tower crowned by Juan Bautista Minguez, oval chapel of the Mare de Deu del Carme by Vicente Gasco, Gothic and Renaissance cloisters, brick front on the Carrer del Museu with the 1778 neoclassical portal."

[landmark.info]
built = "1281-1788 (church consecrated 1343, facade 1644-1680s, portal 1778)"
style = "Gothic cloister and church, Renaissance cloister, Baroque retable facade, neoclassical chapel"
heritage = "BIC RI-51-0004916"
frame = "church elements generated in a frame along the church axis (azimuth 17.0), origin = west end of the facade"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
