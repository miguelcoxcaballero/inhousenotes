# Mercat de Russafa (Mercado de Ruzafa), Valencia. Julio Bellot Senent and
# Francisco Javier Goerlich Lleo, 1957 (Catastro date 1969). Reinforced
# concrete market hall: a thin flat roof slab cantilevering 1.88 m past a
# cream fin wall, the wall clad with coloured vertical concrete blades (blue
# on the west front, red/orange/yellow on the south, green on the east,
# earth tones on the north front with the MERCAT DE RUSSAFA lettering),
# a ring of shops under a projecting ledge, entrance canopies, a raised
# central roof and a brick block at the north-east corner.
#
# GENERATED by scratchpad rus/gen.py from measured parameters; plan in the
# hall frame s (towards azimuth 149.75) / t (towards 59.75):
#   roof edge (PNOA 2024 profiles, = Catastro outline): west t -29.15,
#   south s 37.2, east t = 32.47 + 0.0771 (s - 10) (the block is a
#   trapezoid, 61.6 m wide at s 10), north s -46.4 for the west lobe
#   (t -29.15..0.4) and s -34.8 for the east part; roof 66.4 x 83.6 m.
#   Fin wall = roof edge inset 1.88 m (overhang); shops on the OSM/Catastro
#   ground outline with its entrance notches.
# Heights: constrained bundle adjustment of photos 04, 08, 12 and the
#   Catastro photo (eye prior 1.6 m, ground corner points, 3D eave lines):
#   roof slab top 10.15, fascia 0.20, fins 3.50..8.75, ledge 3.45; raised
#   central roof +2.2 m and brick block 15.0 m from PNOA shadow ratios.
# Fin rhythm (photos 08, 12 projected on the solved walls): groups of 6
# blades at 0.96 m separated by 0.7 m piers, period 5.85 m.


[landmark]
name = "Mercat de Russafa"
slug = "mercat_de_russafa"
main_facade = "facing:s"
notes = "1957 market hall by Julio Bellot and Javier Goerlich: thin cantilevered roof slab over a fin wall of coloured concrete blades (blue W, red-orange-yellow S, green E, earth tones N), shops under a projecting ledge, entrance canopies, raised central roof, brick block at the north-east corner."

[landmark.info]
architect = "Julio Bellot Senent, Francisco Javier Goerlich Lleo"
built = "1957"
style = "Modern movement (1950s Valencian rationalism)"

[defaults]
material = "wall_cream"
roof_material = "roof_grey"
glass_material = "glass"
frame_material = "frame_dark"
iron_material = "iron"
detail = 1.0

[render]
sun = [200, 50]
exposure = 0.55
paving = 75

[reference_heights]
"outline:0" = { height = 10.15, tolerance = 2.4, source = "roof slab top (raised central roof +2.2 m inside), bundle adjustment; OSM levels=1 gives 3.2 m" }
"part:0" = { height = 10.15, tolerance = 2.4, source = "roof slab top, bundle adjustment (OSM levels=1)" }
"part:1" = { height = 10.15, tolerance = 2.4, source = "roof slab top, bundle adjustment (OSM levels=1)" }
"part:2" = { height = 15.00, tolerance = 1.2, source = "brick block (OSM/Catastro 4 floors), PNOA shadow ratio" }
"catastro:0" = { height = 10.15, tolerance = 2.4, source = "roof slab top at the edge, bundle adjustment photos 04/08/12/Catastro (Catastro: 1 floor)" }
roof_slab = { height = 10.15, tolerance = 0.3, source = "bundle adjustment photos 04/08/12/Catastro" }
fin_wall = { height = 9.95, tolerance = 0.4, source = "fin wall under the soffit, bundle adjustment" }
lantern = { height = 12.35, tolerance = 0.6, source = "raised central roof, PNOA shadow 1.1 m (sun tan 1.95 from the 5.2 m NW eave shadow)" }
brick_block = { height = 15.00, tolerance = 1.0, source = "PNOA shadow ratio 8.6/5.2 m and Catastro photo (4 floors in Catastro)" }


