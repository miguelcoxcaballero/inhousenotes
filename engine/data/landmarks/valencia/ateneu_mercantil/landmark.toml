# Ateneu Mercantil de Valencia (Edificio del Ateneo Mercantil), Placa de l'Ajuntament 18.
# Competition 1927 (Juan de Zavala Lafora, J. M. Rivas Eulate, Fernando Arzadun), project 1931,
# built 1935-1941 under Cayetano Borso di Carminati and Emilio Artal (Wikidata Q8772084).
#
# Generated by scratchpad ate/gen.py. PLAN: OSM way 416210407 + 15 building:parts (= Catastro
# 5825705YJ2752F), checked on the IGN PNOA orthophoto: plaza front 35.16 m between the party
# walls (Rialto to the north, ABC office tower to the south), facing azimuth 241; corner pavilions
# 7.2 m wide; the five-arch screen stands 2.05 m in front of the central body (OSM part 6 /
# Catastro 4-floor strip): the "double facade" of the descriptions.
# HEIGHTS (+-0.4 m): photo 10 (upright, frontal; facade 1038 px = 35.16 m -> 29.52 px/m) for every
# level above the ground-floor cornice; ground-floor cornice 8.5 m above the pavement from the
# projective (cross-ratio) fit of both pavilion edges in the Catastro photo (8.1 / 8.7 m) and the
# upright photo 02 (8.85 m). Rear wings from the Catastro floor counts (estimates).

[landmark]
name = "Ateneu Mercantil de València"
slug = "ateneu_mercantil"
main_facade = "facing:241:10"
notes = "Classicist seat of the Ateneo Mercantil (1927-1941) on the Placa de l'Ajuntament: a rusticated ground floor with mezzanine, a giant five-arch screen three storeys high standing 2 m in front of the central body (double facade), two corner pavilions with balconies, oval cartouches and segmental crests, and a set-back attic of nine windows crowned by a balustrade of pinnacles."

[landmark.info]
architect = "Juan de Zavala Lafora, Jose Maria Rivas Eulate, Fernando Arzadun Ibarraran (project); Cayetano Borso di Carminati, Emilio Artal Fos (works)"
built = "1935-1941"
style = "Classicism / eclectic"
heritage = "BIE (inventory 285)"

