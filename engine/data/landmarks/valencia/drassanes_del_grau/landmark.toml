# Drassanes del Grau (Reales Atarazanas del Grao), El Grau, Valencia. Generated by scratchpad
# drg/gen.py from the five OSM nave outlines; every dimension and its source is in sources.toml [facts].
#
# Five parallel Gothic naves (14th c., rebuilt 15th c.), each 49 m long, side by side north to south,
# with their gables to the east (Placa de Joan Antoni Benlliure, the old shore) and the west (Carrer de
# Salvador Gasull). Each east gable is opened by a huge pointed brick arch into a one-bay porch whose
# back wall is a glazed pointed arch over a brick dado; the porches communicate through pointed arches
# (the "porxo"). Tiled gable roofs with transverse ribs over the diaphragm arches, stone gargoyles at the
# valleys, plastered north wall with nine buttresses, rubble-and-brick south wall, plain west gables
# with a tall slot window and a door.
#
# PLAN: the five OSM nave outlines (= Catastro 9415312..16, checked on the IGN PNOA orthophoto): naves
# 13.03 / 13.72 / 13.51 / 13.04 / 15.26 m wide (north to south) and 49.4-49.6 m long, axis azimuth 99.6.
# HEIGHTS: IGN PNOA-LiDAR building heights (2.5 m cells, fitted 2.1 m south of the Catastro frame on the
# ridge/valley pattern; streets read no-data so no street bias), cross-checked with photo solves:
# ridges 10.5 m, valley gutters / north eave 7.1 m, south eave of the wider nave 5 at 5.3 m
# (asymmetric roof, ridge 46 % of its width from its north valley). Great arches 9.6 m to the crown,
# springing 3.3 m, 10.7-11.3 m span (photo 09 and the Catastro facade photo, scaled by the nave pitch).

[landmark]
name = "Drassanes del Grau"
slug = "drassanes_del_grau"
main_facade = "facing:e"
notes = "Reales Atarazanas del Grao: royal shipyard of the kingdom of Valencia, five parallel naves with diaphragm arches and timber gable roofs; restored 1992-1997 and used as an exhibition hall."

[landmark.info]
built = "14th century, rebuilt in the 15th century, restored 1990s"
style = "Valencian Gothic (civil, brick)"
heritage = "BIC RI-51-0001217"
also_known_as = "Atarazanas del Grao, Reales Atarazanas"

[defaults]
material = "brick"
roof_material = "roof"
glass_material = "glass_grid"
frame_material = "iron_dark"
iron_material = "iron_rust"

[render]
sun = [200, 50]
paving = 70
hide_context = [138]   # a 3.8 m kiosk-like block in the Placa de Joan Antoni Benlliure hides the Catastro photo camera

[reference_heights]
"outline:1" = { height = 10.5, tolerance = 0.8, source = "LiDAR ridge, photo solve" }
"outline:2" = { height = 10.5, tolerance = 0.8, source = "LiDAR ridge, photo solve" }
"outline:0" = { height = 10.5, tolerance = 0.8, source = "LiDAR ridge, photo solve" }
"outline:3" = { height = 10.5, tolerance = 0.8, source = "LiDAR ridge, photo solve" }
"outline:4" = { height = 10.5, tolerance = 0.8, source = "LiDAR ridge, photo solve" }

[material.brick]          # pale handmade brick of the gables and piers
kind = "limestone"
tint = "#efe4d6"
block = [0.31, 0.055]
weathering = 0.35

[material.brick_ring]     # voussoir ring of the great arches, a touch darker
kind = "limestone"
tint = "#e4d4c2"
uv_rotate = 90
weathering = 0.3

[material.rubble]         # south wall: rubble masonry laced with brick courses
kind = "ashlar"
tint = "#b9ab95"
block = [0.42, 0.28]
uv_scale = 1.0
weathering = 0.4

[material.render]         # plastered north wall and buttresses
kind = "plaster"
tint = "#efe2c8"
weathering = 0.6

[material.stone]          # gargoyles
kind = "limestone"
tint = "#c8bb9e"
weathering = 0.5

[material.roof]
kind = "roof_tiles"
tint = "#8e8076"
weathering = 0.5

[material.timber]
kind = "wood"
tint = "#4a3222"

[material.glass_grid]
kind = "glass"
tint = "#15171a"

[material.iron_dark]
kind = "iron"
tint = "#2b2622"

[material.iron_rust]
kind = "flat"
color = "#5e3f2c"
roughness = 0.6
metallic = 0.4

[material.hall_dark]
kind = "interior"
tint = "#3a3430"

[material.floor]
kind = "paving"
tint = "#cfc6b8"

