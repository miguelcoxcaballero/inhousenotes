# Palau Arquebisbal de València (Palacio Arzobispal), Plaça de l'Arquebisbe / Carrer del Palau 2.
# Rebuilt 1941-1946 by Vicente Traver Tomás after the 1936 fire, in a Valencian neo-Renaissance
# idiom: red brick with white limestone pilaster strips, window frames, oculi and cornice; a
# belvedere tower with a five-by-three arched loggia, a curved two-storey loggia at the NW corner
# next to the cathedral, and a bridge over Carrer de la Barcelonina to the cathedral.
# Generated by a script (scratch gen.py); every number is in sources.toml [facts] with its source.
#
# PLAN: OSM relation 17642970 (= Catastro parcel 5930801YJ2753B, 11 BuildingParts).
#   North (main) front = OSM edges 9..19, a straight line az 11.2 from the tower NE corner
#   (-5.11,-21.75) for 36.7 m to the rounded NE corner (r ~ 5 m); east front = edge 32 (28.9 m,
#   az 114, Carrer del Palau / Plaça de l'Arquebisbe). Tower = Catastro part 5 (5.95 x 8.0 m),
#   NW loggia = part 4, west wing = part 10, chapel dome = octagon part 8, south range = part 7,
#   tall rear block = part 2, light wells = parts 1/3/6.
# HEIGHTS: IGN PNOA-LiDAR building heights (2.5 m cells, offset fitted on the tower edges) and
#   photo ratios (see sources.toml [facts]).

[landmark]
name = "Palau Arquebisbal de València"
slug = "palau_arquebisbal"
main_facade = 9
notes = "Archbishop's palace beside the Cathedral (Plaça de l'Almoina / Carrer del Palau): neo-Renaissance brick and limestone front with oculi frieze and balustrade, frontispiece with the archbishop's arms, arched belvedere tower, curved NW loggia, bridge to the cathedral."

[landmark.info]
architect = "Vicente Traver Tomás"
built = "1941-1946 (rebuilt after the 1936 fire; medieval palace on the site since the 13th c.)"
style = "Neo-Renaissance (Valencian historicism)"
heritage = "Bé de Rellevància Local"

[defaults]
material = "brick"
detail = 0.6
roof_material = "terrace"
glass_material = "glass"
door_material = "door"
iron_material = "iron"
frame_material = "shutter"

[render]
sun = [75, 40]   # morning sun from the ENE lights the north and NE fronts, as in most photos
paving = 60

[reference_heights]
front_n = { height = 14.50, tolerance = 0.6, source = "PNOA-LiDAR roof cells 13.6-14.9 m + photo ratios" }
tower_top = { height = 20.60, tolerance = 0.6, source = "PNOA-LiDAR tower cells 20.5-20.9 m" }
"part:0" = { height = 10.5, tolerance = 1.2, source = "PNOA-LiDAR cells 9.5-10.5 m over the bridge (OSM levels tag gives 6.4)" }
dome = { height = 23.60, tolerance = 1.0, source = "PNOA-LiDAR dome cell 23.6 m" }


