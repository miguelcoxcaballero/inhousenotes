# Edifici Rialto (Rialto Teatre - La Filmoteca), Plaça de l'Ajuntament 17, Valencia.
# Rationalist / Art Deco cinema building, 1935-1939 (Cayetano Borso di Carminati), remodelled by
# Cristina and Camilo Grau (late 1980s) for the Filmoteca and Teatres de la Generalitat; BIE.
#
# Generated by scratchpad rialto/gen.py. Plan from OSM way 416210393 and its building:parts
# (= Catastro 5825706YJ2752F), checked on the IGN PNOA orthophoto: plaza front 11.98 m facing azimuth
# 241; tower 3.7 x 4.0 m at its south end; glazed box (1.15 m) and mirador (1.45 m) projecting over
# the pavement (OSM parts 12/15/17, min_level 1); rear rounded corner fitted as an arc of r 7.33 m.
# Heights: own constrained camera solves (scratchpad rialto/solve.py: Catastro photo with EXIF focal
# prior and eye-height prior, 12 m front as scale; photo 16 with pilasters on the fitted arc) and
# two-view triangulation (Catastro + photo 08): box 3.8-9.0, mirador 16.6, parapet 27.25, attic 28.9,
# boat canopy 29.45, turret 30.9, tower shaft 31.5, crown 33.45 / 34.0 / 34.7 / 35.2 / 35.5 m;
# rear: ground 4.0, six 3.55 m glazed storeys to 25.3, parapet 27.7 m. Auditorium 28.8 m (OSM, unmeasured).
# Published: basement, ground floor, six upper floors and attic (arquitectosdevalencia.es); 6 m portico.

[landmark]
name = "Edifici Rialto"
slug = "edifici_rialto"
main_facade = "facing:241:20"
notes = "Rialto cinema (1935-39), now Rialto Teatre and La Filmoteca of the Generalitat: a narrow ochre front on the Plaça de l'Ajuntament with an Art Deco tower carrying the vertical lettering RIALTO TEATRE FILMOTECA and a stepped crown with a diamond window, a two-storey glazed box and a curved glazed mirador projecting over the entrance, three tall two-storey windows, a set-back attic with a rounded boat-like turret; behind it the auditorium block on Barcelonina and Moratin streets ending in a rounded glazed curtain wall between ochre pilasters."

[landmark.info]
architect = "Cayetano Borso di Carminati (1935-39); remodelling Cristina and Camilo Grau Garcia (1980s)"
built = "1935-1939 (Catastro 1936)"
style = "Rationalism / Art Deco"
heritage = "Bien de Interes Etnologico/BIE (inventory 284)"

