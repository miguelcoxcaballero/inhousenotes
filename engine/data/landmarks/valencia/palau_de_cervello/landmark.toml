# Palau de Cervelló (Palau dels Comtes de Cervelló), Plaça de Tetuan, València.
# Built for the counts of Cervelló in the 18th century; royal residence in the 19th c.
# (Ferran VII, Maria Cristina, Isabel II); rebuilt as the Arxiu Municipal / museum
# (restored 1990s-2000s). Neoclassical stucco front with two corner towers.
# Generated by a small script (scratchpad cerv/gen/gen.py); every value below is measured:
#
# PLAN: OSM way 495233207 (outline:0), checked against the IGN PNOA orthophoto (WMS,
#   CC BY 4.0) and Catastro 6329805YJ2762G (7 BuildingParts with floor counts).
#   Main front = OSM edge 1 (37.36 m, faces az 111.5, Plaça de Tetuan).
#   Facade frame s = metres from the S corner (12.25, 27.25) towards the N corner.
#   Towers: S s 0..6.5 x 6.3 deep, N s 30.56..37.36 x 7.4 deep (Catastro 4-floor
#   parts 7 and 4: 6.6 / 6.8 m along the front; photo solve 6.5 / 6.7 m).
#   Front range 7.3 m deep to the covered courtyard (Catastro part 1, glazed on PNOA).
# HEIGHTS (camera solve, catastro facade photo, Canon SX270 EXIF 6.497 mm = 1685 px
#   at 1600 px, plus photo 01 with free focal; shared unknowns, rms 7-9 px; scale
#   from the 37.36 m front; check: door 3.0 x 3.7 m, a person in the door 1.7 m):
#   stone socle 1.15; ground windows 1.32-4.17 (1.52 wide, grilles); band 4.82-5.04;
#   first-floor balcony doors 5.04-8.08 (1.46 wide); band 9.66-9.92; second-floor
#   windows 9.92-12.52 (1.35 wide); main cornice 13.75-14.3; parapet top 15.5,
#   urns to ~16.2; tower band 13.75-14.65; tower window 16.5-18.7; tower crown
#   cornice 20.55-21.7 with brackets; attic top 22.8; corner urns to ~23.6.
# BAYS (back-projected on the solved catastro camera): S tower 3.1 (centre 3.25);
#   main range 8.69, 12.57, 16.59 (carriage door 3.06 x 3.70, coat of arms),
#   20.65, 24.57, 28.49 (3.96 m spacing); N tower 33.9 (centre 33.96).
#   The door is in the 3rd of the six central bays (4th of 8 from the south):
#   the front is NOT symmetric about the door (photos 01, 03, 06, 07, catastro).

[landmark]
name = "Palau de Cervelló"
slug = "palau_de_cervello"
main_facade = 1
notes = "Neoclassical palace of the counts of Cervelló on Plaça de Tetuan (Arxiu Municipal de València): ochre stucco front of 8 bays with iron balconies, two corner towers with bracketed crown cornices, attic parapet with urns."

[landmark.info]
built = "18th century; royal residence 19th c.; restored as municipal archive"
style = "Neoclassical"
heritage = "Bé de Rellevància Local"
use = "Arxiu Històric Municipal / Museu"

[defaults]
material = "stucco"
roof_material = "roof"
glass_material = "glass"
door_material = "door"
iron_material = "iron"

[render]
sun = [120, 40]
paving = 60

[reference_heights]
main_cornice = { height = 14.3, tolerance = 0.5, source = "camera solve, catastro photo + photo 01" }
parapet = { height = 15.5, tolerance = 0.5, source = "camera solve" }
tower_s_attic = { height = 22.8, tolerance = 0.6, source = "camera solve" }
tower_n_attic = { height = 22.8, tolerance = 0.6, source = "camera solve" }

# ------------------------------------------------------------ materials (tints from catastro photo / photo 07)
[material.stucco]
kind = "plaster"
tint = "#e6cf8e"
