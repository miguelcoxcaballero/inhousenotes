# Palau del Marqués de Dos Aigües (Palacio del Marqués de Dos Aguas), Valencia.
# Museo Nacional de Cerámica y Artes Suntuarias González Martí. Gothic house of the
# Rabassa de Perellós rebuilt 1740-44 by Hipólito Rovira (design) with the alabaster
# portal carved by Ignacio Vergara; facades re-stuccoed in imitation marble 1854-67;
# Poeta Querol wing and SE tower 1969-72 (ca.wikipedia).
#
# Written by a small generator so that every height is K x the value measured on
# photo 02; K = 0.90 after the compare-and-fix cycles (see SCALE below).
#
# PLAN (all from data, not guessed):
#   outline osm:way/515082661 (IoU 1.0); PNOA 2024-05 orthophoto (IGN WMS, CC BY 4.0)
#   overlaid on it matches within ~0.5 m. Main facade = edge 20 (25.0 m, faces az 29,
#   Carrer de la Cultura / Rinconada García Sanchiz) with the portal; Poeta Querol
#   facade = edge 21 (34.2 m, az 100). Towers = Catastro 5-floor parts 10 (NE corner,
#   7.3 x 5.1 m), 6 (NW end of the main facade, 4.5 m) and 7 (SE, 8 x 7 m); 3-floor
#   parts 0/4 = inner wings, 1-floor parts 8/9 = covered courtyards (glass roofs and
#   the radial skylight seen on PNOA), 1-2 floor parts 3/5 = low SW block (red tiles).
# HEIGHTS: photo 02 (Canon 6D, EXIF 24 mm, level / perspective-corrected): camera
#   solved from three facade ends (NE corner u=785, west end u=1172, SE end u=183),
#   eye (55.3, 1.6, -28.6) on Carrer dels Llibrers; horizon from the corner base;
#   checks: west-end base at 0.13 m, a man on the crossing at 1.70 m. Photo-02 values:
#   grey ground floor top 6.4, piano nobile 6.9-11.4, 2nd floor 14.5-18.4, oculi 20.6,
#   wall top 21.0 (crest to 21.9-22.5), NE tower cornice 26.6 at the corner (+1.0 for
#   the set-back of the tower, from the tower/wall ratio on photo 23), crown 29.5-30.6.
# SCALE K = 0.90: the visitors standing at the door on photos 23 and 34 give a door
#   of about 4.3 m (photo 02: 4.9 m), and photo 14 (Nikon, EXIF 27 mm-eq) solved
#   independently comes out about 8-10 % lower; photo 06 (EXIF 24 mm-eq) overlays
#   bay, balcony and plinth lines within a few pixels at K = 0.90. So every height in
#   this file is 0.90 x the photo-02 value: wall top 18.9 m, tower cornice 24.8 m,
#   portal 12.1 m, door 4.4 m (uncertainty about +-8 %).
# BAYS: north facade, from the NE corner: 2.7, 7.9, portal 13.2 (door 3.0 x 4.9 m,
#   ornament 8 m wide at the base, 13.4 m high), 18.3, 22.9 (under the NW tower);
#   Poeta Querol, from the NE corner: 3.8, 12.1, 17.7 (side door), 23.2, (SE tower) 30.5.

[landmark]
name = "Palau del Marqués de Dosaigües"
slug = "palau_del_marques_de_dos_aigues"
main_facade = 20
notes = "Rococo palace (Museo Nacional de Cerámica): alabaster portal with the two Atlantes pouring water and the Virgin of the Rosary, stucco imitation-marble facades, three towers with sculpted crowns, stone balconies."

[landmark.info]
architect = "Hipólito Rovira (design), Ignacio Vergara (portal sculpture)"
built = "15th c.; rebuilt 1740-1744; restyled 1854-1867; wing and SE tower 1969-1972"
style = "Rococo"
heritage = "Bien de Interés Cultural RI-51-0001106"

[defaults]
material = "stucco"
roof_material = "roof"
glass_material = "glass"
door_material = "door"
iron_material = "iron"

[render]
sun = [70, 38]   # summer morning: lights the main (NNE) and Poeta Querol (E) facades
paving = 70

