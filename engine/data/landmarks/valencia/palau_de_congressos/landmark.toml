# Palau de Congressos de Valencia (Foster + Partners, 1993-1998), Av. de les Corts Valencianes 60.
# Generated by a script (scratch gen.py/body.py) from OSM, Catastro, the IGN PNOA orthophoto and
# PNOA-LiDAR building heights (see sources.toml [facts]). Axis frame: s from the S tip (-16.2, 82.41)
# to the N tip (26.0, -80.25) of the lens-shaped roof (168.0 m), t across (+ east).
#   * one lens roof, 168.0 x 73.3 m, its top falling from 18.8 m at the S tip (porch) to 10.4 m at the
#     N tip (LiDAR), rounded metal nosing and fascia, soffit over a column porch at the S end;
#   * stone-clad west wall under a 4.6 m overhang; glazed east foyer with tall pivoting louvres;
#   * SW entrance front: limestone box with windows, glazed atrium above and to the east;
#   * reflecting pools along the east facade and in the porch, porch columns, flagpoles.

