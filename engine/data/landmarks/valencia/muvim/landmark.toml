# MuVIM - Museu Valencià de la Il·lustració i de la Modernitat (Carrer de Quevedo 10 / Guillem de Castro 8).
# Guillermo Vázquez Consuegra, 1997-2001. Generated by gen.py (scratchpad muvim2/gen) from footprint.json
# (OSM outline + Catastro parts), the IGN PNOA orthophoto, IGN PNOA-LiDAR heights and photo cameras solved
# from point matches with EXIF focal lengths (sources.toml [facts]). Blind boxes of fair-faced in-situ
# concrete (formwork panels with tie holes): a long exhibition wing along the Jardí de l'Antic Hospital
# cantilevered over a recessed glazed ground floor, a passage through the knee of the plan under the MuVIM
# sign, the north block with an inclined glazed wall on the plaza and the entrance under a two-layer steel
# pergola on Quevedo, and the NE tower with a glazed lantern.

[landmark]
name = "MuVIM - Museu Valencià de la Il·lustració i de la Modernitat"
slug = "muvim"
main_facade = "facing:ne"
notes = "Plan from OSM way 15218690 and the Catastro parts of 5324524YJ2752C checked on PNOA; heights from IGN PNOA-LiDAR cells and cameras solved from point matches with EXIF focal lengths (tower 19.4 m: Catastro photo solve with the height free, LiDAR 18.8-19.1 m)."

[landmark.info]
architect = "Guillermo Vázquez Consuegra"
built = "1997-2001"
style = "late-modern fair-faced concrete museum"

[defaults]
material = "concrete"
roof_material = "roofdeck"
glass_material = "glass"
frame_material = "steel"
detail = 1.0

[render]
sun = [215, 50]
exposure = 0.6
paving = 75
street_eye = [21.0, 1.6, -66.0]
street_target = [19.0, 8.0, -33.0]
street_fov = 62
hide_context = [122, 123, 124, 129, 132]

[reference_heights]
"part:0" = { height = 17.40, tolerance = 0.8, source = "LiDAR median 17.3 m over the north block roof (n=20); parapet to 18.4 m (photo 06 camera)" }
"part:3" = { height = 12.80, tolerance = 0.5, source = "LiDAR median 12.9 m over the north/north-west band (n=14)" }
"part:6" = { height = 13.60, tolerance = 0.5, source = "LiDAR 13.1-13.7 m over the cantilevered garden gallery (n=14)" }
"part:2" = { height = 16.50, tolerance = 1.6, source = "LiDAR median 16.5 m over the east wing; north-light monitors to ~18 m" }
"part:1" = { height = 15.60, tolerance = 1.2, source = "LiDAR 14.8-16.5 m: roof falls from the knee to the south end" }
"part:5" = { height = 16.90, tolerance = 0.8, source = "LiDAR median 16.9 m over the passage block" }
"part:7" = { height = 19.40, tolerance = 0.6, source = "Catastro-photo camera solved with the tower height free (EXIF 25 mm eq.): 19.4 m; photo 06: 19.4; LiDAR 18.8-19.1 m" }
pergola = { height = 4.25, tolerance = 0.4, source = "LiDAR 3.9-4.4 m over the pergola (n=17)" }
"part:4" = { height = 16.00, tolerance = 1.0, source = "LiDAR 15.6-16.3 m over the west wing north of the bend" }

# Fair-faced in-situ concrete: pale grey, slightly warm in sunlight (photos 10 and C: RGB ~ 125/120/110),
# formwork panels about 2.5 x 1.25 m with tie holes
