# Torre Hilton / Hotel Meliá València (Av. de les Corts Valencianes 52, València).
# 2006, the tallest hotel in Valencia: a square glass-and-aluminium tower (23.4 x 23.4 m) with three
# stacked convex glazed bays on its NW, SW and SE faces and open frames at its crown, a narrow
# 117 m glass slab carrying the hotel name on its NE side, a 15-storey square block with bays on
# its NW, NE and SE faces, and a two-storey podium (lobby on the avenue, conference halls with a
# pool terrace to the NE). Plan from Catastro/OSM building parts (checked on the PNOA orthophoto),
# heights from the IGN PNOA-LiDAR building-height grid and camera solves (see sources.toml [facts]).
#
# GENERATED by scratchpad hilton/gen.py from params.json; edit the generator, not this file.

