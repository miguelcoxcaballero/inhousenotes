# Palau de Justícia de València (Palacio de Justicia), antigua Real Aduana / Casa de la Duana.
# Built 1758-1802 for Charles III by Antoni Gilabert and Felip Rubio, finished by Tomàs Miner;
# sculpture by Ignasi Vergara; tobacco factory 1828-1914, courts since 1914-1922 (ca/es.wikipedia).
#
# Written by a generator (scratchpad pdj/gen.py); every number below comes from data:
# PLAN: OSM relation 18681032, a 63.8 x 47.6 m rectangle turned 21.8 deg (two light wells as
#   inner rings); the IGN PNOA orthophoto (WMS pnoa-ma, CC BY 4.0) overlaid on it matches the
#   roof outline within ~0.3 m. Main facade = NE edge (Carrer del Palau de Justícia, faces az
#   21.8) with the frontispiece; NW = Plaça d'Alfons el Magnànim, SE = Plaça de la Porta de la
#   Mar, SW = Carrer de Cerdà de Tallada.
# BAYS: PNOA shows a dormer ridge over every window axis: 6.45 m apart on all four sides; long
#   sides 9 axes (NE: pavilion + 3 + frontispiece + 3 + pavilion, centre gap 14.8 m; SW: 7 brick
#   bays), short sides 7 axes (pavilion + 5 + pavilion). Corner pavilions in stone with
#   rusticated quoins: 8.2 m (NE), 9.2 m (SW), 7.7 m (NW/SE) along each facade. Photo 06 gives
#   centre-to-first-axis / bay = 1.22 (PNOA 7.5 / 6.45 = 1.16).
# HEIGHTS: joint camera solve of photos 01, 07, 10 (EXIF focal lengths, eye height 1.6 m prior,
#   footprint corners fixed, RMS 1.0 px): cornice top 21.0 +-0.4 m, corner finial tips 26.4,
#   statue base 27.1, statue top 30.5 m. Storeys measured on the NE corner pavilion with the
#   solved camera of photo 07: grilled ground windows 1.2-3.4, doors 3.9 m (checked against a
#   1.68 m passer-by on the Catastro photo: 3.9 m), mezzanine 4.8-7.7, piano nobile 9.2-12.7
#   (pediments to 14.3), second floor 15.1-17.9, architrave 18.4, cornice 19.9-21.0,
#   balustrade to 22.8, pedestals 23.2, dormers 21.7-24.4, pediment apex 23.7 m.

[landmark]
name = "Palau de Justícia de València"
slug = "palau_de_justicia"
main_facade = "facing:n"
notes = "Former Royal Customs House (1758-1802): brick walls between stone pilasters, stone corner pavilions, balustrade with flame finials and dormer niches, frontispiece crowned by Charles III between Prudence and Justice."

[landmark.info]
architect = "Antoni Gilabert, Felip Rubio; finished by Tomàs Miner (1802); sculpture Ignasi Vergara"
built = "1758-1802; reformed 1910-1922 (Vicent Rodríguez)"
style = "Neoclassical (academic) with Baroque cornice"
heritage = "Bien de Interés Cultural RI-51-0004574"

[defaults]
material = "stone"
roof_material = "roof_tiles"
glass_material = "glass"
door_material = "door"
iron_material = "iron"

[render]
sun = [120, 42]
paving = 70

[reference_heights]
"outline:0" = { height = 21.0, tolerance = 4.0, source = "cornice top 21.0 m, joint camera solve of photos 01/07/10; roof ridge ~23.5" }
cornice = { height = 21.0, tolerance = 0.6, source = "camera solve photos 01/07/10" }
charles_iii = { height = 30.5, tolerance = 0.8, source = "camera solve photos 01/07/10" }

