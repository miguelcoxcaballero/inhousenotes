# Edifici del Rellotge (Edificio del Reloj), Moll de la Duana / Muelle del Turia, Port of Valencia.
# Built 1916 (Wikidata P571; Catastro records 1926 works) by the engineer Federico Gomez de Membrillera (Commons calls it the former maritime station); today the
# headquarters of the Autoritat Portuaria de Valencia. French-academic eclectic block: rendered walls, ground floor
# of round-arched doors and windows, first floor with balconies and segmental pediments, entablature and stone
# balustrade with urns, a slate mansard with oeil-de-boeuf dormers and an iron cresting, two corner pavilions with
# an arched attic and coat of arms, and the slender clock tower at the SE corner (corbelled iron gallery, clock
# stage with four faces and pediments, slate bell cap, open lantern and ship weathervane).
# GENERATED by scratchpad rel/gen.py; every dimension and its source is in sources.toml [facts].
# Plan: OSM relation 21033515 (= Catastro 0304162YJ3700G within 0.1 m; edges checked on the IGN PNOA orthophoto),
# tower re-measured on photos 01/05 (3.8 m square, west face 0.8 m west of the SE corner).
# Heights: frontal photos 05/01 scaled by the 37.6 m visible S facade + a constrained bundle solve on photos
# 01/12/06/Catastro (4 cameras, free focal, eye-height prior 1.6 m).

[landmark]
name = "Edifici del Rellotge"
slug = "edifici_del_rellotge"
main_facade = "facing:200:10"
notes = "Port of Valencia building of 1916 (former maritime station), now the Port Authority: two-storey rendered block with slate mansard, oculus dormers and iron cresting, corner pavilions and a 27.8 m clock tower at the SE corner."

[landmark.info]
architect = "Federico Gomez de Membrillera (engineer)"
built = "1916"
style = "Eclectic, French academic, with Valencian modernisme details"
heritage = "Bien de Relevancia Local"

[defaults]
material = "render"
roof_material = "slate"
glass_material = "glass"
door_material = "door"
frame_material = "frame"
iron_material = "iron"

[render]
sun = [200, 50]
paving = 70
exposure = 0.6
hide_context = ["context:15", "context:17", "context:18", "context:19"]

[reference_heights]
body = { height = 9.9, tolerance = 0.3, source = "photo 05 frontal + bundle solve: cornice top" }
mansard_top = { height = 13.9, tolerance = 0.4, source = "photos 01/05 (far) and 03/09/10 (near) overlays, +-0.3 m" }
vane = { height = 27.8, tolerance = 0.6, source = "photos 05 + bundle solve 01/12/06/C" }
"part:0" = { height = 13.9, tolerance = 0.5, source = "mansard top, photos 01/05/03/09/10 (OSM levels tag 2 ignores the mansard)" }
"part:1" = { height = 13.9, tolerance = 0.5, source = "mansard top, photos 01/05/03/09/10" }
"part:2" = { height = 9.9, tolerance = 1.0, source = "inner block under the courtyard roofs, not visible from the street: assumed at cornice level" }
"part:3" = { height = 12.0, tolerance = 1.5, source = "thin outer ring of OSM: balustrade 10.8 m, pavilion attics 12.1 m, mansard slope behind" }
"part:4" = { height = 27.8, tolerance = 1.0, source = "clock tower vane, photo 05 + bundle solve" }

