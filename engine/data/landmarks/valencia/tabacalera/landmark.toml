# Antiga Fàbrica de Tabacs de València (Tabacalera), Carrer d'Amadeu de Savoia 11-13.
# Tobacco factory by Ramón Lucini Callejo, 1905-1909 (Celestino Aranguren also credited by OSM);
# buff brick on a stone socle, three storeys round three courtyards with a four-storey central
# pavilion crowned by the clock pediment with the city arms and the bat; municipal offices since
# the 2010s restoration (Carratalá, Alapont, Martínez). Generated by scratchpad tab/gen.py; every
# number below is in sources.toml [facts].
#
# PLAN (OSM relation 9603911 = Catastro 7029501YJ2772G, checked on the IGN PNOA orthophoto):
#   main block 120.4 m along Amadeu de Savoia (az 199) x 74.8 m, rotated 18.6 deg; corner pavilions
#   12.5 m square projecting 0.5 m on the S and E fronts; central pavilion 40.3 x 16.4 m projecting
#   0.6 m; perimeter wings 12.1 m deep (Catastro court notches); courts A (west) and B (east)
#   20.4 x 42.6 m with three-storey galleries 2.8-4.3 m deep (OSM inner rings vs Catastro);
#   small court 21.9 x 15.9 m on the axis; glass-roofed atrium 22.6 x 11.3 m behind the pavilion
#   (Catastro notch, PNOA); north hall (old naus) 120 x 15.6 m beyond a 12 m open internal street.
# HEIGHTS: bundle adjustment of photos 01 and 08 (scratchpad tab/ba.py, 2 cameras, 70 point
#   observations, rms 2.6 / 3.7 px, scale = pavilion width 40.3 m) for the facade; IGN PNOA-LiDAR
#   building heights (2.5 m cells) for roofs: wing ridge 19.6, pavilion ridge 25.6, flat spine
#   17.0, galleries ~12.3, north hall eaves 8.0 / ridge 11.0.

[landmark]
name = "Antiga Fàbrica de Tabacs"
slug = "tabacalera"
main_facade = 19   # pavilion front on Amadeu de Savoia (edge 19, az 199)
notes = "Tabacalera de València: 1909 buff-brick tobacco factory round three courtyards, clock pediment over the central pavilion; Ajuntament offices."

[landmark.info]
architect = "Ramón Lucini Callejo (1905-1909); restoration Luis and Diego Carratalá, José Luis Alapont, Enrique Martínez"
built = "1905-1909 (Catastro 1906)"
style = "Industrial eclectic / Valencian modernisme in exposed brick"
heritage = "Bé de Rellevància Local (2004)"

[defaults]
material = "brick"
roof_material = "roof"
glass_material = "glass"
frame_material = "white_frame"
door_material = "door"
iron_material = "iron"

[render]
sun = [200, 50]
paving = 90
hide_context = ["context:42", "context:45", "context:46", "context:49"]   # Catastro 1-floor items inside courts A, B, the small court and the internal street (open on PNOA)

[reference_heights]
"part:2" = { height = 25.6, tolerance = 1.0, source = "IGN PNOA-LiDAR: pavilion hip ridge 25.3-25.6 m" }
"part:1" = { height = 11.0, tolerance = 1.0, source = "IGN PNOA-LiDAR: north hall ridge 11.0-11.1 m" }
"part:0" = { height = 19.7, tolerance = 1.0, source = "IGN PNOA-LiDAR: wing hip ridges 19.3-19.7 m (cornice 17.7 m, BA photos 01+08)" }
"outline:0" = { height = 19.7, tolerance = 1.0, source = "IGN PNOA-LiDAR: wing ridges 19.5, pavilion 25.6, north hall 11.0" }
clock_pediment = { height = 27.85, tolerance = 0.5, source = "BA photos 01+08: pediment pier top" }

