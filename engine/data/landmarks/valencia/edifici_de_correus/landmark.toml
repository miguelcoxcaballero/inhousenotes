# Edifici de Correus i Telegrafs (Palacio de Comunicaciones), Placa de l'Ajuntament 24, Valencia.
# Miguel Angel Navarro Perez, 1915-1922 (inaugurated 1923): eclectic stone palace facing the town hall across the
# plaza. Plaza front: two wings of four bays, a central frontispiece (two pylons with paired giant Ionic columns,
# a great arch with a glazed lunette and the five-continents group, attic with the clock, two sculpture groups of
# angels with the globe and the telegraph), square pavilions and round corner bays crowned by zinc-scale domes;
# an iron lattice tower with gallery, lantern and armillary sphere behind the clock; the oval hall under a large
# stained-glass dome (visible from above) in the middle of the block.
# GENERATED by scratchpad cor/gen.py: every dimension is listed with its source in sources.toml [facts].
# Plan: OSM way 513696236 + 9 building:parts (checked on the IGN PNOA orthophoto, within ~0.4 m) and Catastro
# 5923101YJ2752D (light wells). Heights: constrained camera solve on the Catastro facade photo (fixed principal
# point, eye height prior 1.6 m, 11 matches, 4 px rms), cross-checked on photos 05 and 13 (joint solve).
# Fronts are 3 m deep skin masses that carry the openings; the core behind is cut back.
# check() reports "model too high" against the OSM building:levels tags: storeys here are ~4-5 m.

[landmark]
name = "Edifici de Correus i Telegrafs"
slug = "edifici_de_correus"
main_facade = "facing:254:6"
notes = "Eclectic post and telegraph palace on the Placa de l'Ajuntament: cream limestone plaza front with arched ground floor, paired Ionic columns, central frontispiece with the great arch, clock attic and two sculpture groups, square pavilions and round corner bays with zinc-scale domes and lanterns, an iron lattice tower with armillary sphere, and the oval hall's stained-glass dome in the middle of the block."

[landmark.info]
architect = "Miguel Angel Navarro Perez"
built = "1915-1922 (inaugurated 1923)"
style = "Eclectic / Valencian modernisme"
heritage = "BIC"

[defaults]
material = "stone"
roof_material = "terrace"
glass_material = "glass"
