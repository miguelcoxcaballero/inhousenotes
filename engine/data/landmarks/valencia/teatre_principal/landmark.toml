# Teatre Principal de Valencia (Teatro Principal), Carrer de les Barques 15.
# Project Filippo Fontana (1808), built 1808-1832; facade by Jose Zacarias Camana (1854, rebuilt
# in its present neoclassical form); later interior works; BIC RI-51-0004781.
#
# Generated by scratchpad tp/gen.py. Every dimension is one of the measured values in
# sources.toml [facts]:
#   PLAN: OSM way 23377878 and its building:parts (= Catastro 5925901YJ2752F within 0.1 m),
#   checked on the IGN PNOA orthophoto: front 26.62 m wide, facing azimuth 174.1; central
#   portico projection 1.38 m deep (OSM / PNOA step) and 14.7 m wide (photo 09 ratio,
#   OSM 13.8 m); four columns at 4.25 m centres (photo 09 back-projection).
#   HEIGHTS: constrained bundle adjustment of photos 09 and 03 (no EXIF: focal free with
#   eye-height prior 1.6 m, upright solve for the perspective-corrected 03) with the facade
#   width as scale: ground floor 5.6 / cornice 6.1, column pedestals 7.7, capitals 15.3,
#   wing cornice 17.0, balustrade 18.65, portico entablature 17.45, attic 19.15, crest block
#   19.6 m (+-0.3 m). Side, fly-tower and auditorium roofs from photos 16, 18, 19, C and
#   the PNOA roof pattern (gable ridges N-S on the auditorium and the fly tower).

[landmark]
name = "Teatre Principal de València"
slug = "teatre_principal"
main_facade = "facing:174:8"
notes = "Neoclassical theatre (project Filippo Fontana 1808, opened 1832; facade by Jose Zacarias Camana 1854): rusticated ground floor with three arched entrances; giant tetrastyle Ionic portico on a balconied podium carrying an entablature lettered TEATRO PRINCIPAL, a balustraded attic and a sculpted crest; side bays with balcony windows and lunettes; long brick (east) and stucco (west) side fronts; gabled auditorium and fly-tower roofs."

[landmark.info]
architect = "Filippo Fontana (project, 1808); José Zacarías Camaña (facade, 1854)"
built = "1808-1832; facade 1854; reforms 1890 (Catastro) and later"
style = "Neoclassical"
heritage = "Bien de Interés Cultural RI-51-0004781"

