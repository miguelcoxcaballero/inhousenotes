[landmark]
name = "Estadi de Mestalla"
slug = "estadi_de_mestalla"
main_facade = "facing:w"
notes = "Valencia CF stadium (1923; tribuna 1927; rebuilt 1939-41; south stand and north extension 1950-55; Grada Central and offices 1969-72; anfiteatro upper tiers 1998-2001). Steep concrete bowl round a 105 x 68 m pitch; west main stand (tribuna) under a steel gabled roof with a four-gallery facade, lattice screen and cantilever brackets on the avinguda de Suecia; north and south ends and the east stand with a 1998 upper tier overhanging the streets on stepped soffits; round access towers."

[landmark.info]
architect = "Francisco Almenar Quinza (1923, 1927); Manuel and Salvador Pascual Gimeno (1939-1955)"
built = "1923; enlargements 1927, 1950-1955, 1969-1973, 1998-2001"
capacity = "49 430"
pitch = "105 x 68 m"

[defaults]
material = "concrete"
frame_material = "iron"

