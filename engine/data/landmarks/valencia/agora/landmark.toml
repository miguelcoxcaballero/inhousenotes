# L'Agora (Santiago Calatrava, 2009), Ciutat de les Arts i les Ciencies, Valencia: the covered plaza
# next to the Assut de l'Or bridge. A steel shell on a lens plan clad in dark violet-blue trencadis with
# triangular steel blades, green glazing on the upper flanks behind a white boundary band, two white
# serrated crest wings over a skylight valley, a glazed base band, and a folded prow at each end.
# Generated by a script (axis frame s along the lens axis, azimuth 35.7 deg, + = NE tip; t across,
# + = SE). Every dimension and its source: sources.toml [facts]. In short:
#   * plan: lens of two circular arcs (R 57.1 m), 103.5 m tip to tip, 66.0 m wide (OSM = Catastro = PNOA);
#   * crest: 81.1-81.3 m (comb tops 82.1 m) in the middle (PNOA-LiDAR, NW crest and axis cells), the two
#     crests at the same height (end-on photos 10 and 14 show both tips level within 1 m);
#   * section: LiDAR cross-section at s = 0 corrected by half a cell (the layer keeps each cell's maximum),
#     straight blue flank leaning ~17 deg, green flank ~26 deg set back behind the boundary band (58 m);
#     towards the prows the section tapers (exponent q up to ~1.9) so the end-on silhouette is a straight A;
#   * prows (joint bundle adjustment of photos 08, 10, 12, 13, Catastro, 14, 07, 16, 04 on the tip, the base
#     glazing line and the LiDAR crest): horn tips H at s = -41.5 m / 42.3 m (SW) and s = +30.7 m / 49.5 m (NE),
#     3.1 m off the axis; band ends J at 29.1 m (SW) and 38.8 m (NE); each side of a prow is a flat folded
#     panel T-J-H, with rounded horn ridges H-T and a recessed centre strip under the valley end;
#   * blades every 2.2 m (PNOA periodogram), 1.4 m deep low down, tapering upward; glazed base 5.5 m tall in
#     the middle, fading to 0 at both prows;
#   * the 163 movable steel louvres planned for the crest were never installed: modelled as photographed.

[landmark]
name = "L'Àgora"
slug = "agora"
main_facade = "facing:se"
notes = "draft"

[landmark.info]
architect = "Santiago Calatrava"
completed = 2009
style = "Neo-futurism / structural expressionism"
plan_m = "103.5 x 66.0 (lens of two circular arcs)"
height_m = "82"

[defaults]
material = "white_steel"
detail = 1.0

[render]
sun = [205, 52]
paving = 150
exposure = 0.55
street_eye = [15.7, 1.6, 121.6]
street_target = [-10.8, 23.9, 72.7]
street_fov = 52

[reference_heights]
"outline:0" = { height = 82.1, tolerance = 1.5, source = "IGN PNOA-LiDAR building height (wms-mapa-lidar.idee.es, edificios-h30), NW crest and axis cells 80.5-82.1 m (comb tops)" }

[material.trencadis_blue]
# photo 12 median in the sun (23,20,44): very dark violet-blue (R > G), glossy broken tiles
kind = "glazed_tiles"
colors = ["#0b0628", "#110a38", "#08051e", "#170f48", "#201658"]
weights = [0.3, 0.3, 0.2, 0.12, 0.08]
pattern = "plain"
uv_scale = 0.7
roughness = 0.35
clearcoat = 0.45

[material.glass_green]
# photo 12 median (107,128,95): grey-olive green
kind = "curtain_wall"
color = "#55684c"
uv_scale = 2.6

[material.glass_base]
# dark glass behind the white V struts
kind = "curtain_wall"
color = "#4f5d58"
uv_scale = 4.0

[material.white_steel]
kind = "white_steel"
tint = "#f2f2ee"

[material.white_steel_roof]
kind = "white_steel"
tint = "#e9ebe8"
roughness = 0.5

