# L'Agora (Santiago Calatrava, 2009), Ciutat de les Arts i les Ciencies, Valencia:
# the covered plaza next to the Assut de l'Or bridge. A steel shell on a lens plan,
# clad in dark blue trencadis with vertical fins, green glazing on the upper flanks,
# two white serrated crest wings over a central skylight valley, a glazed base band.
# Generated by a script (axis frame s along the lens axis, azimuth 35.7 deg, + = NE tip;
# t across, + = SE). Dimensions and sources: sources.toml [facts]. Measured:
#   * plan: lens of two circular arcs (R 57.1 m), tip to tip 103.5 m, 66.0 m wide (OSM =
#     Catastro = PNOA orthophoto); the shell bottom edge overhangs the base glazing ~0.5 m;
#   * crest line heights (PNOA-LiDAR, 2.5 m cells along the axis and at t = -6 m): 81.6 m at the
#     middle, asymmetric ends: the crest runs out to s = -46 m at the SW (horns ~42 m, a
#     near-vertical prow) but stops at s = +33 m at the NE (horns ~54 m, long sloping prow);
#   * side sections from the LiDAR cross-sections at s = 0 / +-25 m (convex, ~18 deg lean at the
#     base); blue/green boundary 58 m at s = 0 (orthophoto relief + photos);
#   * fins every 2.2 m along the axis (PNOA periodogram), glazed base 5.5 m tall in the middle
#     fading to 0 at the prows (photos 12, 13, Catastro);
#   * the movable steel louvres (163 "lamas") that should crown the crest were never installed:
#     modelled as photographed (white crest wings with serrated combs over a skylight valley).

