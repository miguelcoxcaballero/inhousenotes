# Palau de la Batlia (Palacio de la Baylía, Palau de Jàudenes), Plaça de Manises 4, València.
# Seat of the Diputació de València. Gothic palace of the Batle General (15th c.); the plaza front
# is the 19th-c. eclectic/neoclassical facade: five bays, four storeys (rusticated yellow ground
# floor with a pink rusticated centre bay and round-arched portal under the Diputació arms, main
# floor with balconies and triangular pediments, second floor with small balconies and segmental
# hoods, attic frieze with five oval oculi in cartouches), banded pilasters, classical cornice,
# blocking course and a segmental crest over the centre bay. Corner with Carrer dels Serrans.
#
# Generated by scratchpad batlia/gen/gen.py; every number is in sources.toml [facts].
#
# PLAN: facade line = Catastro plaza line (context parcels on Plaça de Manises, az 93.3), SW corner
#   = Catastro part 5 corner (-11.74, 17.05); facade length 25.0 m from the PNOA orthophoto (roof
#   incl. cornice -12.6..13.2 = 25.8 m at 5 cm/px, minus 2 x 0.35 m cornice projection; the OSM way
#   is 22.7 m and ~0.8 m north of the Catastro line, its east end stops 1.5 m short of the dark
#   gap between the Batlia and the next roof). Wings: Catastro parts 5 (W/N wing, 5 floors),
#   2 (inner block, 6 floors), 3 (NE wing, 3 floors), 7 (covered patio, 1 floor); the rest of the
#   parcel behind the front is the 4-floor main parcel ('IV' on the Catastro map).
# HEIGHTS: constrained bundle adjustment (scratchpad batlia/ba.py) of photos 01, 06 and the Catastro
#   facade photo (f = 2917 px from EXIF), 29 matches, scale from the facade length: cornice top
#   17.5, frieze band 15.9, 2nd-floor string 11.65, ground-floor cornice 6.62, crest apex 18.86,
#   portal apex 4.95 (2.2 m wide). Balcony railing of photo 01 back-projects to 0.95 m (check).

[landmark]
name = "Palau de la Batlia"
slug = "palau_de_la_batlia"
main_facade = "facing:s"
notes = "Diputació de València: five-bay neoclassical/eclectic front on Plaça de Manises (yellow rusticated ground floor, cream upper floors, iron balconies, oval attic oculi, segmental crest), plain rear wings."

[landmark.info]
built = "15th-c. Gothic palace of the Batle General; present plaza facade 19th c. (eclectic); Diputació since 1952"
style = "Gothic core, eclectic / neoclassical facade"
heritage = "Bé de Rellevància Local (BRL 01.01.25)"
address = "Plaça de Manises 4"

[defaults]
material = "stucco"
roof_material = "roof"
glass_material = "glass"
door_material = "door"
iron_material = "iron"

[render]
sun = [200, 50]
paving = 60
street_eye = [-2.0, 1.6, 46.0]
street_target = [0.8, 9.0, 18.0]
street_fov = 55
hide_context = ["context:461"]

[reference_heights]
"catastro:2" = { height = 18.2, tolerance = 1.0, source = "BA photos 01/06/C: cornice 17.5 + blocking course 0.7 (Catastro 5 floors)" }
"catastro:0" = { height = 20.0, tolerance = 1.5, source = "Catastro part 2, 6 floors (not visible from the plaza; PNOA shadow to the W)" }
"catastro:1" = { height = 10.8, tolerance = 1.5, source = "Catastro part 3, 3 floors" }
front_body = { height = 17.5, tolerance = 0.5, source = "BA: cornice top 17.5 m" }
crest = { height = 18.86, tolerance = 0.5, source = "BA: segmental crest apex 18.86 m" }

