# Real Parroquia de los Santos Juanes (Sant Joan del Mercat), Valencia.
# Gothic single nave (14th-15th c.) with chapels between internal
# buttresses, rebuilt after the 1592 fire; Baroque bell tower (1625-1650),
# Baroque east facade on the Placa del Mercat (1700) crowned by the clock
# espadana with the "pardal de Sant Joan" (eagle weathervane), Capella de la
# Comunio (18th c.) with a blue glazed-tile dome, and the "covetes" (sunken
# shops) under the terrace in front of the east facade.
#
# Plan: OSM way 183237709 and its building:parts, checked on the IGN PNOA
# orthophoto and the Catastro map (parcel 5528401YJ2752H).
#   part:0  nave (polygonal apse at the east)      part:5  bell tower (SW corner)
#   part:1  covetes + terrace (0.5 levels)         part:3  Comunio dome circle (r 4.2)
#   part:2,4,6,8,9,10  fill between the apse and the Baroque east screen
# Heights: constrained bundle adjustment over photos 01, 02, 08 and extra/27
# (scratchpad sj/ba.py, eye prior 1.6 m, f prior from EXIF for photo 01),
# see sources.toml [facts].
#
# Frames: the east facade is laid out in a group whose local x runs along the
# facade chord from its S end (23.0, 14.3) to its N end (14.1, -13.15)
# (28.86 m, rotate_y 107.9), y up, local +z out of the facade (azimuth 72).

[landmark]
name = "Real Parroquia de los Santos Juanes"
slug = "sants_joans"
main_facade = "facing:e"
notes = "Gothic nave with chapels and buttress pinnacles, Baroque bell tower, Baroque east facade with clock espadana and eagle vane over the covetes terrace, blind Gothic oculus on the west front, blue tiled dome of the Comunio chapel."

[landmark.info]
architect = "Gothic church after 1311 / 1368; tower 1625-1650; east facade 1700 (Jacopo Bertesi sculpture)"
style = "Valencian Gothic, Baroque"
heritage = "BIC RI-51-0001207 (1947)"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
door_material = "doors"
iron_material = "iron"

[render]
sun = [200, 52]
paving = 70

