# Palau del Marqués de Campo (Palau de Berbedel / Palacio del Marqués de Campo), Plaça de
# l'Arquebisbe 3, València. Museu de la Ciutat since 1989. 17th-c. house of the counts of Olocau
# bought in 1840 by José Campo, 1st marqués de Campo, who had the facade remade (works by Manuel
# Ferrando, 1857; later owned by the counts of Berbedel; ca.wikipedia): pink stucco
# facade with two corner towers (miradors) crowned by balustraded attics with urn finials, a
# stone ground floor with two carriage doors and coats of arms in the centre, giant pilasters,
# a segmental pediment and a balustraded attic with a rococo crest; staircase under a tiled
# dome to the right of the courtyard; yellow courtyard with an arcade and a glazed mirador; east of
# the right tower a glazed gap (the 'Serre') and the facade of the adjoining houses added in the 1990s.
#
# Generated by scratchpad gen.py; every number is in sources.toml [facts].
#
# PLAN: outline osm:relation/7286126 (IoU 1.0 with OSM). Main facade = edge 3 (22.72 m, az 190)
#   on the plaza; its ends are the W corner (-26.18, 11.27) and the OSM node (-3.80, 15.18),
#   which a bundle adjustment of photos 03/04/C (below) independently puts at the east face
#   of the right tower (u3 = 21.9 +- 0.6 m with the left tower fixed at the orthophoto width).
#   Towers 6.4 m wide (u 0-6.4 and 16.1-22.72), centre 9.7 m: PNOA 2024 orthophoto (left tower
#   roof 6.25 m, centre 10.5 m at roof level) and the tower/centre ratio 0.67-0.71 on photos
#   04 and C. Courtyard = OSM inner ring (matches the orthophoto). Staircase dome centred on
#   Catastro part 0 (the 10 m octagon of the stair hall). East of x = 4.5 the block is the
#   lower annex seen on PNOA (pale flat/glazed strip x 4.5-8.5, tiled hip roof x 8.5-21.6).
# HEIGHTS: constrained bundle adjustment (scratchpad pmc/ba/ba.py): 4 cameras (photos 03, 04, 23
#   and the Catastro facade photo), 50 pixel matches, eye-height prior 1.6 m, free lens shift for
#   the perspective-corrected photos; scale from the plan (left tower 6.3 +- 0.3 m on PNOA, facade
#   22.72 m on OSM; the solve returns the right tower end at u = 22.5 +- 0.5). Results (+-3 %):
#   tower lower body / string 12.2, tower cornice 15.0, tower attic coping 16.7, finial tips 18.7
#   (inset 0.9 m), central entablature 12.4, central balustrade 13.8, ball finials 15.0, pediment
#   crown 13.7, crest finial 16.3, principal balcony 5.6, W wing eave 15.2, tower depth 6.3 +- 0.5.
#   Doors 2.4 x 4.5 m (height/width 1.8-1.9 on photos 27 and 01), centres 2.65 m either side of
#   the centre (photo C). Tower windows: ground 0.6-1.9, entresol 2.45-3.6 (photo 02 overlay).
#   Dome lantern base solved at (-4.9 +- 1.1, 22.5 +- 1.1, 0.3) from photos 04 and 23; the dome is
#   placed at (-2.6, -0.5), between that and the PNOA apex (0, -1.75, leaning east) and the
#   Catastro stair octagon (-0.9, 0.1); apex 22.3 m, lantern to 23.6 m.

[landmark]
name = "Palau del Marqués de Campo"
slug = "palau_del_marques_de_campo"
main_facade = 3
notes = "Museu de la Ciutat: pink stucco palace with two belvedere towers, stone centre with two carriage doors, segmental pediment and balustraded attic, tiled staircase dome, yellow arcaded courtyard."

[landmark.info]
architect = "Manuel Ferrando (works of 1857 for José Campo, marqués de Campo); museum restoration Manuel Portaceli (1989)"
built = "17th c. house of the counts of Olocau; bought by José Campo 1840, facade remade 1857; museum 1989"
style = "Late baroque / neoclassical"
heritage = "Bien de Interés Cultural RI-51-0012184"

[defaults]
material = "stucco"
roof_material = "roof"
glass_material = "glass"
door_material = "door"
iron_material = "iron"

[render]
sun = [215, 48]
paving = 60

[reference_heights]
"outline:0" = { height = 16.7, tolerance = 1.0, source = "bundle adjustment photos 02-27: tower attics 16.7 m (wing eave 15.2, dome lantern 23.5)" }
tower_w_attic = { height = 16.70, tolerance = 0.6, source = "bundle adjustment: tower attic coping" }
centre_attic = { height = 13.80, tolerance = 0.5, source = "bundle adjustment: central balustrade top" }

