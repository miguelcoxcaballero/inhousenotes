# Estacio del Nord (Estacion del Norte), Valencia. Demetrio Ribes Marco,
# 1906-1917, Valencian Modernisme (Secession / Art Nouveau); iron train shed
# by Enrique Grasset. BIC RI-51-0004890.
#
# GENERATED by a script (frame and measurements below); edit the numbers in
# the script's terms if regenerating.  Frame: the station grid is turned
# 13 deg clockwise from the city grid.  u = along the Carrer de Xativa front
# (towards ESE), w = depth towards the tracks (SSW):
#   x = u cos13 - w sin13,  z = u sin13 + w cos13.
# The Xativa front faces azimuth 13 (NNE); the Bailen side 283, the Alacant
# side (bullring) 103.
#
# Plan (OSM parts, metres in u/w): Xativa block u -33.0..37.6, front of the
# wings w -86, back w -68.3; clock pavilion u -2.55..7.15 projecting to
# w -90.85; corner towers 9.9 m square projecting to w -95; side wings along
# the platforms (w -68..124), 9.7-12.6 m deep, with taller mid pavilions at
# w 27..44; the train shed spans the 44.6 m between them (Grasset's 45 m)
# for 192 m.
#
# Heights (no official numbers published; measured on photos 02, 04, 05, 14
# against the OSM widths: tower 9.9 m, pavilion 9.7 m, door 2.75 m):
# wing cornice 9.6 m, parapet 10.5 m, pedestals 11.5 m; pavilion side bays
# 12.4 m, clock 12.15 m, round gable 14.6 m, inner pinnacles 15.2 m, eagle
# on the globe to about 18 m; towers: cornice 12.8 m, attic 16.2 m, front
# turret crowns 18.4-18.6 m, back 17.0 m (OSM tag 15 m = attic roof); side
# wings 8.6 m cornice; shed clerestory 10.5-12.2 m, vault apex 18.8 m +
# 1.6 m ridge lantern (checked on photos 04, 12, 14, 24 with solved cameras).
#
# Views: cameras with `match` are solved by the tool; the others were set
# by hand (eye/target) and checked with `render --view <n> --edges-only`.
# Photo 02 is a cylindrical panorama (only approximate). Every view turns the
# context off because OSM maps the two Xativa marquees as buildings
# (context:0/1) that would hide the ground floor.

[landmark]
name = "Estacio del Nord"
slug = "estacio_del_nord"
main_facade = "facing:13:20"
notes = "Xativa front with two corner towers, central clock pavilion crowned by the bronze eagle on a globe, wings with an iron marquee; orange-and-leaf ceramic garlands, Valencian lozenges and stars; side wings with arched windows along the platforms; Grasset's 45 m iron train shed (elliptic barrel with clerestory and ridge lantern, rounded north hip)."

[landmark.info]
architect = "Demetrio Ribes Marco (passenger building); Enrique Grasset Echevarria (train shed)"
built = "1906-1917"
style = "Valencian Modernisme"
heritage = "BIC RI-51-0004890"

[defaults]
material = "stucco"
roof_material = "roof"
glass_material = "glass"
frame_material = "frame"
iron_material = "iron"
detail = 0.7

[render]
sun = [200, 50]
exposure = 0.5
paving = 110
street_eye = [33.7, 1.7, -135.9]
street_target = [22.5, 9.0, -87.2]
street_fov = 60

