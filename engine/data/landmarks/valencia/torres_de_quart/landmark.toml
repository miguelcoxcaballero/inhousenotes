# Torres de Quart (Porta de Quart), Valencia. Late Gothic city gate of the
# 14th-century Christian wall, built 1441-1460 by Pere Bonfill with Francesc
# Baldomar, Pere Compte, Tomas Oller and Jaume Perez (Wikipedia ca/es).
#
# Frame: landmark-local metres, x east, z south. The gate axis runs almost
# exactly west-east: the outer (field) face looks west to Carrer de Guillem
# de Castro, the inner face looks east up Carrer de Quart to the old town.
# Seen from outside (west) the NORTH tower is on the left; seen from the
# city (east) it is on the right.
#
# Plan (OSM building:parts, identical to the Catastro parts to 5 cm):
#   * two towers, semicircular to the field (fitted circles: north centre
#     (-3.77, -6.01) r 7.34, south (-3.46, 17.17) r 7.52) and rectangular to
#     the city, ending in a flat east face at x = 5.8-6.1 (the "planta
#     rectangular modificada"); OSM parts 0 and 1;
#   * the gate body between them: the outer wall plane runs (-2.44, 1.30) to
#     (-1.69, 9.50) (az 265, 5 deg off the grid, "ligeramente oblicua"),
#     OSM part 4 (1.5 m strip) + part 2, which projects 4 m east of the
#     towers as the inner gate block (x 9.1-10.0);
#   * round spiral-stair turrets inside each tower near the gate (parts 5, 6,
#     r 1.55) that rise above the tower terraces;
#   * the surviving stretch of the medieval wall running north (part 3) and a
#     small spur (part 7).
#
# Heights, from camera fits of the photos against the plan (see the [[view]]
# notes; tools: least squares of camera + unknown heights on photo pixels):
#   * photo 32 (130 m south, almost orthographic): merlon tops 35.9 m,
#     parapet 34.6, machicolation arch crowns 32.6, corbel heads 31.0, crown
#     string course (bocel) 29.5 - OSM gives 34 m;
#   * photo 17 (inner face): tower east-face parapet 33.6-34.1 m, ground
#     storey string 10.6, first-floor arch apex 19.6, second-floor sill 22.0,
#     second arch apex 31.0; inner gate block parapet 20.9, its string 10.5,
#     its first-floor arch apex 18.5, inner gate arch apex 7.7;
#   * photo 39 (outer face): gate arch 4.8 m wide, apex 7.7 m (round,
#     "arco de medio punto"), string course 12.9, gallery corbels from 18.6,
#     gallery parapet 22.4, gallery merlons 23.9, upper wall merlons 27.4.
#
# Construction (Wikipedia es): towers of lime-and-rubble tapial covered with
# a smooth render; ashlar only at the arrises, arches, vaults, base and
# crown. Hence: rendered round faces pitted by the French artillery of
# Moncey (June 1808) with patches where the render has fallen and the rubble
# shows; ashlar inner faces open "a gola oberta" in great pointed arches
# onto vaulted halls; ochre-plastered infill on the inner ground storeys.

[landmark]
name = "Torres de Quart"
slug = "torres_de_quart"
main_facade = "40..42"   # the gate face between the towers (az 265)
notes = "Two semicylindrical towers with arcuated machicolations and merlons flanking a gate body with a round arch, a machicolated balcony and a crenellated upper wall; inner face open in tall pointed arches on two storeys over ochre-plastered ground storeys, inner gate block with stair; 1808 cannonball pitting on the outer render. Heights from photo camera fits (header)."

[landmark.info]
architect = "Pere Bonfill (with Francesc Baldomar, Pere Compte, Tomas Oller, Jaume Perez)"
built = "1441-1460"
style = "Valencian late Gothic military"
heritage = "BIC RI-51-0000970"

[defaults]
material = "ashlar"
detail = 1.0

[render]
sun = [235, 40]
paving = 75

# ------------------------------------------------------------- materials

# Smooth lime render of the towers' outer faces (photos 02, 04, 11, 13):
# warm sand beige in the sun, streaked, patchy.
[material.render]
kind = "render"
tint = "#cfb593"
uv_scale = 4.0
normal_strength = 1.5
weathering = 0.7
seed = 21

# Exposed lime-and-rubble core where the render has fallen (darker, rough).
[material.rubble]
kind = "ashlar"
tint = "#7d6650"
block = [0.35, 0.22]
normal_strength = 2.0
weathering = 0.6
seed = 4

# Grey-beige ashlar of the inner faces, crowns and arrises (photos 01, 17).
[material.ashlar]
kind = "ashlar"
tint = "#e2caa6"
block = [0.9, 0.42]
weathering = 0.3
seed = 11

[material.ashlar_fine]
kind = "limestone"
tint = "#e6d3b4"
weathering = 0.2

# The gate wall on the field side reads darker and redder (photos 04, 12,
# 39): weathered render over tapial with ashlar voussoirs.
[material.gate_wall]
kind = "render"
tint = "#a3836a"
uv_scale = 3.0
normal_strength = 1.3
weathering = 0.6
seed = 3

# Ochre plaster of the inner ground storeys and of the hall walls (photos 01, 17).
[material.ochre]
kind = "plaster"
tint = "#ecb64a"
weathering = 0.25

# Cannonball impact: a dark, rough hollow.
[material.pit]
kind = "flat"
color = "#33281f"
roughness = 1.0

# Lime lines between the tapial lifts (photos 28, 30): the shafts read as
# horizontal bands about 0.9 m apart where the render has weathered.
[material.lime]
kind = "plaster"
tint = "#ddcdb2"
weathering = 0.6

[material.terrace]
kind = "terracotta"
tint = "#a58471"
uv_scale = 1.5

[material.timber]
kind = "wood"
tint = "#5a4330"

[material.plaque]
kind = "bronze"
tint = "#3e4a40"

