# Museu de Belles Arts de Valencia (Museo de Bellas Artes), former Colegio de San Pio V.
# Juan Perez Castiel, 1683-1744 (college and chapel); museum since 1946; north-east
# extension (low stone blocks with blue glazed roofs and skylights) 1990s-2000s.
#
# Generated by a small script (scratchpad mba/gen.py) so every height below is one of
# the measured values listed in sources.toml [facts]:
#   PLAN: OSM relation 11026210 and its building:parts (= Catastro 6234202YJ2763E
#   parts within 0.3 m), checked on the IGN PNOA orthophoto. Corrections from the
#   photos / PNOA: tower 16 is a square of 8.1 m (its N corner 0.6 m north of OSM,
#   every W-side photo puts the corner edge 0.8-1.0 m further out); the chapel is a
#   regular octagon 27.5 m across the flats (PNOA tiled roof; its SW flat is exactly
#   the OSM portal front), the drum 17.2 m and the dome eave 18.5 m across the flats
#   (PNOA blue roof 20 m with the lean, photo 11 drum 17.9 m projected).
#   HEIGHTS: constrained bundle adjustment of photos 11 (Canon S70, EXIF 20.69 mm),
#   12 (Canon G3 X, EXIF 11.0 mm, upright) and 14 (Canon G15, EXIF 21.0 mm) with the
#   focal lengths fixed from EXIF and 21 shared feature heights: tower entablature
#   20.0 / cornice 21.7 / attic 23.3 m, facade cornice 12.5 / attic 14.3 m, drum base
#   14.8, dome eave 18.0, crown 26.6, lantern cap 32.7 m (+-0.3 m statistical, about
#   +-0.7 m absolute from the street datum).

[landmark]
name = "Museu de Belles Arts de València (Sant Pius V)"
slug = "museu_de_belles_arts"
main_facade = 13
notes = "Baroque college of San Pio V (Juan Perez Castiel, 1683-1744): long two-storey river front between two square corner towers with modillion cornices, attic parapets and stone finials; octagonal chapel with a Baroque retable portal and a blue glazed-tile octagonal dome on a drum, with an octagonal lantern; cloister; later stucco west wing and the 1990s-2000s north-east extension."

[landmark.info]
architect = "Juan Pérez Castiel (1683-1744)"
built = "1683-1744; museum since 1946; extension 1990s-2000s"
style = "Valencian Baroque"
heritage = "Bien de Interés Cultural RI-51-0001413"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
frame_material = "frame"
iron_material = "iron"
door_material = "door"

[render]
sun = [200, 48]
paving = 90

[reference_heights]
tower16_attic = { height = 23.3, tolerance = 0.6, source = "BA photos 11/12/14: tower attic top" }
tower18_attic = { height = 23.3, tolerance = 0.6, source = "BA photos 11/14: tower attic top" }
front = { height = 12.5, tolerance = 0.5, source = "BA photos 11/12/14: facade cornice top" }
"part:16" = { height = 23.3, tolerance = 2.5, source = "BA: tower 16 attic 23.3 m (finials to ~25 m)" }
"part:18" = { height = 23.3, tolerance = 2.5, source = "BA: tower 18 attic 23.3 m (finials to ~25 m)" }
"part:10" = { height = 32.7, tolerance = 1.6, source = "BA: lantern cap 32.7 m (weathervane above)" }
"part:14" = { height = 12.5, tolerance = 2.0, source = "BA: facade cornice 12.5, attic 14.3 m" }

