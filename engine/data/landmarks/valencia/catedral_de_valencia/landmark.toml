# Catedral de Santa Maria de Valencia (la Seu) with the Micalet.
# Generated by a helper script from footprint.json + photos (see sources.toml);
# edit freely, but keep the uv convention below.
#
# FRAME. The cathedral is built along one axis: from the Puerta de los
# Hierros (Placa de la Reina, SW) to the apse (Placa de l'Almoina, NE), at
# azimuth 38.8 deg. Every designed element lives in the group `seu` with
# rotate_y = 51.2, so inside it local x = u (along the nave, towards the
# apse) and local z = v (across, towards the SE). Local compass inside the
# group: w = Hierros front, e = apse, n = Placa de la Virgen / c. del
# Micalet side (Puerta de los Apostoles), s = Placa de la Reina / Almoina
# side (Puerta del Palau, Santo Caliz). Masses that reuse OSM parts stay
# outside the group (world frame).
#
# PLAN (OSM building:parts in uv, metres): central nave v -11.1..3.7 (u -41.2
# Hierros .. 13 crossing), aisles to v -19.6 / 15, chapels between the
# buttresses to v -29.6 / 22 with blue-tiled domes; transept u 13..30 from the
# Apostoles front (v -32.3) to the Palau front (v 25.5); octagonal cimborrio on
# the crossing (centre u 21.6 v -3.5, circumradius 7.84); presbytery with a
# polygonal head to u 40.2, ambulatory (14 m) and radiating chapels (10 m)
# closed by a curved wall to u 56; the Renaissance Obra Nova loggia wraps the
# NW side of the apse; the 1660s passage to the Basilica dels Desemparats
# leaves from its north end. Micalet: octagon, side 6.36 m (perimeter 50.85 m
# = its height), centre u -54.2 v -15.8. Aula capitular (Capella del Sant
# Calze) square block on the Placa de la Reina (13 m inside, 16 m high).
#
# HEIGHTS: OSM 3D parts (nave/transept 21, aisles 13.5, chapels 10, ambulatory
# 14, cimborrio 21-36, Micalet terrace 51, espadanya 51-60), es.wikipedia
# (Micalet 50.85 m prism, ~63 m with the belfry; cimborrio ~40 m with cross;
# Hierros >36 m with the cross; Apostoles rose 6.45 m) and photo scaling
# (photo 32: 15.5 px/m on the Micalet; photo 08: rose 6.45 m = 140 px).

[landmark]
name = "Catedral de Valencia"
slug = "catedral_de_valencia"
main_facade = "facing:220:20"
notes = "Valencian Gothic cathedral (1262-15th c.) with the octagonal Micalet bell tower, the octagonal alabaster-glazed cimborrio, the Romanesque Puerta del Palau, the Gothic Puerta de los Apostoles, the Baroque Puerta de los Hierros, the aula capitular (Santo Caliz), the Renaissance Obra Nova and blue-tiled chapel domes."

[landmark.info]
architect = "Arnau Vidal (Palau), Nicolau d'Autun (Apostoles), Andreu Julia / Pere Balaguer (Micalet), Konrad Rudolf (Hierros)"
built = "1262-1426, Obra Nova 1566, Hierros 1703-1713, espadanya 1660-1736"
style = "Romanesque / Valencian Gothic / Renaissance / Baroque"
heritage = "BIC RI-51-0000967"
frame = "group `seu`: local x = u along the nave (azimuth 38.8), z = v towards the SE"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
door_material = "doors"
iron_material = "iron"

[render]
sun = [200, 48]
paving = 90

