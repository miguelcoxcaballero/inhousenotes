# Plaça de Bous de València (Plaza de Toros), Carrer de Xàtiva 28.
# Sebastián Monleón Estellés, 1851-1859; neoclassical (simple Doric) brick
# amphitheatre after the Colosseum and Nîmes. BIC RI-51-0004917.
#
# Frame: landmark-local metres, x east, z south. Everything is centred on
# C = (-0.3, 0.3), the least-squares centre of the OSM outline and parts.
#
# Plan (OSM relation 12942182 and its 64 building:parts, Catastro
# 5820501YJ2752B):
#   * exterior: a regular 48-sided polygon, circumradius 49.0 m (OSM outer
#     ring 48.96 +/- 0.7 m; PNOA orthophoto 99 m across), i.e. 98 m across.
#     Wikipedia's 108 m is not supported by the plan data.
#   * outer arcaded wall r 47.6-49.0 (OSM part 6), corridors 3 m deep behind
#     the arches; the arcade body r 40.45-44.6 solid to 8.9 m (OSM parts 0,
#     4 say 8.5 m), above it the covered "gradas" with cast-iron columns at
#     r 42.6 (OSM maps 32 of them, parts 32-63), the "andanada" floor at
#     12.9 m (OSM part 2: 12-12.5 m) and the tiled ring roof, eaves 16.6 m,
#     ridge 18.0 m behind the crown balustrade (OSM part 1: 15.5-17.5 m,
#     gabled). Heights follow the photo measurements below, ~0.4 m above
#     the OSM tags, which are rounded.
#   * open stands (tendidos) r 25.6-40.45 rising from 1.75 m to 8.2 m (OSM
#     parts 8, 9, 7, 3, 5 give 4-8.2 m from r 31.9); callejon r 24.0-25.6;
#     sand ruedo r 23.95 = 47.8 m across, measured on the orthophoto
#     (es.wikipedia: 47.5 m after the 1960s reduction, 52 m originally). The
#     OSM outline hole (r 27.3) is the edge of the low stands, not the
#     ruedo.
#   * four passages through the stands at azimuths 14, 105, 195, 285 (OSM
#     outline hole): the building's axes are turned ~14.5 deg from the grid,
#     the main (north-north-east) front faces Carrer de Xàtiva at az 14.5.
#
# Elevation. Bay count: 2 bays per polygon side = 96 bays per tier (384
# arches in 4 tiers, Wikipedia; ~30 arches visible across the front in
# photo 19), bay 3.2 m between flat brick pilasters 0.72 m wide. Heights
# measured on photo 19 (Czeva, frontal from Xàtiva, 18.8 px/m from the bay;
# a passer-by checks at 1.8 m); photo 01 is perspective-corrected and was
# only used for the camera:
#   ground: segmental ("escarzado") arches 2.35 x 3.8 m with iron gates,
#           stone plinth 0.8 m, brick band/cornice 4.2-4.65 m;
#   tiers 2-4: round arches 1.8 m wide, sills (balustrade bottoms) at 4.9 /
#           8.9 / 12.8 m, apex 3.1 m above, white stone balustrade 0.86 m in
#           each arch, framed by narrow impost pilasters; brick string
#           courses at 8.65 and 12.55 m; wooden diamond lattices behind the
#           balustrades of tiers 3 and 4;
#   crown: paired white consoles and frieze blocks 15.9-16.5 m, brick
#           cornice to 17.4 m (the 17.50 m of Wikipedia), stone balustrade
#           with a pedestal over every pilaster to 18.3 m.
#
# Inside (photos 10, 15, 24, 25, orthophoto 26): 22 rows of tendidos, the
# front ~10 rows with red-brown wooden seats, 24 stair aisles and 12
# vomitories; red barrera and contrabarrera with yellow bands; two covered
# galleries (gradas on the 8.9 m floor, andanadas on the 12.9 m floor) with
# cast-iron columns about 3 m apart under the tiled ring roof with an iron
# cresting on its inner eave.
#
# Not modelled: the main-gate signage and the coat of arms over one arch,
# monuments in the square (Montoliu, Granero), the ticket booths, the
# interior corridors, stairs and the chiqueros/patio de caballos.

[landmark]
name = "Plaça de Bous de València"
slug = "placa_de_bous"
main_facade = "facing:16.4:2"
notes = "48-sided neoclassical brick bullring: four arcaded tiers (segmental ground arches with iron gates, three tiers of round arches with stone balustrades), stone balustrade crown, tiled ring roof over the covered galleries with cast-iron columns, concrete stands, red barrera and sand ruedo open to the sky. Footprint IoU vs OSM ~0.80 by design: the ground corridor behind the arches (r 44.6-47.6, ~850 m2) is open in the 1-3 m slice while OSM part 0 is solid. The height checks of parts 0 and 2 read too high because those rings (r 40-49) include the 18 m outer wall."

[landmark.info]
architect = "Sebastián Monleón Estellés"
built = "1851-1859"
style = "Neoclassical (Doric), exposed brick"
heritage = "BIC RI-51-0004917"
height = "17.5 m"
diameter = "98 m outside (OSM), ruedo 50.6 m"

[defaults]
material = "brick"
detail = 1.0

[render]
sun = [215, 45]
paving = 75
street_eye = [21.0, 1.6, -84.0]
street_target = [-0.3, 8.0, 0.3]
street_fov = 60

