# Hand review of the Commons photos chosen by fetch.py, made by looking at each
# landmark's photos/contact.jpg. fetch.py reads this file (next to list.toml) and
# applies it after its text classification:
#   exterior = files confirmed to show the building's exterior (ranked first)
#   exclude  = interiors, objects, people, food, or another building (never selected)
#   catastro_not_building = parcels whose Catastro facade photo shows a different building
#   extra_categories / extra_files = more Commons sources found by hand
#   max_photos = per-landmark override of --max-photos
# Slugs with a modeling landmark.toml are not reviewed here.

