# Edificio del Banco de Valencia (Edifici del Banc de València), Carrer del Pintor Sorolla 2-4
# at Carrer de Don Juan de Austria, facing the junction of Barques / Poeta Querol / Pascual i Genís.
# Project Francisco Almenar Quinzá (1934-35), continued by Javier Goerlich Lleó, modified 1940
# by Vicente Traver and Antonio Gómez Davó; finished 1942. Valencian neo-baroque regionalism.
#
# Generated by scratchpad bdv/gen/gen.py. Dimensions (sources.toml [facts]):
#   PLAN: OSM way 492626775 + 23 building:parts (traced from Catastro 6025508YJ2762C, IoU 0.996):
#   flatiron plan, NW front 25.3 m (az 325) and S front 25.2 m (az 181) meeting at 36 deg in a
#   rounded corner r 5.51 m (centre (-18.27, 5.48)); bow miradors (min_level 1) at both ends of both fronts;
#   setback storeys 0.75-1.0 m behind the fronts, r 3.66 m at the corner; templete r 2.29 m.
#   HEIGHTS: constrained bundle adjustment of upright photos 01 + 03 (Canon 5D II, 25 mm EXIF
#   prior, eye-height prior, plan points + silhouette tangents), ratio-checked on telephoto
#   photo 06 (117 mm eq.): base entablature 10.0, main cornice 28.2, balustrade 28.9, setback
#   cornice 34.5, letter terrace 37.6, templete cornice 45.9, dome 47.85, finial 48.9 m (+-0.5).

[landmark]
name = "Edifici del Banc de València"
slug = "banc_de_valencia"
main_facade = "facing:253:60"
notes = "Flatiron-plan bank headquarters (1934-1942): two-storey marble base with giant columns and arched portals, six brick storeys with white limestone bow miradors and a baroque frontispiece on the rounded corner, a balustraded main cornice, two pink setback storeys with arched dormers under a tiled wavy cornice, and a lettered drum carrying a domed circular templete."

[landmark.info]
architect = "Francisco Almenar Quinzá (project 1935); Javier Goerlich Lleó; Vicente Traver and Antonio Gómez Davó (1940)"
built = "1934-1942"
style = "Valencian neo-baroque regionalism"
heritage = "Bé d'Interès Local (BIE inventory 319)"

