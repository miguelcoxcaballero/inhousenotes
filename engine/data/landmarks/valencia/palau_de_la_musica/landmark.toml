# Palau de la Música de València (José María García de Paredes, opened 25 April 1987),
# Jardí del Túria, Passeig de l'Albereda 30. Generated by a script (scratchpad pdm/gen.py)
# from footprint.json, the IGN PNOA orthophoto and a constrained bundle adjustment of
# Commons photos (see sources.toml [facts]). Building frame: u along the Turia front
# (azimuth 156.1 grid, + to the SSE), v to the back (azimuth 66.1), origin (-36.32, -10.49).
#   * glazed gallery (Hall dels Tarongers): one cloister-vaulted glass vault 85.1 m long,
#     23.6 m deep, eave 3.00 m, crown 13.4 m, on a stone socle and a glazed band;
#     its middle runs into the main block under the portico, its two ends stand free;
#   * portico: 10 slender square piers carrying a 11.8 m deep flat canopy, top 17.3 m;
#   * concert hall (Sala Iturbi): white stone box 17.3 m, mosaic-clad hall walls to 21.5 m,
#     segmental metal barrel roof (apex 26.7 m) with the tiled half-disc gable "PALAU DE LA MUSICA";
#   * the Turia riverbed in front, 6.2 m below the terrace: stone retaining wall, stairs, the
#     Bofill pool with its fountains and palms.

[landmark]
name = "Palau de la Música"
slug = "palau_de_la_musica"
main_facade = "facing:246:30"
notes = "Model in the building frame (u along the Turia front, azimuth 156.1). Plan from the PNOA orthophoto (roof lean corrected), OSM and Catastro; heights from a constrained bundle adjustment of Commons photos with EXIF focal lengths (sources.toml [facts]). The OSM outline covers only the main block and portico; the glass vault ends stand outside it, so the footprint precision is low on purpose."

[landmark.info]
architect = "José María García de Paredes"
opened = "1987-04-25"
extension = "Eduardo de Miguel, 2003 (mostly underground)"
style = "Late modernism"

[defaults]
material = "white_stone"
glass_material = "glass"
detail = 1.0

