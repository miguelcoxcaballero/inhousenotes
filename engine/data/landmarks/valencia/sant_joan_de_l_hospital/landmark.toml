# Església de Sant Joan de l'Hospital, València (Knights Hospitaller, before 1255 - 1316).
# Single Gothic nave (pointed barrel vault on diaphragm arches, chapels between the buttresses)
# ending in a five-sided ribbed apse that faces Carrer del Trinquet de Cavallers behind the
# brick-and-ashlar crenellated wall of the medieval cemetery. North: the long courtyard (patio
# del Calvari) with the Romanesque/Gothic north portal and the 17th-c. bell tower (stone shaft,
# stuccoed bell stage with ball finials), closed to the east by the white house of the order
# (brick front on the street, no. 5). South of the presbytery: the Baroque Real Capella de Santa
# Bàrbara (Juan Pérez Castiel, 1684-89), Greek cross with a tiled dome on a short drum.
#
# Every dimension is in sources.toml [facts] with its source. Summary:
# * plan: OSM way 514000994 + Catastro 6029506YJ2762G parts, checked on the IGN PNOA orthophoto;
#   apse = half octagon of 4.57 m sides (Catastro), centre (14.88, -0.18);
# * heights: constrained bundle adjustment of Commons photos 06, 07, 09, 13 (focal lengths from
#   EXIF, eye-height prior) for the apse, buttresses, windows, dome and cemetery wall (brick-course
#   count cross-check); photos 05, 08 for the bell tower and the north chapels.

[landmark]
name = "Església de Sant Joan de l'Hospital"
slug = "sant_joan_de_l_hospital"
main_facade = "facing:e"
notes = "Gothic church of the Hospitallers in Ciutat Vella: apse with tall lancets and gargoyle buttresses behind the crenellated cemetery wall on Trinquet de Cavallers, north courtyard with the bell tower, Baroque domed chapel of Santa Bàrbara."
[landmark.info]
built = "before 1255 (nave) - 1316 (Gothic apse); bell tower first half of the 17th c.; Santa Bàrbara 1684-89"
style = "Valencian Gothic (Cistercian-influenced); Baroque chapel"
heritage = "BIC RI-51-0001123 (national monument 1943)"

[defaults]
material = "stone"
roof_material = "roof"
detail = 1.0

[render]
sun = [120, 50]
paving = 45
street_eye = [27.0, 1.6, 14.0]
street_target = [18.5, 8.5, 1.0]
street_fov = 66
hide_context = ["context:364"]

