# Esglesia de Sant Esteve, Valencia (Placa de Sant Esteve). Valencian Gothic single nave of six bays with
# chapels between the buttresses and a polygonal head (rebuilt 1608-1618), lateral portal on the square (c. 1608),
# twin portals of the notaries at the feet (1682-1696), Communion chapel with dome (1696) and the bell tower
# (stone shaft, brick belfry, upper body and cupolino of 1755). Generated by scratch gen.py; dimensions and sources in sources.toml [facts].

[landmark]
name = "Església de Sant Esteve"
slug = "sant_esteve"
main_facade = "facing:n"
notes = "Valencian Gothic single nave (six bays, chapels between buttresses, polygonal head) on the Placa de Sant Esteve: north front with the lateral portal (c. 1608, upper body with the relief of Saint Stephen c. 1900), gargoyled buttress tops and the clerestory behind; west front (Facana dels peus) with the Gothic window, the twin notaries' portals and the bell tower (stone shaft, brick belfry, 1755 upper body, glazed cupolino); Communion chapel (1696) with dome and lantern on the Placa de la Comunio."
[landmark.info]
built = "1514-1618 nave and head (Fernando de Leon; Francesc Anton, Alonso Orts, Guillem del Rei), 1679-1682 interior, 1682-1696 feet chapels and Communion chapel, 1755 upper tower body, 1800 presbytery (Cristobal Sales)"
style = "Valencian Gothic / Renaissance church with Baroque tower and chapels"
heritage = "BIC RI-51-0001251"

[defaults]
material = "stone"
roof_material = "roof"
detail = 1.0

[render]
sun = [75, 32]
paving = 60
hide_context = ["context:173", "context:177", "context:200"]
street_eye = [-2.0, 1.6, -26.0]
