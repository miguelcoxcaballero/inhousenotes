# Església de Sant Nicolau de Bari i Sant Pere Màrtir (Iglesia de San Nicolás), València.
# Valencian Gothic single-nave church (six bays, chapels between the buttresses, polygonal apse)
# hidden inside the Ciutat Vella block between Carrer dels Cavallers (entrance through a narrow
# passage, not modelled: it runs between neighbours) and Plaça de Sant Nicolau, which wraps the
# west front (Gothic portal of the 15th c. and the neo-Gothic rose window) and the south front
# (neo-Gothic ochre front by Timoteo Calvo, 1861-64, with cresting and small tiled pavilions).
# Bell tower at the SW corner: stone base, brick shaft (1658), bell stage with one arch per face,
# balustrade with corner pinnacles and the octagonal two-storey lantern (1755).
#
# Every dimension is in sources.toml [facts] with its source. Summary:
# * plan: OSM way 514601809 + tower part 1485420318, Catastro 5531704YJ2753B parts, IGN PNOA;
# * heights: constrained bundle adjustment of 4 photos (Catastro facade photo with f = 1167 px
#   from EXIF, Commons 04, 07, 14) with shared unknown levels; facade details from photos 02,
#   06, 12, 13 scaled on the measured levels.

[landmark]
name = "Església de Sant Nicolau"
slug = "sant_nicolau"
main_facade = "facing:s"
notes = "Gothic single-nave church in Ciutat Vella: ashlar west front with Gothic portal and rose window, neo-Gothic ochre south front on Plaça de Sant Nicolau, brick bell tower (cross 46.9 m measured) with octagonal lantern."
[landmark.info]
built = "13th-15th c. (church), 1658 / 1755 (tower), 1861-64 neo-Gothic fronts (Timoteo Calvo)"
style = "Valencian Gothic; neo-Gothic south front"
heritage = "BIC RI-51-0004502"

[defaults]
material = "stone"
roof_material = "roof"
detail = 1.0

[render]
sun = [200, 55]
paving = 60
hide_context = [134]

