# La Nau, historic building of the Universitat de València (Estudi General).
# Neoclassical rebuilding of the 1830s (Timoteo Calvo, Joaquín Martínez) of the
# 16th-c. university, on the block between Carrer de la Universitat (east),
# Plaça del Col·legi del Patriarca (west), Carrer de la Nau (north) and Carrer
# de Salvà (south).  Generated by scratchpad gen.py; dimensions and sources in
# sources.toml [facts].
#
# Volumes (OSM building:parts, Catastro, PNOA orthophoto):
#   perimeter wings, two tall storeys of red brick with stone quoins, plinth,
#   string course, modillion cornice (top 12.8 m) and a stone balustrade
#   (top 13.8 m) round a 3.5 m roof terrace (part:2);
#   inner ring of the wings (part:0) rising 1.5 m above the terrace under low
#   grey hip roofs; north-west block round the small courtyard (part:4,
#   3 floors) and the tile roofs between it and the chapel (part:3);
#   the main cloister (part:1, two arcaded galleries) round the courtyard with
#   the statue of Lluís Vives; the Capella de la Sapiència dome (part:5) behind
#   the Plaça del Patriarca facade, with the Font de la Universitat (1840s
#   fountain with five niches) against that facade.
# Heights solved from photos 01, 08 and the Catastro photo (constrained bundle
# adjustment, Catastro EXIF focal length, eye-height prior 1.6 m) and from the
# PNOA shadows (cloister); plan from OSM/Catastro checked on the PNOA.

[landmark]
name = "La Nau (Universitat de València)"
slug = "la_nau"
main_facade = "facing:w"
notes = "Neoclassical university building (1830s) round a two-storey cloister; Capella de la Sapiència dome and the five-niche fountain on the Plaça del Patriarca facade."

[landmark.info]
architect = "Timoteo Calvo, Joaquín Martínez (1830s rebuilding)"
built = "1498 (Estudi General); rebuilt 1830-1840s"
style = "Neoclassical"
heritage = "BIC (RI-51-0004521)"

[defaults]
material = "brick"
roof_material = "roof_grey"
glass_material = "glass"
door_material = "door_wood"
frame_material = "frame_wood"

[render]
sun = [235, 42]
street_distance = 40
paving = 90

hide_context = [125, 128]


[reference_heights]
"part:2" = { height = 13.80, tolerance = 1.0, source = "terrace band: cornice top, bundle adjustment photos 01/08/Catastro (OSM levels x 3.2 m is too low for 6 m storeys)" }
"part:0" = { height = 15.10, tolerance = 1.5, source = "inner wings: eave from the PNOA shadow on the terrace, plus hip roof" }
"part:3" = { height = 14.3, tolerance = 1.5, source = "tile roof between the NW block and the chapel: estimated (eave at terrace level, 22 deg hip), PNOA" }
"part:4" = { height = 17.0, tolerance = 1.5, source = "NW block round the small courtyard, 3 floors over the terrace level: estimated from PNOA shadows on the inner roofs" }
"part:5" = { height = 20.75, tolerance = 2.5, source = "Capella de la Sapiencia dome, bundle adjustment photos 01/08/Catastro" }
"part:1" = { height = 9.90, tolerance = 1.0, source = "cloister: PNOA courtyard shadow ratio to the 13.8 m facade shadow" }
cornice_w = { height = 12.80, tolerance = 0.4, source = "bundle adjustment photos 01/08/Catastro" }
balustrade_w = { height = 13.80, tolerance = 0.4, source = "bundle adjustment photos 01/08/Catastro" }
dome_shell = { height = 20.75, tolerance = 0.5, source = "dome apex, bundle adjustment photos 01/08/Catastro" }
dome_cross = { height = 22.70, tolerance = 0.5, source = "cross top, bundle adjustment photos 01/08/Catastro" }


