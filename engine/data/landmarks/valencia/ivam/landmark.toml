# IVAM - Institut Valencià d'Art Modern, Centre Julio González (Carrer de Guillem de Castro 118).
# Emilio Giménez and Carlos Salvadores, opened 18 February 1989 (remodelled 2000 by Giménez and Julián Esteban).
# Generated by a script (scratchpad ivam/gen/gen.py) from footprint.json (OSM building:parts), the
# IGN PNOA orthophoto and heights measured with solved cameras (sources.toml [facts]).
# A blind box of beige stone (courses of 0.50 m) on a raised esplanade along Guillem de Castro,
# three large ground-floor windows, the glazed entrance between two stone piers under a thin
# cantilevered canopy, a lower stone south block, roof lanterns, a drum and a dark stone box
# (SE corner, cantilevered over Carrer de la Beneficència) at the back; the east wall faces the
# vacant lots of the planned extension and is rendered (party walls, Escif mural).

[landmark]
name = "IVAM - Institut Valencià d'Art Modern"
slug = "ivam"
main_facade = "facing:285:20"
notes = "Heights from 5 solved photos (EXIF focal lengths) and stone-course counts (30 x 0.50 m); plan from OSM building:parts and PNOA 2024."

[landmark.info]
architect = "Emilio Giménez, Carlos Salvadores"
built = "1986-1989"
style = "late-modern museum box"

[defaults]
material = "stone"
roof_material = "roofdeck"
glass_material = "glass"
frame_material = "frame"
detail = 1.0

[render]
sun = [225, 50]
exposure = 0.55
paving = 70
hide_context = [12]

[reference_heights]
north_block = { height = 16.85, tolerance = 0.5, source = "BA of 3 photos + 30 stone courses" }
canopy = { height = 17.35, tolerance = 0.5, source = "BA photos 03, catastro, 08" }
"part:0" = { height = 16.85, tolerance = 3.1, source = "BA + 30 courses x 0.5 m above the 1.8 m esplanade (roof); lanterns and the east band rise 3 m above it" }
"part:1" = { height = 16.3, source = "photos 26/03/01: just under the canopy soffit" }
"part:2" = { height = 16.85, source = "PNOA: same roof level as the main block" }
"part:3" = { height = 16.85, source = "PNOA: same roof level as the main block" }
"part:4" = { height = 20.5, source = "PNOA shadow ~3.7 m above the main roof; photo 10" }
"part:12" = { height = 20.5, source = "as part 4 (cantilever from 8 m)" }
"part:7" = { height = 16.85, tolerance = 3.1, source = "PNOA: no step against the drum roof (OSM levels=2 is an interior count)" }
"part:5" = { height = 19.85, source = "lantern 3.0 m above the roof (PNOA shadow widths)" }
"part:6" = { height = 19.85, source = "lantern" }
"part:8" = { height = 19.85, source = "lantern" }
"part:9" = { height = 19.85, source = "lantern" }
"part:10" = { height = 19.85, source = "lantern" }

