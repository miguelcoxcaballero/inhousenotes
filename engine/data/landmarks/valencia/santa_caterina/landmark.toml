# Església de Santa Caterina (Iglesia de Santa Catalina), València.
# Valencian Gothic church (13th-14th c.: three naves between buttresses with side chapels,
# polygonal apse with ambulatory), stripped of its Baroque skin in the 1950s, and the hexagonal
# Baroque bell tower of 1688-1705 (Valero and Juan Bautista Viñes) on Plaça de Santa Caterina.
#
# Every dimension is in sources.toml [facts] with its source. Summary:
# * plan: OSM way 135638445 + building:parts, Catastro 5829117YJ2752H, IGN PNOA orthophoto;
# * tower: regular hexagon r 4.08 m (across flats 7.07 m) from the OSM tower part; levels from a
#   constrained bundle adjustment of 5 photos (p145, p133, p146, p04 at street level, p087 from the
#   Micalet terrace with the horizon) -> cross top 56.6 m (published 56.12 m);
# * church: west front levels from photos 12 and 06 (bundle adjustment anchored on the tower and the
#   facade ends), apse eave / ridge from p087 rays through the solved camera.

[landmark]
name = "Església de Santa Caterina"
slug = "santa_caterina"
main_facade = "facing:w"
notes = "Hexagonal Baroque tower (1688-1705, 56.6 m measured / 56.12 m published) and the Gothic church; plan from OSM/Catastro/PNOA, heights from calibrated photos."
[landmark.info]
architect = "tower: Valero Viñes and Juan Bautista Viñes (1688-1705)"
built = "13th-14th c. (church), 1688-1705 (tower)"
style = "Valencian Gothic; Baroque tower"
heritage = "BIC RI-51-0004484"

[defaults]
material = "stone"
roof_material = "roof"
detail = 1.0

[render]
sun = [200, 52]
paving = 70
street_eye = [-47.0, 1.6, 15.6]
street_target = [-27.0, 11.0, 1.0]
street_fov = 62

