# Roig Arena (Valencia, 2025; HOK + ERRE). Generated by gen.py (session scratchpad roig/gen); dimensions and sources in sources.toml [facts].
# Arena frame (u, v): u along the long axis (+ NE, az 59), v across it (+ SE, az 149); x = 0.857 u + 0.515 v, z = -0.515 u + 0.857 v.
# The ceramic skin is modelled as 20 rows of tilted scales (one sweep per row) that follow a filleted hull of the OSM outline;
# rows bunch and part round the "Ojo" LED screen and the gap below it at the west corner, and their lower edge follows the photos.

[landmark]
name = "Roig Arena"
slug = "roig_arena"
main_facade = "facing:149:30"
notes = "Multi-purpose arena of Valencia Basket (opened September 2025) by HOK with ERRE Arquitectura. A rounded box about 152 x 118 m wrapped in a skin of 8 600 identical 1.0 x 1.2 m enamelled ceramic slats (Pamesa) tilted 10-63 degrees on a double-curved steel frame; the skin rises from a glazed podium, dips to the ground round the 48 x 10 m 'El Ojo' screen at the west corner and rounds over to a flat roof at about 35.5 m. OSM building:part levels (1-5) describe interior floors under the skin, so the per-part height warnings are expected; the PNOA-LiDAR flight predates the building (no returns), so heights come from photos."

[landmark.info]
architect = "HOK with ERRE Arquitectura"
built = "2020-2025 (opened 6 September 2025)"
capacity = "15 600 (basketball), 18 600-20 000 (concerts)"
skin = "8 600 ceramic slats 1.0 x 1.2 m, tilted 10-63 deg, three blue enamel shades"

[defaults]
material = "concrete_panel"
frame_material = "iron"

[render]
sun = [200, 48]
paving = 120
hide_context = [0, 1, 2, 3, 4, 5, 6, 7, 8]

[reference_heights]
roof = { height = 35.55, tolerance = 1.0, source = "crest of the skin: Catastro facade photo 2025-08-05 (Canon EOS 700D, EXIF 13 mm = fov_y 59.6), camera range fixed by the 118 m SE face width from OSM/orthophoto, crest matched at 35.5 m; consistent with photos 01, 02, 10" }

