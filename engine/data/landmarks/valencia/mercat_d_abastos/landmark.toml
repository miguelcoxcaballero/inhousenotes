# Mercat d'Abastos de València (Antic Mercat d'Abastiments, now the Complex
# Esportiu-Cultural Abastos), Carrer d'Alberic 18. Francisco Javier Goerlich
# Lleó, rationalist / Valencian regionalist, built 1940-1948 (Wikidata).
# Generated by gen.py (scratchpad) in a building frame: s along the long axis
# (azimuth 149.2), t across (azimuth 59.2), origin local (0.475, -0.25).
#
# Plan (OSM way 243447549 = PNOA orthophoto, sources.toml facts): 192.0 x 71.0 m
# at the pillar line of the perimeter portico. Around the whole block a portico of
# pillars (grey stone dado, cream shafts) carries arched glass-and-iron screens with
# the senyera diamond, a 4 m gallery in front of the shops and a 3.5 m cantilevered
# canopy (terrace on top at 6.2 m). Above it, set back 8.6 / 7 m, an upper storey
# with a merloned parapet (11.2 m) encloses the halls: two long glazed hip roofs
# joined by a glazed crossing. Main facade on Carrer d'Alberic (t = -35.5): central
# tower with the great arch and MERCADO DE ABASTOS (eave 19.1 m), two side towers
# (eave 21.7, pyramid 26.4 m), two-storey wings with green tiled lean-to roofs,
# quarter-round pavilions at the arch and low gate pavilions at the outer corners.
# Rear on Carrer del Bon Orde: a 4-storey block with a hip roof flanked by
# 3-storey wings with roof terraces.

