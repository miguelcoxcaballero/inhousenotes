# Finca Roja, Valencia (Enrique Viedma Vidal, project 1929, built 1930-33): the
# red-brick workers' housing block (378 dwellings) on the whole island between
# Carrer de Jesus, Marva, Albacete and Maluquer, round a large inner courtyard.
# Generated by scratchpad fr/gen.py; every dimension and its source is listed in
# sources.toml [facts].
#
# Massing: one 6-level brick body on the union of the 14 OSM outlines (Catastro
# parcels 5016301..14, checked on the IGN PNOA orthophoto), with the polygonal
# oriels (tribunes) of the long fronts as they are digitised, light wells kept;
# eave 21.4 m, white attic string course 17.8 m, steep red-tile mansard to a
# flat terrace at 24.3 m.  Four unequal rounded chamfers, each with a central
# polygonal tribune under a green glazed hood and a big mansard gable (apex
# 25.6 m), flanked by two brick towers (cylinder, finned octagonal shaft, green
# dome, top 32.5 m).  Every street oriel gets its green hood and pointed gable.
# Heights from a constrained bundle adjustment of the two Catastro facade photos
# (Canon SX270, EXIF 4.5 / 6.05 mm), eye-height prior 1.6 m.

[landmark]
name = "Finca Roja"
slug = "finca_roja"
main_facade = "facing:s"
notes = "Expressionist red-brick housing block (Amsterdam School influence) round a courtyard; twin towers on each of the four chamfers, green-glazed hoods over the oriels."

[landmark.info]
architect = "Enrique Viedma Vidal"
built = "1929 (project) - 1933"
style = "Expressionism / Amsterdam School, brick"
heritage = "Bien de Relevancia Local (BRL 03.04.10)"

[defaults]
material = "brick"
roof_material = "roof"
glass_material = "glass"
frame_material = "frame"
door_material = "door"
iron_material = "iron"
floor_height = 3.5

[render]
sun = [215, 48]
paving = 95
exposure = 0.55

