# Bombas Gens (Fàbrica de Bombes Hidràuliques Gens), Avinguda de Burjassot 54,
# València. Cayetano Borso di Carminati, 1930 (Catastro 1936); restored 2014-2017
# by Ramón Esteve Estudio as Bombas Gens Centre d'Art (Fundació Per Amor a l'Art).
# One-storey Art Deco street front (cream render, red brick jambs, stepped
# lintels, crowned piers, ceramic lattice parapet) wrapping the corner of the
# avenue and Carrer de Reus; behind it four brick/rubble gabled factory naves
# with oculi, a patio with the old boiler chimneys and a glass canopy, a
# green-roofed hall along Carrer de Reus, the 1930s "vivienda anexa" with its
# tower at the west end and the new brick block behind it.
#
# GENERATED by scratchpad bg/gen.py from measured parameters (see sources.toml [facts]).

[landmark]
name = "Bombas Gens"
slug = "bombas_gens"
main_facade = "facing:220:20"
notes = "1930 Art Deco pump factory by Cayetano Borso di Carminati, now Bombas Gens Centre d'Art. Street fronts on Avinguda de Burjassot (39.7 m) and the corner with Carrer de Reus (14.0 m + 5.85 m chamfer); four gabled naves behind (nave frame azimuth 24.8)."

[landmark.info]
architect = "Cayetano Borso di Carminati (1930); restoration Ramón Esteve Estudio (2017)"
built = "1930"
style = "Art Deco (Valencian industrial)"
address = "Avinguda de Burjassot 54, València"

[defaults]
