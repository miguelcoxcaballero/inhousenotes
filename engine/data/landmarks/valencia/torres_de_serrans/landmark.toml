# Torres de Serrans (Torres de Serranos), Valencia. Gothic city gate of the
# Christian wall, Pere Balaguer 1392-1398.
#
# Frame: landmark-local metres, x east, z south. The gate axis is turned
# 21.3 deg from the grid: outer face (river, Pont de Serrans) faces az 19-20,
# inner face (Placa dels Furs, old town) faces az 199-201. In the comments
# u = along the gate (east-north-east), n = depth towards the city:
#   u = 0.9316 x + 0.3633 z,  n = -0.3633 x + 0.9316 z.
# Plan: two elongated half-hexagonal towers (W: u -18.1..-5.4, E: u 6.5..20.1)
# project 8.5 m in front of the gate wall (outer face n = 3.3); the central
# body runs back to the inner face n = 14.7, which stands 4.5-5 m proud of
# the towers' open inner faces (n 9.3-10.3).
# Heights from photo 02 (calibrated on OSM height = 33 m) and photo 07.

[landmark]
name = "Torres de Serrans"
slug = "torres_de_serrans"
main_facade = "12"   # outline edge on the gate front (outer face, az 19)
notes = "City gate: two polygonal towers with an arcuated machicolation gallery and crenellations, central gate body with round outer arch, Gothic tracery band and corbelled gallery; inner (city) side open in large pointed arches on two storeys, grand stair on the west. Moat with battered tower bases on the river side. Footprint IoU vs the OSM outline is only 0.47 by design: the outline includes the sunken dry moat (OSM parts 1287040285/86, min_level -2, 526 m2) and the gallery overhang (part 1287040284, 20-22 m), neither of which is built at the 1-3 m slice; precision is 0.995 and the model covers about 98 % of the remaining ground-level plan."

[landmark.info]
architect = "Pere Balaguer"
built = "1392-1398"
style = "Valencian Gothic"
heritage = "BIC RI-51-0000969"

[defaults]
material = "stone"
detail = 1.0

[render]
sun = [215, 45]
street_distance = 55
paving = 70

