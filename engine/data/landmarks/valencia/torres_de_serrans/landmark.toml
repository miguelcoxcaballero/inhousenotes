# Torres de Serrans (Torres de Serranos), Valencia. Gothic city gate of the
# Christian wall, Pere Balaguer 1392-1398.
#
# Frame: landmark-local metres, x east, z south. The gate axis is turned
# 21.3 deg from the grid: outer face (river, Pont de Serrans) faces az 19-20,
# inner face (Placa dels Furs, old town) faces az 199-201. In the comments
# u = along the gate (east-north-east), n = depth towards the city:
#   u = 0.9316 x + 0.3633 z,  n = -0.3633 x + 0.9316 z.
# Seen from the river the EAST tower is on the left, the WEST tower on the
# right.
#
# Plan: two elongated half-hexagonal towers project 8.5 m in front of the
# gate wall (outer face n = 3.3); the central body runs back to the inner
# face n = 14.7, 4.5-5 m proud of the towers' open inner faces (n 9.3-10.3).
# East tower = OSM part 949545055 (13.65 m across, Catastro 13.7). The west
# tower is OSM 949545054 widened 6.4 % across and 2.9 % in depth about its
# centre: OSM gives 12.74 m, Catastro 13.5 m, and in photos 34 (95 mm lens
# from the bridge) and 01 both towers measure the same width (260/261 px).
#
# Heights (revised): measured in photos 01, 23, 25, 34 and 07 against the
# plan widths and the 5 x 6.5 m outer arch (Wikipedia). The towers rise to
# 31.2 m at the merlon tops (30.2 m parapet), not the 33 m of the OSM tag;
# every photo gives tower height / width 0.86-0.89 of the old model. The
# round stair turrets reach about 33.5 m. Details per element below.

[landmark]
name = "Torres de Serrans"
slug = "torres_de_serrans"
main_facade = "12"   # outline edge on the gate front (outer face, az 19)
notes = "City gate: two polygonal towers with an arcuated machicolation gallery and crenellations, central gate body with round outer arch, Gothic tracery band and corbelled gallery, a taller crenellated rear wall; inner (city) side open in large pointed arches on two storeys, terrace with stairs and round stair turrets, grand stair on the west. Dry moat with battered tower bases on the river side (modelled below ground; the render ground plane is not cut, so its floor is also marked at street level). Footprint IoU vs the OSM outline is only ~0.48 by design: the outline includes the sunken moat (OSM parts 1287040285/86, min_level -2, 526 m2) and the gallery overhang (part 1287040284), neither of which is built at the 1-3 m slice."

[landmark.info]
architect = "Pere Balaguer"
built = "1392-1398"
style = "Valencian Gothic"
heritage = "BIC RI-51-0000969"

[defaults]
material = "stone"
detail = 1.0

[render]
sun = [215, 45]
street_distance = 55
paving = 70

# ------------------------------------------------------------- materials
# Photos 23, 31, 34, 35: fine-jointed coursed ashlar of a sandy, slightly
# grey beige (sampled 125,122,104 in daylight), fairly even, a few darker
# weathered blocks low down. The ashlar/limestone kinds vary too much from
# block to block (blotchy); the sandstone set at 3.6 m per repeat gives
# blocks of about 0.9 x 0.4 m with an even tone.

[material.stone]
kind = "sandstone"
tint = "#dccab0"
uv_scale = 3.6
weathering = 0.2

[material.stone_fine]
kind = "limestone"
tint = "#e2d0b2"
weathering = 0.12

[material.tracery]
kind = "sandstone"
tint = "#d2bf9e"
uv_scale = 1.6
weathering = 0.3

[material.rubble]
kind = "ashlar"
tint = "#c9b79d"
block = [0.6, 0.32]
weathering = 0.4
seed = 9

[material.moat_floor]
kind = "cobble"
tint = "#8f8574"
uv_scale = 3.0

[material.moat_read]
kind = "flat"
color = "#5d564b"
roughness = 0.95

[material.plaza]
kind = "paving"
uv_scale = 2.4

[material.iron]
kind = "iron"

