# Edifici Veles e Vents (America's Cup Building / "Foredeck"), Marina de Valencia.
# David Chipperfield Architects with b720 Fermin Vazquez Arquitectos, 2005-2006.
# Generated by a script (scratch gen.py) in a building frame: s along the NW face from the
# W corner (Catastro roof corner) toward the N corner (grid azimuth ~60 deg), t toward the SE.
# Plan: Catastro roof outline (61.9 x 47.2 m) + the published floor plans (WikiArquitectura:
# level 3 scale bar, cores used to register levels 0-2), checked on the IGN PNOA orthophotos
# 2012-2024 (roof lean corrected). Heights: constrained bundle adjustment of photos 01, 07, 13
# (EXIF focal lengths), rms 2.6-3.9 px; consistent with the published elevation (6.2 m floors).
#   four white decks: P1 (first floor, 70.1 x 47.7, top 6.15 m), P2 (51.8 x 32.4, top 12.18),
#   P3 (68.5 x 43.1, top 18.18), roof (61.9 x 47.2, top 24.40); 2.0-2.3 m deep slab edges;
#   recessed glazed floors, four cores (two inclined), stairs between decks, access ramp,
#   public deck / spectator tail to the NE.

[landmark]
name = "Edifici Veles e Vents"
slug = "veles_e_vents"
main_facade = "facing:nw"
notes = "Stacked cantilevered decks modelled from the published plans (registered on the cores) and the Catastro roof, heights from a bundle adjustment of three calibrated photos. Footprint IoU against OSM is low on purpose: OSM's outline is the union of the cantilevered decks, while at 1-3 m only the recessed ground floor, cores and stairs stand."

