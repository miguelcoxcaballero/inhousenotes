# Palau de l'Almirall (Palacio del Almirante), Carrer del Palau 14, València (Conselleria d'Hisenda).
# 15th-c. Valencian Gothic palace of the Admirals of Aragon; the street front was regularised later
# (balconies, plastered top floor). Front on Carrer del Palau (30 m, faces NNE): stone ashlar up to
# a string course, cream plaster top floor, stone corner strip at the west end, tiled eaves; ground
# floor with two large Gothic-framed windows (colonnettes, pinnacles), a lintelled portal with an
# eared frame, roundels and the Almirall arms, two smaller framed windows, basement vents; main floor
# with four tall balconied windows; top floor with four smaller balconied windows.
#
# PLAN: OSM outline (= BIC parcel, 1439 m2; PGOU ficha 1440 m2). East side trimmed 1.0 m: the
#   PNOA orthophoto roof edges and the LiDAR street cells (x = 27.8 empty all along) put the
#   east wall at x ~ 27.3 instead of the OSM 28.4 (OSM runs into the Banys de l'Almirall alley).
#   North wing 7.0 m deep (PNOA tile band 6.5 m + gutter), patio = Catastro part 6 (LiDAR empty),
#   NE light well (Catastro notch, LiDAR empty), modern Hisenda annex to the south.
# HEIGHTS: PNOA-LiDAR building heights (2.5 m cells, offset fitted on the facade/street edge:
#   ~1 m south): north wing 15.5-16.0 near the front, 17.1-17.6 deepest -> eave 15.6, ridge 17.2;
#   patio wings / terraces 16.1-17.6; annex 9.4-13.9; west strip 16.5-19.7. Facade levels from
#   photo 01 (40 mm, f = 2093 px from EXIF) by cross-ratio along bay 1 with the vertical VP and
#   eye-height scale, cross-checked by the 1.0 m balcony railings; bay positions from photos 01 and
#   03 (28 mm) by cross-ratio along the base line between the facade ends. See sources.toml [facts].

[landmark]
name = "Palau de l'Almirall"
slug = "palau_de_l_almirall"
main_facade = "facing:n"
notes = "Gothic palace of the Admirals of Aragon (Conselleria d'Hisenda): ashlar street front with Gothic ground-floor windows, eared portal, iron balconies and plastered top floor; patio; modern annex to the south."

[landmark.info]
built = "15th c. (Gothic palace of the Almirall family); street front regularised 18th-19th c.; restored 1991 and 2020-2022"
style = "Valencian Gothic"
heritage = "Bien de Interés Cultural (RI-51-0001142, 1944)"
address = "Carrer del Palau 14, València"

[defaults]
material = "plaster"
roof_material = "roof"
glass_material = "glass"
door_material = "door"
iron_material = "iron"
frame_material = "frame"

[render]
sun = [200, 55]
paving = 50
hide_context = ["context:366", "context:369"]
street_eye = [44.0, 1.6, -22.2]
street_target = [12.0, 7.0, -22.6]
street_fov = 48

[reference_heights]
north_wing = { height = 17.4, tolerance = 0.5, source = "ridge: LiDAR deepest north-wing cells 17.1-17.6 (eave 15.6 from front cells 15.5-16.0 and photo 01)" }

