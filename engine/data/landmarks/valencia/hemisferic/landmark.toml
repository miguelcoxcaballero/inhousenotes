# L'Hemisfèric (Santiago Calatrava, opened 16 April 1998), Ciutat de les
# Arts i les Ciències, Valencia: the "eye". An ovoid shell ~100 m long
# (OSM outline 100.8 x 47.5 m; CAC data 110 x 55.5 m incl. the eyelids) and
# 26 m high on the main NW-SE axis of the CAC (axis azimuth 129 deg), set in
# a ~24 000 m2 shallow pool that mirrors it into a full eye.
#   * roof: a metal-clad ovoid vault along the axis (seams pole to pole),
#     coming down to a point at both ends between the two inverted-V halves
#     of the white concrete "M" end frames;
#   * upper glazing: fixed band of large panes in white steel frames;
#   * eyelids: louvred glass shutters hinged on a white beam at ~14.6 m,
#     opened hydraulically outwards/upwards as a brise-soleil (modelled
#     OPEN on the NE side, CLOSED on the SW side, so both states read);
#   * pupil: the white spherical IMAX dome (900 m2 screen, 24.4 m inside).
# Generated by a script from the section/elevation tables below (axis frame
# s along the axis, t across); see sources.toml for photo matches.

[landmark]
name = "L'Hemisfèric"
slug = "hemisferic"
main_facade = "facing:ne"
notes = "Envelope = loft of a superellipse half-section (n = 2.2) scaled per station: half-width W(s) from the OSM outline, height = 26/23.7 W(s). Section bands: roof |theta| < 33 deg, upper glazing 33..58 deg, eyelid 58..90 deg (theta from the crown). End frames, wings and tympana from photos 01, 04, 07, 19, 20, 22. Footprint IoU is low (~0.3) by construction: the building is an open shell over an open-air floor, and the plan metric slices each element at 1-3 m, where only the thin eyelid shells and the pupil are cut; the envelope follows the OSM outline exactly (outline covered 100 %)."

[landmark.info]
architect = "Santiago Calatrava"
opened = 1998
style = "Neo-futurism / structural expressionism"
height_m = 26
length_m = 110
width_m = 55.5
pool_m2 = 24000

[defaults]
material = "white_concrete"
detail = 1.0

[render]
sun = [205, 52]
paving = 170
exposure = 0.55
street_eye = [52.0, 1.6, -64.0]
street_target = [0.0, 9.0, 0.0]
street_fov = 58

