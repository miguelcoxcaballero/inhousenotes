# L'Hemisfèric (Santiago Calatrava, opened 16 April 1998), Ciutat de les
# Arts i les Ciències, Valencia: the "eye". A shell 99.9 m tip to tip and
# 56 m wide at the waterline (PNOA orthophotos 2018/2021; published 110 x
# 55.5 m), 26 m high (published; 25.1 m above the water), on the main NW-SE axis of the CAC (azimuth 129 deg),
# set in a ~24 000 m2 shallow pool that mirrors it into a full eye.
# Measured section at mid-length (calibrated photo 24 + PNOA): roof seam
# t = 15.6 m at ~19 m, eyelid hinge beam t = 23 m at ~11 m, waterline
# t = 28 m; crown profile 25.1 / 24.3 / 21.8 / 17.3 / 13.5 / 11.1 m at
# s = 0 / 10 / 20 / 30 / 35 / 38 m (photo 24). See sources.toml [facts].
#   * roof: a metal-clad ovoid vault along the axis (seams pole to pole),
#     coming down to a point at both ends between the two inverted-V halves
#     of the white concrete "M" end frames;
#   * upper glazing: fixed band of large panes in white steel frames;
#   * eyelids: louvred glass shutters hinged on a white beam at ~14.6 m,
#     opened hydraulically outwards/upwards as a brise-soleil (modelled
#     OPEN on the NE side, CLOSED on the SW side, so both states read);
#   * pupil: the white spherical IMAX dome (900 m2 screen, 24.4 m inside).
# Generated by a script from the section/elevation tables below (axis frame
# s along the axis, t across); see sources.toml for photo matches.

[landmark]
name = "L'Hemisfèric"
slug = "hemisferic"
main_facade = "facing:ne"
notes = "Envelope = mesh bands of a superellipse half-section (n = 1.6 on the flanks, rounded to 1.8 at the crown) scaled per station by the measured half-width table W(s) (PNOA: 28.3 m at s = 0, tips at +-50) and height table H(s) (calibrated photo 24: crown 25.1 m above the water, published 26 m). Section bands: roof |theta| < 38 deg, upper glazing to the hinge at 58 deg, eyelid to the waterline. Footprint IoU is low (~0.25) by construction: the OSM/Catastro outline (100.8 x 47.5 m) is the enclosed floor slab inside the eyelids, while the shell reaches 56 m at the waterline (PNOA), and the plan metric slices only the thin eyelid shells and the pupil."

[landmark.info]
architect = "Santiago Calatrava"
opened = 1998
style = "Neo-futurism / structural expressionism"
height_m = 26  # published; 25.1 m above the pool water (measured)
length_m = 110
width_m = 55.5
pool_m2 = 24000

[defaults]
material = "white_concrete"
detail = 1.0

[render]
sun = [205, 52]
paving = 170
exposure = 0.55
street_eye = [52.0, 1.6, -64.0]
street_target = [0.0, 9.0, 0.0]
street_fov = 58

