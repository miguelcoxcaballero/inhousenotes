# Edifici La Unión y el Fénix Español, Carrer de Xàtiva 13 / Av. Marqués de Sotelo (chamfer), València.
# Neo-baroque insurance-company apartment building by Enric Viedma i Vidal, designed 1929, built 1931-1938.
# Generated by scratchpad unf/gen/gen.py from params.json; measurements and sources in sources.toml [facts].
# Location verified: OSM way 409877331 'Propietat La Unió del Fènix Espanyol' = Catastro 5821110YJ2752B, the chamfer of Carrer de Xàtiva and
# Av. Marqués de Sotelo facing the Estació del Nord (not Carrer de les Barques). Plan: OSM outline and building:parts (IoU 0.97 OSM / 0.985 Catastro),
# street wall lines fitted on the OSM nodes (Marqués de Sotelo az 274.6, chamfer az 234 / 18.7 m between the corner oriels, Xàtiva az 195.6),
# checked on the IGN PNOA orthophoto. Heights: IGN PNOA-LiDAR (roof parapet 32.6, stair tower 34.8, dome peak cell 41.8) and 10 camera
# solves that use only plan points and independent heights (ground, 11.7 bow bases, 26.0 cornice, 32.6 parapet, 34.0 bow crowns); the templete
# was then triangulated / measured with those cameras: centre 3.6 m behind the chamfer line, columns 34.0-36.7, entablature 37.9, pediment 38.7,
# dome 42.1, phoenix wings ~43.7, raised hand ~46.3 m. Ground floor: shop fronts and portal to the pavement, granite only on the pier bases (2.6 m).

[landmark]
name = "Edifici La Unión y el Fénix"
slug = "la_union_y_el_fenix"
main_facade = "facing:234:15"
notes = "Neo-baroque corner block of 1929-1938 on the wide chamfer of Xativa and Marques de Sotelo, opposite the Estacio del Nord: cream artificial-stone facades with four bow windows (two rounded corner oriels), a rusticated ground floor with a granite socle, an arched first floor, a projecting central section composed as a triumphal arch with giant Corinthian pilaster pairs, the inscription PROPIEDAD DE LA UNION Y EL FENIX ESPANOL, two green glazed pinnacles, and on top a square Ionic templete with pediments and a scaled slate-blue dome crowned by the bronze phoenix carrying Ganymede."

[landmark.info]
architect = "Enric Viedma i Vidal"
built = "1929 project, 1931-1938 (Catastro 1930)"
style = "Neo-baroque (eclectic, casticista)"
heritage = "BIE (inventory 286)"
address = "Carrer de Xativa 13 / Av. Marques de Sotelo 11-15, 46002 Valencia"

