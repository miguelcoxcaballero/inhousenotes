# upper cornice 29.0 (oriel tops), parapet 32.6, oriel crowns 34.4, inscription attic 34.2, templete entablature 38.1, dome 42.4, sculpture top ~46.4 m.

[landmark]
name = "Edifici La Unión y el Fénix"
slug = "la_union_y_el_fenix"
main_facade = "facing:234:15"
notes = "Neo-baroque corner block of 1929-1938 on the wide chamfer of Xativa and Marques de Sotelo, opposite the Estacio del Nord: cream artificial-stone facades with four bow windows (two rounded corner oriels), a rusticated ground floor with a granite socle, an arched first floor, a projecting central section composed as a triumphal arch with giant Corinthian pilaster pairs, the inscription PROPIEDAD DE LA UNION Y EL FENIX ESPANOL, two green glazed pinnacles, and on top a square Ionic templete with pediments and a scaled slate-blue dome crowned by the bronze phoenix carrying Ganymede."

