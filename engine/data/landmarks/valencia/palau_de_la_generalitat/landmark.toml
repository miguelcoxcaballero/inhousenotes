# Palau de la Generalitat Valenciana (Palau de la Generalitat, Valencia).
# Valencian Gothic palace of the Generalitat (Diputacio del General), 15th
# century, on Carrer de Cavallers / Placa de Manises; Renaissance tower (Torre Vella / Torre Antiga,
# east, on Placa de la Mare de Deu side) 1518-1585; its twin, the Torre Nova
# (west, on Placa de Manises / Carrer de Cavallers), built 1952 by Luis
# Alberto Ballesteros to the old design.
#
# Volumes (OSM building:parts = Catastro parts, PGOU ficha: "4 cuerpo
# central, 5 torres"):
#   part:1  Torre Nova (west), 21.15 x 10.6 m, 5 floors
#   part:2  Torre Vella (east), 19.3 x 10.7 m, 5 floors
#   middle  Gothic palace (outline:0 minus the towers, two courtyards with
#           glass roofs), 4 floors, top gallery of round arches under
#           corbelled tile eaves.
# Heights: constrained camera solves (scratchpad gen/tools/ba.py) on photos
# catastro (EXIF 4.5 mm, f 2917 px), 11 and 05 (EXIF 20 mm): tower main
# cornice top 20.6 m, attic cornice top 26.0 m, corner
# obelisk tips ~30.2 m; middle block walls 14.4 m (eave edge 14.2 m). Details in
# sources.toml [facts].


[landmark]
name = "Palau de la Generalitat Valenciana"
slug = "palau_de_la_generalitat"
main_facade = "facing:n"
notes = "Gothic palace with two Renaissance towers (1518-1585 and 1952 twin), Placa de Manises / Carrer de Cavallers."

[landmark.info]
architect = "Luis Alberto Ballesteros (1952 extension and west tower)"
built = "15th century; tower 1518-1585; west tower 1952"
style = "Valencian Gothic and Renaissance"
heritage = "BIC RI-51-0000971 (1931)"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
door_material = "doors"
frame_material = "frames"
iron_material = "iron"

[render]
sun = [200, 50]
paving = 70

# ------------------------------------------------------------- materials

[material.stone]
kind = "ashlar"
tint = "#cdbfa6"
block = [0.9, 0.42]
weathering = 0.35
seed = 11

[material.stone_old]
kind = "ashlar"
tint = "#a39079"
block = [0.8, 0.4]
weathering = 0.5
seed = 5

[material.stone_fine]
kind = "limestone"
tint = "#d9cdb6"
weathering = 0.25

[material.voussoir]
kind = "limestone"
tint = "#e4dccb"
weathering = 0.15

[material.roof]
kind = "roof_tiles"
tint = "#8c6c58"
weathering = 0.55

[material.doors]
kind = "painted_wood"
color = "#3b2a20"
tint = "#3b2a20"

[material.frames]
kind = "painted_wood"
color = "#4a3a2e"
tint = "#4a3a2e"

[material.glass]
kind = "glass"

[material.skylight]
kind = "curtain_wall"
color = "#9fb0b8"

[material.iron]
kind = "iron"
tint = "#2b2b2b"

