# Mercat de Colom (Mercado de Colon), Valencia. Francesc Mora i Berenguer,
# 1914-1916 (iron structure attributed to Demetrio Ribes), Valencian
# Modernisme. BIC RI-51-0008310. Refurbished 2003 (lower level, car park).
#
# GENERATED by a script (scratchpad gen.py); every number below is in the
# building frame u/w: u runs along the hall towards azimuth 60 (from the Jorge
# Juan portal, SW, to the Comte de Salvatierra facade, NE), w towards azimuth
# 150 (from Carrer de Martinez Ferrando, NW, to Carrer de Ciril Amoros, SE).
# Everything is one group turned rotate_y = 30 about the plan centre
# (x 1.14, z -0.67): x = 1.14 + u cos30 + w sin30, z = -0.67 - u sin30 + w cos30.
#
# Plan (OSM way 10120283 + Catastro 6423501YJ2762C parts, PNOA ortho):
#   hall columns/railing u -32.6..32.6 (65.2 m), w -19.13..19.2 (38.3 m);
#   side canopies cantilever to |w| 24.4 (PNOA roof edge, lean-corrected);
#   Jorge Juan portal block u -38.5..-31.1, w -13.8..13.98 (27.8 m), towers
#   w 5.7..9.65 projecting to u -39.6, great arch 11.6 m wide;
#   Salvatierra front: towers at w +-9.0 (OSM round kiosks around their feet,
#   r 4.4), pointed glazed arch 10.9 m; brick kiosks (casetas) 10-12.5 m in
#   front of both ends at w +-12.5 (PNOA).
#   (es.wikipedia gives 9 bays of 7 m: outer-line columns every 7 m from
#   u -31.5 to 31.5.)
# Heights (all with sources in sources.toml [facts.*]):
#   documented (es.wikipedia): central nave 18.60 m (ridge), cast-iron pillars
#   8 m (nave) and 5 m (outer), Jorge Juan arch key 16 m;
#   photo 16 (telephoto, 43.2 px/m from the 27.8 m portal width, anchored on
#   the 16 m arch key): gable apex 19.6, tower finial 19.45, spikes 21.1,
#   tower shaft 16.6, wing parapets 10.8 / 13.6;
#   overlay cycles on photos 01, 02, 18 (towers and fronts aligned first):
#   canopy eave 6.0, canopy ridge 9.0;
#   Salvatierra front: predecessor solves on photos 06 / 18 (tower spacing
#   18 m = 1045 px in photo 06): shoulders 19.2, crest 23.5, cupolas 24.4,
#   spikes 26.5.

[landmark]
name = "Mercat de Colom"
slug = "mercat_de_colom"
main_facade = "facing:240:20"
notes = "Iron-and-glass market hall (central nave with two clerestories and a glazed ridge, side aisles under cantilevered gabled canopies) between two Modernista brick fronts: the red-brick Jorge Juan portal (great round arch with blue ceramic roundels, gallery and balconies, produce mosaic in the gable, two turreted towers, wings with stone bases) and the tan-brick Comte de Salvatierra front (pointed glazed arch, wavy trencadis crest, two round towers with trencadis cupolas, glass kiosks with trencadis roofs). Four brick casetas, perimeter railings, car-park trench on Martinez Ferrando (the 2003 sunken lower level)."

[landmark.info]
architect = "Francesc Mora i Berenguer (iron structure: Demetrio Ribes)"
built = "1914-1916"
style = "Valencian Modernisme"
heritage = "BIC RI-51-0008310"

