[facts.plan]
value = "hall u -32.6..32.6 (65.2 m) x w -19.13..19.2 (38.3 m); Jorge Juan pavilion u -38.7..-31.1 (7.6 m deep) x w -13.8..13.98 (27.8 m), towers projecting to u -39.6 at |w| 5.7..9.65; NE front u 33.0-33.2 with round tower kiosks r 4.45 m centred at w +-9.0; side canopies to |w| 24.4"
source = "OSM way 10120283 and Catastro INSPIRE parts 4-6 of 6423501YJ2762C (footprint.json, they agree within 0.2 m); PNOA orthophoto for the canopy edges"
note = "es.wikipedia gives the municipal pavilion a 31 x 7.5 m base: the depth matches, the 31 m width probably includes the projecting stone bases; OSM/Catastro (27.8 m) are kept."

[facts.parcel_area]
value = 4348.45
unit = "m2"
source = "PGOU de Valencia, ficha BIC 02.02.01 (plans/01_2_01_MERCADO_COLON_firmado.jpg)"

[facts.nave_height]
value = 18.6
unit = "m"
source = "https://es.wikipedia.org/wiki/Mercado_de_Col%C3%B3n"
note = "'una [nave] central de 18,60 m de altura' -> nave ridge RIDGE_Y = 18.6 (was 17.8)."

[facts.hall_structure]
value = "side naves 9.70 m span, 6 m cantilevers each side, 9 bays 7 m apart, cast-iron pillars 8 m and 5 m"
source = "https://es.wikipedia.org/wiki/Mercado_de_Col%C3%B3n"
note = "Model: outer pillars (5 m + bracket post) on the column line w +-19.15 and nave pillars (8 m) at w +-9.45 (19.15 - 9.70), 9 bays of 7 m from u -31.5 to 31.5. Cantilever kept at 5.25 m to the PNOA roof edge (24.4) - the 6 m is probably measured along the slope / to the gutter."

[facts.jorge_juan_arch]
value = "arch key 16 m, 13 m between the supports"
source = "https://es.wikipedia.org/wiki/Mercado_de_Col%C3%B3n"
note = "Model: round arch 11.6 m at the brick intrados (photo 16: 510 px / 43.2 px/m = 11.8 m), white stone supports 12.7 m apart at the foot (photo 16), springing 10.2, key 16.0 m."

[facts.jorge_juan_heights]
value = "wing parapet 10.8 m (outer corner) rising to 13.6 m at the towers; gallery crest 11.6; gable shoulders 16.4; tower shaft top 16.6; turret ring 17.4-17.9; cupola top 19.3, finial ball 19.45; spikes 21.1; gable apex (crest base) 19.6; crest sculpture to 21.3"
source = "photo 16 (Felivet, telephoto from ~95 m, near-orthographic): horizontal scale 43.2 px/m from the 27.8 m portal width (OSM/Catastro), vertical anchored on the documented 16 m arch key at y 300 px; heights = 16 + (300 - y)/43.2. Checked against photos 01, 04, 12, 17 with the edge overlays."
note = "EXIF focal lengths could not be read (Commons API and upload.wikimedia.org returned HTTP 429 for this session), so the constrained solver (scratchpad cba.py: eye-height prior 1.6 m, focal fixed or free) ran with free focal; on photos 01, 02 (stitched), 03 and 04 its fits were inconsistent (rms 15-60 px) and were not used for heights."

[facts.canopy_heights]
value = "side canopy eave 6.0 m at w +-24.4, ridge 9.0 m over the column line (w +-19.1), inner slope to the lower clerestory at 8.0 m (w +-11.6), clerestories 8.0-10.6 and 11.2-15.4 m"
source = "edge-overlay cycles on photos 01, 02 and 18 after the fronts/towers were aligned (the canopy ran 1.5-2 m low at 5.2/7.0 m); consistent with the documented 5 m outer pillars carrying branching brackets"

[facts.salvatierra_heights]
value = "NE wall shoulders 19.2 m, wavy crest apex 23.5 (+trencadis roll), pointed glazed arch 10.9 m wide springing 10.2, apex 17.7, oculus centre 15.7, marquee 10.1; round towers r 1.45 at w +-9.0, stone ring 18.8, belfry to 23.0, trencadis cupola top 24.4, spikes 26.5"
source = "photo 06 (frontal telephoto at night; tower axes 18 m apart = 1045 px -> 58 px/m) for ratios and widths, solved views from the first modelling pass (photos 06, 18); tower radius from photo 06 (shaft ~160 px = 2.75 m)"
note = "Absolute NE heights rest on the camera solves of the first pass (no documented figure); es.wikipedia gives the glass marquee about 4 m in height (its own height, not modelled separately)."

[facts.sunken_level]
value = "lower level (2003 refurbishment) with a pool, escalators and shops under the hall; four basement levels (car park)"
source = "https://es.wikipedia.org/wiki/Mercado_de_Col%C3%B3n; photo 13 (interior)"
note = "Not modelled as an opening in the hall floor (only the car-park ramp trench on Martinez Ferrando and the glazed shopfront ring are)."

