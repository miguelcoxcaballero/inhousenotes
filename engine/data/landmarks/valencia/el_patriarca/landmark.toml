# Real Colegio Seminario de Corpus Christi ("El Patriarca"), Valencia, 1586-1610.
#
# PLAN (footprint.json, landmark-local metres, x east, z south). A whole
# block: main (south) front on the Placa del Patriarca / c. de la Nau facing
# La Nau, east front on c. de Sant Joan de Ribera, west front on c. de la
# Creu Nova, north front on c. del Cardenal Paya. Volumes from the Catastro
# building parts (refcat 6027501YJ2762E): south + east wing (catastro:8),
# church (catastro:5, one tall storey, Latin cross, crossing dome at OSM way
# 1077212192), cloister galleries (catastro:6) round the patio (OSM inner
# ring 0, 8 x 5 arches), north wing (catastro:3), north blocks
# (catastro:0, 1, 9), NE block (catastro:7), the two stair towers
# (catastro:4, catastro:10 with the espadanya) and the bell tower (OSM way
# 1414404138 / catastro:2) at the SW corner.
#
# FACADE FRAME. The south front is one straight line from the tower SW corner
# A = (-32.81, 28.95) at azimuth 98.15 deg: P(s) = A + s * (0.9899, 0.1418),
# outward normal (-0.1418, 0.9899). Positions on it are quoted as s (m).
#
# HEIGHTS: constrained bundle adjustment of photos catastro, 02, 04 (fixed
# focal lengths from EXIF, eye-height prior 1.6 m, tower corners from OSM,
# La Nau corner from OSM context): tower belfry band 21.5, belfry opening
# 23.8-27.7, cornice 28.6-30.7, parapet 31.4, corner balls 32.5; south front
# cornice top 19.4 (19.0 at s 18.7), triglyph frieze 17.0-18.4, gallery
# windows 13.9-16.6 at 1.85 m centres, gallery string course 12.5-13.2;
# lantern cap 35.1. Details in sources.toml [facts].

[landmark]
name = "Real Colegio Seminario de Corpus Christi (El Patriarca)"
slug = "el_patriarca"
main_facade = "facing:s"
notes = "Renaissance seminary college of Archbishop Juan de Ribera: severe brick and ashlar fronts, a Doric gallery of small arched windows under a triglyph frieze, the Renaissance portal (1603), the classical bell tower at the corner, the church dome on a high drum with blue-and-white glazed tiles and a lantern, and the two-storey marble cloister."

[landmark.info]
architect = "Guillem del Rei (works), Gaspar Gregori (design attribution)"
built = "1586-1610"
style = "Renaissance"
heritage = "Bien de Interes Cultural RI-51-0001416"

[defaults]
material = "brick_render"
roof_material = "roof"
glass_material = "glass"
door_material = "door"
iron_material = "iron"
floor_height = 3.6

[render]
sun = [200, 52]
paving = 70
street_eye = [-36.0, 1.6, 64.0]
street_target = [-14.0, 11.0, 31.0]
street_fov = 62

[reference_heights]
campanar = { height = 31.4, tolerance = 0.6, source = "tower parapet top: bundle adjustment of photos catastro, 02, 04" }
tower_balls = { height = 32.5, tolerance = 0.6, source = "corner balls, same solve" }
south_cornice = { height = 19.2, tolerance = 0.4, source = "south front cornice top 19.4 at the tower, 19.0 at s 18.7 (photos 02, 04)" }
dome = { height = 36.0, tolerance = 0.8, source = "lantern cap apex 35.0-35.1 (photos 02, 04) + cross" }

