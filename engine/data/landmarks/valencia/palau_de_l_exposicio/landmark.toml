# Palau de l'Exposicio (Palacio de la Exposicion), Carrer de Galicia 3 / Arquitecte Mora, Valencia.
# Built in 1909 by Francesc Mora i Berenguer as the city's pavilion (Palacio Municipal) of the
# Exposicion Regional Valenciana 1909; neo-Gothic / Valencian modernista; now municipal offices.
# Generated by scratchpad pdx/gen/gen.py.  Plan: OSM way 150277194 + Catastro 6928402YJ2762H parts
# (checked on the IGN PNOA orthophoto).  Heights: see [reference_heights] and sources.toml [facts].

[landmark]
name = "Palau de l'Exposició"
slug = "palau_de_l_exposicio"
main_facade = "facing:199:10"
notes = "Neo-Gothic exhibition palace of 1909: a long two-storey hall front on Carrer de Galicia (arcaded porch of three round arches between two great arched windows, fifteen stained-glass lancets in five bays above, pierced cresting and pinnacles), a crenellated square tower with ornamental merlons at the south-east corner, a slender octagonal 'Micalet' tower with wimpergs, balcony, lantern and glazed-tile spire at the south-west corner, a crenellated entrance wing with the round-arched gate, macers and the city arms, a rounded corner and a plain machicolated tower at the north-west corner."

[landmark.info]
architect = "Francesc Mora i Berenguer"
built = "1908-1909"
style = "Neo-Gothic / Valencian modernisme"
heritage = "Bien de Relevancia Local (BRL 06.02.13)"

[defaults]
material = "stucco"
roof_material = "terrace"
glass_material = "glass"
frame_material = "frame"
door_material = "door"
iron_material = "iron"

[render]
sun = [200, 48]
paving = 70

