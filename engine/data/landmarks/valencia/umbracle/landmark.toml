# L'Umbracle (Santiago Calatrava, 1998-2001), Ciutat de les Arts i les Ciencies,
# Valencia: the landscaped promenade over the CAC car park, a long garden covered
# by white arches and longitudinal shade slats, on the south side of the complex
# along the Autopista del Saler.
# Measured (see sources.toml [facts]):
#   * arches: 109 parallel ribs every 2.5 m (PNOA orthophoto periodogram: 2.50 m,
#     alternating 5.0 m), s = -135 .. +135 m (270 m, = OSM/Catastro outline);
#     55 "fixed" ribs (both feet on the garden walls, s = -135 + 5k) and
#     54 "floating" ribs between them whose NE end is carried on a
#     longitudinal tube over the promenade and ends in a cantilevered tip;
#   * span between the feet 36.1 m (OSM/Catastro t = -18.1 .. +18.0), rise 19.0 m
#     above the springing (published 18 m), parabola-like profile y = 1 - u^1.90
#     fitted on the end-on photo 03;
#   * deck (promenade, avenue level) 8.2 m above the pond walkway: photo 06
#     solved camera; the NE face over the pond is an arcade of white
#     branching "tree" frames every 10 m (PNOA), the SW face a row of
#     trencadis "eyes" (one per rib, photo 12);
#   * published: 320 x 60 m, 17 500 m2, 55 fixed + 54 floating arches 18 m high.
# Generated by a script (axis frame s along the axis, t across to the NE).

[landmark]
name = "L'Umbracle"
slug = "umbracle"
main_facade = "facing:sw"
notes = "Built in the Umbracle axis frame (s along the axis, azimuth 128.7 deg; t across, + = NE) and written in landmark-local coordinates by a generator. y = 0 is the riverbed / pond walkway level shared with L'Hemisferic and the Museu de les Ciencies; the garden, promenade and Autopista del Saler are at the deck level (8.2 m). The SW face is shown as the car-park wall because the flat world has no raised avenue. Footprint IoU vs OSM is low by construction: the OSM outline is the arch-covered garden (270 x 36 m) while the model also holds the car-park deck under the NE promenade (t to +40.5 m)."

[landmark.info]
architect = "Santiago Calatrava"
opened = 2001
style = "Neo-futurism / structural expressionism"
length_m = 320
width_m = 60
arch_height_m = 18
fixed_arches = 55
floating_arches = 54

[defaults]
material = "white_concrete"
detail = 1.0

[render]
