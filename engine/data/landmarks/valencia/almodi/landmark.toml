# Almodí de València (Almudín), the municipal granary next to the cathedral apse.
# Plan: Catastro 6031201YJ2753B (a trapezoid: west front 21.0 m, east front 17.4 m,
# long sides 43.9 / 44.1 m), checked on the IGN PNOA orthophoto. Heights solved by a
# constrained bundle adjustment of 5 photos (see sources.toml [facts]).
# Local axis of the hall: u = (0.977, 0.2127) along the south front (azimuth 102.3°),
# t = distance north of the south wall line; the nave (raised central hall with a
# clerestory) has its walls at t = 4.6 .. 15.85 m and its gable faces at u = 4.3 .. 35.3 m.

[landmark]
name = "Almodí de València"
main_facade = "facing:e"
notes = "Gothic granary (works 1417, porch 16th c., roofs 17th c.); basilical hall: low hipped roof over the aisles, gabled clerestory nave, serliana-like porch of three round arches on the Plaça de Sant Lluís Bertran"

[landmark.info]
built = "1417-c. 1455, porch 16th c., roof 17th c., restored 1993-1996"
architects = "Guillem Just, Miquel Navarro, Francesc Baldomar"

[defaults]
material = "tapia"
roof_material = "roof"

[render]
sun = [120, 45]
paving = 45
hide_context = [60]

[reference_heights]
"catastro:0" = { height = 15.16, tolerance = 0.6, source = "ridge of the clerestory nave, bundle adjustment of photos 02 03 06 09 15" }
eave_core = { height = 9.65, tolerance = 0.3 }
gable_w = { height = 15.16, tolerance = 0.3, source = "apex of the west gable coping, bundle adjustment" }
gable_e = { height = 15.16, tolerance = 0.3 }

# ---------------------------------------------------------------- materials
[material.tapia]          # Valencian tapia: lime-rubble walls laced with brick ends
kind = "travertine"
tint = "#e9e6ee"
uv_scale = 1.2
weathering = 0.3

[material.ashlar]         # limestone ashlar of the porch front and the corners
kind = "limestone"
tint = "#d8d0c2"
block = [0.8, 0.4]
weathering = 0.35

[material.voussoir]
kind = "limestone"
tint = "#d8c7a8"

[material.brick_arch]
kind = "brick"
tint = "#e0b89a"

[material.infill]
kind = "plaster"
tint = "#efe8dc"

[material.nave]
kind = "travertine"
tint = "#dcd6e0"
uv_scale = 2.0
weathering = 0.2

[material.timber]
kind = "wood"
tint = "#7a3f24"

[material.roof]
kind = "roof_tiles"
tint = "#8a7f74"
weathering = 0.6

[material.porch_glass]
kind = "glass"
tint = "#3a2224"

[material.dark_iron]
kind = "iron"
tint = "#2a2624"

# ---------------------------------------------------------------- walls
# Lower storey (0 - 5.4 m): ashlar on the porch front, tapia elsewhere.
[[element]]
type = "mass"
name = "body_low"
polygon = "catastro:0"
y0 = 0
height = 5.4
top = false
edge_materials = [{ edges = "facing:e", material = "ashlar" }]

  # Porch on the Plaça de Sant Lluís Bertran: three round arches on two pairs of
  # polygonal piers, a rectangular opening between each pair (photo 09, 68.9 px/m):
  # 1.7 | arch 3.4 | 0.5 | 1.15 | 0.5 | arch 3.0 | 0.5 | 1.15 | 0.5 | arch 3.4 | 1.6
  [[element.openings]]
  edges = "facing:e"
  kind = "arch"
  arch = "round"
  width = 3.4
  height = 4.64
  levels = [0]
  bays = { at = [3.4, 14.1] }
  infill = "glass"
  frame = 0.06
  transoms = 1
  depth = 0.45
  surround = { width = 0.38, projection = 0.03 }
  frame_material = "dark_iron"
  material = "voussoir"
  glass_material = "porch_glass"

  [[element.openings]]
  edges = "facing:e"
  kind = "arch"
  arch = "round"
  width = 3.0
  height = 4.57
  levels = [0]
  bays = { at = [8.75] }
  infill = "glass"
  frame = 0.06
  transoms = 1
  depth = 0.45
  surround = { width = 0.38, projection = 0.03 }
  frame_material = "dark_iron"
  material = "voussoir"
  glass_material = "porch_glass"

  [[element.openings]]
  edges = "facing:e"
  kind = "door"
  arch = "flat"
  width = 1.15
  height = 3.17
  levels = [0]
  bays = { at = [6.175, 11.325] }
  infill = "glass"
  frame = 0.06
  frame_material = "dark_iron"
  depth = 0.45
  glass_material = "porch_glass"

  # South front (Carrer de l'Almodí): tall pointed doorway and the walled-up arch
  # near the SW corner (positions along the front from the bundle adjustment).
  [[element.openings]]
  edges = "facing:s"
  kind = "door"
  arch = "pointed"
  width = 1.8
  height = 5.0
  levels = [0]
  bays = { at = [21.34] }
  infill = "door"
  depth = 0.5
  door_material = "timber"

  [[element.openings]]
  edges = "facing:s"
  kind = "blind"
  arch = "round"
  width = 2.1
  height = 3.0
  levels = [0]
  bays = { at = [2.91] }
  depth = 0.08
  voussoirs = { count = 15, width = 0.45 }
  material = "brick_arch"

# Upper storey (5.4 - 8.6 m): tapia with the row of small square windows between
# brick piers under the eaves (the old crenels; 12 on the porch front, pitch 1.38 m).
[[element]]
type = "mass"
name = "body_high"
polygon = "catastro:0"
y0 = 5.4
height = 3.35
top = true
string_courses = [8.5]

  [[element.openings]]
  edges = "all"
  kind = "window"
  arch = "flat"
  width = 0.64
  height = 0.86
  levels = [7.55]
  bays = { spacing = 1.383, margin = 0.6 }
  infill = "dark"
  depth = 0.35
  sill = { depth = 0.06, height = 0.05 }

# Dark timber band behind the exposed rafters (wall plate to roof boards).
[[element]]
type = "mass"
name = "eave_core"
material = "timber"
polygon = { ref = "catastro:0", inset = 0.05 }
y0 = 8.75
height = 0.9

[[element]]
type = "array"
name = "rafters"
mode = "edges"
polygon = "catastro:0"
edges = "all"
spacing = 1.383
corners = "skip"
y = 8.86
material = "timber"
  [[element.children]]
  type = "box"
  min = [-0.08, 0.0, -0.05]
  max = [0.08, 0.24, 1.42]

# Lower roof: one hipped roof over the whole trapezoid, eave edge 1.5 m out at 9.19 m,
# 16° (meets the nave wall at 10.9 m, measured 10.86 m).
[[element]]
type = "roof"
name = "aisle_roof"
polygon = { ref = "catastro:0", offset = 1.5 }
y = 9.19
shape = "hip"
pitch = 16
overhang = 0
thickness = 0.22
ridge_cap = true

# ---------------------------------------------------------------- nave
[[element]]
type = "mass"
name = "nave"
material = "nave"
polygon = [[-17.82, 2.25], [11.19, 8.56], [13.58, -2.43], [-15.42, -8.74]]
y0 = 9.5
y1 = 13.2
top = true

  [[element.openings]]   # clerestory glazing band
  edges = ["facing:s", "facing:n"]
  kind = "window"
  arch = "flat"
  width = 1.55
  height = 1.2
  levels = [11.3]
  bays = { spacing = 1.75, margin = 0.5 }
  infill = "glass"
  frame = 0.07
  mullions = 1
  depth = 0.2

[[element]]
type = "roof"
name = "nave_roof"
on = "nave"
shape = "gable"
ridge = "long"
pitch = 18
overhang = 0.62
thickness = 0.2
ridge_cap = true

# Gable walls rising as parapets with a coping over the nave roof (photos 06, 09, 15).
[[element]]
type = "wall"
name = "gable_w"
material = "nave"
path = [[-18.27, 2.79], [-15.62, -9.39]]
y0 = 12.0
top_profile = [[0, 13.16], [6.24, 15.16], [12.47, 13.16]]
thickness = 0.64

[[element]]
type = "wall"
name = "gable_e"
material = "nave"
path = [[11.38, 9.25], [14.03, -2.94]]
y0 = 12.0
top_profile = [[0, 13.16], [6.24, 15.16], [12.47, 13.16]]
thickness = 0.64

# ---------------------------------------------------------------- details
# Royal escutcheons over the three arches of the porch front (photo 09).
[[element]]
type = "relief"
name = "shield_0"
material = "voussoir"
at = [20.12, 5.45, 11.69]
facing = 100.8
size = [0.36, 0.45]
shape = "shield"
depth = 0.06
relief = "boss"

[[element]]
type = "relief"
name = "shield_1"
material = "voussoir"
