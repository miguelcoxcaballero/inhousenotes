# Ashlar corner stones up the south front at both ends (photos 03, 06, 08).
[[element]]
type = "relief"
name = "quoin_sw"
material = "ashlar"
at = [-22.84, 0.0, 5.86]
facing = 192.3
size = [1.6, 5.4]
depth = 0.03
frame = 0

[[element]]
type = "relief"
name = "quoin_se"
material = "ashlar"
at = [18.69, 0.0, 14.9]
facing = 192.3
size = [1.6, 5.4]
depth = 0.03
frame = 0

# Walled-up arch infill near the SW corner.
[[element]]
type = "relief"
name = "blocked_arch_infill"
at = [-20.78, 0.0, 6.31]
facing = 192.3
size = [1.05, 2.01]
shape = "arched"
depth = 0.04
frame = 0
material = "infill"

