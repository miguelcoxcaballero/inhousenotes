[landmark]
name = "Estadi Ciutat de Valencia"
slug = "estadi_ciutat_de_valencia"
main_facade = "facing:283:40"
notes = "Levante UD stadium in Orriols (1969, architect Salvador Pascual Gimeno; ring roof 2019-2021). A single continuous concrete bowl round a 105 x 68 m pitch, a four-storey tribuna block on the west car park, raking frames painted navy and Levante blue on the other sides, and a white ring roof on short posts with membrane cushions over all four stands. The OSM building:part levels (1-2) describe the rooms under the stands, so the part height warnings are expected."

[landmark.info]
architect = "Salvador Pascual Gimeno (1969)"
