# Mercat Central de València (Mercado Central), Valencian Modernisme.
# Alexandre Soler i March and Francesc Guàrdia i Vial (project 1910, works
# 1914-1928, finished by Enric Viedma and Àngel Romaní). Generated by a
# script from footprint.json and the PNOA orthophoto (see sources.toml):
# the plan is laid out on a grid of naves running towards azimuth 49 deg
# (u, towards the main facade on Plaça del Mercat, facing the Llotja) and
# 139 deg (w).
#
# Volumes: five parallel naves (side-nave eaves 13.5 m, raised central nave
# 23 m wide with eaves 14.2 m), a transept of the same height through the
# main dome (crossing at u 13.5, w 5.8), chamfered gabled corners, the
# octagonal fish market (pescateria) on the NW side with its own dome, the
# stone office block with two domed corner turrets on the SW side (Plaça de
# la Ciutat de Bruges / Av. del Baró de Càrcer), the two brick pavilions of
# the Concejalía (N and E) and the one-storey stalls against the walls.
# Second pass: heights measured on photos with solved cameras (sources.toml
# facts.update2_heights), portico with marquees, 13 photo views.

[landmark]
name = "Mercat Central"
slug = "mercat_central"
main_facade = "facing:49:10"
notes = "Main dome ~30 m (sources), parrot (cotorra) weathervane; fish-market dome with swordfish weathervane. Plan from OSM + PNOA orthophoto; heights estimated from photos (see sources.toml facts)."

[landmark.info]
architect = "Alexandre Soler i March, Francesc Guàrdia i Vial; works finished by Enric Viedma i Vidal and Àngel Romaní"
style = "Valencian Modernisme (Art Nouveau)"
built = "1914-1928"
heritage = "BIC RI-51-0008309"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
frame_material = "louvre"
iron_material = "iron"
detail = 0.75

[render]
sun = [200, 50]
# street view: fixed camera on the Plaça del Mercat, 28 m in front of the
# main entrance (the automatic one backed into a neighbour)
street_eye = [64.64, 1.7, -47.58]
street_target = [43.18, 10.0, -29.59]
street_fov = 62
exposure = 0.55
paving = 90

# ------------------------------------------------------------- materials

[material.stone]
kind = "ashlar"
tint = "#f4e4c0"
block = [1.2, 0.5]
weathering = 0.12

[material.office_stone]
kind = "limestone"
tint = "#ece4d3"
weathering = 0.15

[material.stone_fine]
kind = "limestone"
tint = "#f3e5c6"
weathering = 0.15

[material.azulejo]
kind = "azulejo"
pattern = "checker_blue"
uv_scale = 0.28
tint = "#f2f2ee"

[material.yellow_band]
kind = "glazed_tiles"
pattern = "stripes"
colors = ["#d9a92a", "#e8c24a", "#2f5aa8"]
uv_scale = 0.8

# Spandrel ceramic (photos e29, 10, 13): a lattice of orange-red glazed
# strips (diagonals) with red rosettes at the nodes over white tiles with
# a blue motif; one lattice cell is about 0.75 m. polychrome tile: k0 field,
# k1 petal, k2 centre, k3 diagonals, k4 corners -> blue motif in the field,
# red diagonals meeting in red corner rosettes.
[material.ceramic]
kind = "polychrome"
colors = ["#c3cde3", "#2b4c9c", "#c9573b", "#c9573b", "#c24a34"]
uv_scale = 4.5

[material.roof]
kind = "roof_tiles"
tint = "#a08a80"

[material.zinc]
kind = "zinc"

# louvred iron shutters: horizontal slats as light / shadow stripes
[material.slats]
kind = "glazed_tiles"
pattern = "stripes"
colors = ["#a99d86", "#857a67", "#5f574a"]
uv_rotate = 90
uv_scale = 0.75
clearcoat = 0.0
roughness = 0.6

