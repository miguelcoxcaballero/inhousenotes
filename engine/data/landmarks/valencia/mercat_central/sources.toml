[facts.update2_heights]
value = "socle band 5.6-6.0 m; NE windows: outer arches 12.5 m, inner 14.75 m, central 16.9 m, rose centre 14.6 m (r 1.95); central gable eaves 14.2 m, pitch 20 deg; crown 22 m; fish market eaves 13.2 m, NW gable apex ~19 m; fish dome 10 m across, drum 22.3-24.9 m, cap top 28.5 m; portico 14.7 m wide, ~5 m deep, landing 1.75 m"
source = "photo measurements with solved cameras: e26 and 02 (back-projection onto the facade plane), 07 (telephoto, face 23.2 m = 475 px), 09 (dome ratio)"
note = "Concejalia brick pavilions modelled on Catastro context parcels 206 (north) and 207 (east); market stalls on parcels 203-205 and 208."
