[facts.dome_height]
value = 30
unit = "m"
source = "https://www.hoteles.net/valencia/mercado-central-valencia.html"
note = "Main dome about 30 m high (several guides); modelled dome apex 30.0 m, lantern + parrot to ~38 m."

[facts.weathervanes]
value = ["parrot (cotorra) on the main dome", "swordfish on the fish-market dome"]
source = "https://commons.wikimedia.org/wiki/File:The_dome_of_the_Mercat_Central,_with_its_unmistakeable_parrot_(%22cotorra%22).jpg"

[facts.modelled_heights]
value = "socle 5.2 m; side-nave eaves 13.5 m; central nave/transept eaves 15 m, ridge ~20 m; main crown 23 m; main dome drum 20-24.8 m, apex 30 m; fish-market walls 11 m, dome cap top ~28.8 m; SW office 10.2 m, turrets 10.8 m + dome to ~18.6 m"
source = "photo measurements: e26 (camera 21.5 m from the facade, person 1.75 m for scale), 03 and 09 (dome heights relative to the 30 m main dome)"
note = "OSM building:levels = 2 and Catastro floors (1-3) describe usable floors, not the height of this iron hall, so the height_check warnings are expected."

