# Museu de les Ciencies Principe Felipe (Santiago Calatrava, opened 13 Nov 2000),
# Ciutat de les Arts i les Ciencies, Valencia.
# Generated by a script from a parametric cross-section in the building axis frame
# (s along the axis, azimuth 128.8 deg towards SE; t across towards SW, t = 0 on the
# north ground edge of OSM outline 0); see sources.toml for every dimension and its source.
#   * 21 transverse concrete frames every 10.1 m (PNOA roof plan + OSM rib notches);
#   * north (Turia garden) side: 20 folded glazed bays leaning back, crowned by the
#     21 triangular steel trusses;
#   * roof: 20 metal-clad vaults falling from ~38 m (north) to ~25 m (south);
#   * south (pool) side: white concrete lattice with pointed windows over the
#     cantilevered upper promenade, Y-columns underneath ("ribcage");
#   * east/west ends: glazed fans with parallel struts leaning out ~54 deg;
#   * NW/SE monumental stairs from the pools to the promenade; pools from OSM.

[landmark]
name = "Museu de les Ciències Príncep Felip"
