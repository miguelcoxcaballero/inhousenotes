# Casa dels Dracs (Casa de los Dragones), Carrer de Sorni 4 / Carrer de Jorge Juan, Pla del Remei
# (Eixample), Valencia. Jose Maria Manuel Cortina Perez, 1901 (Catastro: 1910). Valencian modernisme
# with neo-Gothic dress: four storeys (ground floor + entresol under one banded order, first and
# second floors with iron balconies), a crenellated corner pavilion on the chamfer with pinnacles and
# a central urn, a gabled niche with a star medallion carrying a winged dragon, a quatrefoil rose
# over the wooden portal, red-brick side sections framed in yellow stucco, twisted columns on corbels
# and dragons coiled under the brackets. Only two street fronts: the rest are party walls.
#
# Generated by scratchpad dracs/gen.py; every number is in sources.toml [facts].
#
# PLAN: street lines = OSM way 496338533 (checked on the PNOA orthophoto); the chamfer is lengthened
#   from the OSM 5.32 m to the Catastro 6.05 m (Catastro parts 2/3/5 corner), which also makes the
#   photo scale agree with the LiDAR roof (15.2 m) and gives 0.86 m balcony railings and a
#   2.37 x 3.9 m portal. The Dracs is Catastro parcel 6424601 (Jorge Juan front 20.5 m, Sorni front
#   20.0 m); the rest of the OSM outline is the neighbouring 1914 building 6424624 (Jorge Juan 3).
# HEIGHTS: upright photo 07 (Rafa Esteve 2024, chamfer face-on, 54.4 px/m from the chamfer):
#   first-floor slab 7.0, second-floor slab 10.75, terrace / parapet base 14.0, crenel tops 14.93,
#   merlons 15.57, corner pinnacles 16.27, urn 17.13; PNOA-LiDAR roof cells 15.0-15.7 over the front
#   bays, 17.3-18.1 over the stair house; cameras checked with the constrained solver.

[landmark]
name = "Casa dels Dracs"
slug = "casa_dels_dracs"
main_facade = "facing:305:15"
notes = "Modernista corner apartment building (1901) with dragon reliefs; corner pavilion on the chamfer of Sorni / Jorge Juan; the neighbouring 6424624 building fills the rest of the OSM outline."

[landmark.info]
architect = "José María Manuel Cortina Pérez"
built = "1901 (Catastro 1910)"
style = "Valencian modernisme, neo-Gothic"
heritage = "Bé de Rellevància Local"
address = "Carrer de Sorní 4 / Carrer de Jorge Juan, València"

[defaults]
material = "stucco"
roof_material = "terrace"
glass_material = "glass"
door_material = "door"
iron_material = "iron"
frame_material = "frame"

[render]
sun = [235, 48]
paving = 45

hide_context = ["context:39"]


[reference_heights]
