# Casa Consistorial de Valencia (Ajuntament de Valencia), Placa de l'Ajuntament 1.
# Eclectic / neo-baroque town hall: plaza front 1906-1930 by Carlos Carbonell and Francesc Mora
# (clock tower, balcony on four columns, two pavilions with segmental crests, round corner towers
# with glazed-tile domes) built around the 18th-century Casa de Ensenanza (Arquebisbe Mayoral).
# GENERATED by scratchpad aj/gen/gen.py: every dimension is listed with its source in sources.toml [facts].
# Plan: OSM relation 11174923 + building:parts (checked on the PNOA orthophoto, within ~0.5 m).
# Heights: constrained camera solve on photo n22 (distant frontal, 13 point matches, 3 px rms) and
# n18 (EXIF 25 mm-eq, fixed focal), cross-checked with overlays on the other views.
# check() reports "model too high" against the OSM building:levels tags: expected, the tags count 3.2 m
# per level but the storeys here are 5-6 m (measured heights in sources.toml [facts]).
# Plaza / side fronts are 3 m deep skin masses carrying the openings (the ring mass behind is cut back),
# so window rooms have depth; rusticated ground floor = separate 0.5 m skins in stone_rust.

[landmark]
name = "Ajuntament de Valencia"
slug = "ajuntament_de_valencia"
main_facade = "facing:90:5"
notes = "Town hall on the Placa de l'Ajuntament: ashlar plaza front with rusticated ground floor, central balcony on four columns, two pavilions with giant columns and segmental crests, central clock tower with an iron bell cage, round corner towers with drums and red glazed-tile domes; 18th-century Casa de Ensenanza wing (ochre stucco, tiled hip roofs) at the back."

[landmark.info]
architect = "Francesc Mora i Berenguer, Carlos Carbonell Panella (plaza front); Casa de Ensenanza 1758-1763"
built = "1758-1763 (Casa de Ensenanza); plaza front 1906-1930"
style = "Eclectic / neo-baroque"
heritage = "Bien de Relevancia Local BRL 01.06.05"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
door_material = "door"
iron_material = "iron"

