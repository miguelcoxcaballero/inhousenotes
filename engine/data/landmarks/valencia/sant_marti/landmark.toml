# Esglesia de Sant Marti Bisbe i Sant Antoni Abat, Valencia (Carrer de Sant Vicent Martir 11).
# Valencian Gothic single nave with chapels between the buttresses (14th-15th c.), trapezoidal
# plan adapted to the streets, Renaissance polygonal head with lantern, Baroque bell tower
# (1621-1627, upper cupola removed in the 19th c.), Communion chapel (1669-1674, Gaspar Matutano)
# and the Baroque west portal (Francesc Vergara, c. 1739-1750) with the bronze equestrian group of
# Saint Martin and the beggar (attr. Pieter de Beckere, 1494) in its niche.
# Generated by scratch gen.py; every dimension is in sources.toml [facts] with its source.

[landmark]
name = "Església de Sant Martí"
slug = "sant_marti"
main_facade = "facing:w"
notes = "Plain 29 m ashlar screen facade on Carrer de Sant Vicent with the Baroque portal and the equestrian Saint Martin, rectangular Baroque tower behind its north end (balustrade 38.7 m), tiled gable nave roof, south front on Carrer de l'Abadia de Sant Marti with the side portal and two small tile-roofed chapels, Communion chapel with its blue dome and red lantern on the north square."
[landmark.info]
architect = "Communion chapel: Gaspar Matutano and Josep Escriva (1669-1674); tower: Bartomeu Abril and Tomas Leonart Esteve (1621-1627); west portal attr. Francesc Vergara (c. 1739-1750)"
built = "14th-15th c. (Gothic church), 16th c. head, 1621-1627 tower, 1669-1674 Communion chapel, 1739-1753 Baroque renovation"
style = "Valencian Gothic; Renaissance head; Baroque tower, chapel and portals"
heritage = "BIC RI-51-0004788"

[defaults]
material = "stone"
roof_material = "roof"
detail = 1.0

