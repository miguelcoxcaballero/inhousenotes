# Torre de França / Torre de Francia (Avinguda de França 2, València).
# 2002-2003 residential tower, the tallest housing block in Valencia: an H-plan slab 25.1 x 28.6 m
# (axis bearing 13.9 deg) with full-height slots 9.6 m wide and ~8 m deep in the middle of the long
# WNW and ESE faces, two 33-storey wings, a 35-storey core (+ plant floor) set back 3.6 m, and on the
# two short faces (NNE to the Avinguda de França, SSW to the Jardí del Túria) a 29-storey bay with two
# stacks of deep balconies with solid white fronts either side of a column of windows; white
# ceramic/aluminium panel cladding with punched windows and small projecting frames on the long faces.
# A 12-13 storey wing of the same complex (same Catastro parcel) is attached to the ESE.
# Plan: OSM building:parts = Catastro INSPIRE parts (checked on the PNOA orthophoto); heights: IGN
# PNOA-LiDAR building-height grid + camera solves (see sources.toml [facts]).
#
# GENERATED by scratchpad tdf/gen.py from params.json; edit the generator, not this file.

