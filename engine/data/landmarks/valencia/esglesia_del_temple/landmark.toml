# Esglesia i Palau del Temple (Valencia): church of the Order of Montesa and its convent-palace
# (now the Delegacion del Gobierno), Miguel Fernandez (Sabatini school), 1761-1770, neoclassical.
# Generated by scratchpad tem/gen/gen.py; every dimension is in sources.toml [facts] with its source.
#
# PLAN. The OSM outline (relation 11177870) is only the palace quadrangle; the church (OSM way
# 813424045) is Catastro context 92 (+ 93 drum circle, 94/95 tower bases), modelled from those
# rings, checked on the IGN PNOA orthophoto (tower caps and lantern lean ~0.09 m/m to the NNW).
# The church is turned 12.3 deg from the grid: its east front faces azimuth 77.7, 25.27 m wide;
# towers 6.8 m square centred 4.4 / 20.9 m from the south end, 16.5 m apart (PNOA), front faces
# 1.2 m behind the front; drum r 6.2 centred on the axis 31.2 m behind the front.
#
# HEIGHTS. Photo 11 (near-frontal, D ~27.6 m, f ~1330 px from the tower spacing) section model,
# photos 03 / 10 / 08 / 15 ratios and a small bundle adjustment (photos 03 + 11):
# capitals 14.25, crowning cornice 17.4, pediment apex 20.0, tower cornice 25.0, tower cap 29.0,
# flank walls 16.3, drum cornice 22.8, dome 28.6, lantern cap 32.6; palace cornice 17.2.

[landmark]
name = "Esglesia i Palau del Temple"
slug = "esglesia_del_temple"
main_facade = "facing:78:12"
notes = "Neoclassical church (1761-1770) of the Order of Montesa with a giant Ionic front between two square bell towers with glazed tile caps, a blue glazed-tile dome on a brick drum, and the three-storey ashlar convent-palace around a cloister (Delegacion del Gobierno)."

[landmark.info]
architect = "Miguel Fernandez (design), works directed by Antonio Gilabert (attrib.)"
built = "1761-1770"
style = "Neoclassical (Sabatini school)"
heritage = "BIC RI-51-0004320"
frame = "church elements generated in a frame turned 12.3 deg (front azimuth 77.7); palace on Catastro parts"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
door_material = "doors"
iron_material = "iron"

[render]
sun = [150, 50]
paving = 70
hide_context = ["context:92", "context:93", "context:94", "context:95"]

[reference_heights]
"outline:0" = { height = 19.0, tolerance = 1.5, source = "palace cornice 17.2 m (photo 03 scaled on the church front) + hip roofs ~2 m (PNOA)" }
front_cornice = { height = 17.4, tolerance = 0.5, source = "photo 11 section model, photo 10" }
pediment = { height = 20.0, tolerance = 0.5, source = "photo 11, bundle adjustment 03+11 (20.1-20.3)" }
tower_s = { height = 30.1, tolerance = 1.0, source = "cap apex 28.6 (photos 03, 08, 10, 11) + finial 1.5" }
dome = { height = 33.3, tolerance = 1.5, source = "lantern cap ~32.4 + cross: photos 08, 15 ratios; hidden behind the pediment in photos 03, 11; PNOA lean suggests up to ~36" }

