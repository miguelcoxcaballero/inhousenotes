# Llotja de la Seda (Lonja de la Seda), Valencia. Pere Compte and Joan
# Iborra, 1482-1498 (hall and tower), Consolat de Mar 1498-1548. UNESCO 1996.
#
# Volumes (OSM building:parts, Catastro floors):
#   part:0  Sala de Contractacio (hall of columns), 1 tall storey
#   part:3  central tower (4 floors)
#   part:2  Consolat de Mar wing (3 floors + Renaissance gallery)
#   part:1  low annex on the street side of the orange-tree garden
#   the Pati dels Tarongers (garden) fills the notch between them, closed
#   by a crenellated wall on Carrer dels Cordellats.
# Heights measured on photo 11 (frontal, Placa del Mercat) scaled by the
# 22.95 m hall facade: hall cornice 15.4 m, merlon tops 18.4 m; tower
# cornice 24.4 m, merlon tops 27.6 m; Consolat gallery 13.2-18.0 m, merlon
# tops 20.2 m.

[landmark]
name = "Llotja de la Seda"
slug = "llotja_de_la_seda"
main_facade = 4
notes = "Valencian Gothic exchange: hall, tower, Consolat de Mar and garden, all crowned with the crown-topped merlons."

[landmark.info]
architect = "Pere Compte, Joan Iborra"
built = "1482-1548"
style = "Valencian Gothic"
heritage = "UNESCO World Heritage Site (1996), BIC"

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"
door_material = "doors"

[render]
sun = [215, 48]
street_distance = 32
paving = 70

