# Real Basilica de Nuestra Senora de los Desamparados (Valencia), Diego Martinez
# Ponce de Urrana 1652-1667. Generated by scratchpad bas/gen.py; every dimension
# has its source in sources.toml [facts].
#
# PLAN: OSM way 135630265 checked on the IGN PNOA orthophoto (roof lean ~0.12 m/m
# to the north corrected): an isolated, nearly rectangular block 35.6 m (west
# front on the Placa de la Mare de Deu) x 24 m (south, towards the cathedral),
# east front 29.4 m on the Placa de Decim Juni Brut / Almoina, north front
# 19 m, with the NE corner cut back by the neighbouring house. Elliptical drum
# 19.4 x 22.6 m (OSM part 387030403, long axis N-S), tiled dome 14 x 17.2 m,
# lantern r 1.95 m; camarin (1683-1694) with its small dome behind (north).
# The arched passage to the cathedral (x -2.7..-0.1, z 18.1..24.5) is modelled
# by catedral_de_valencia (element pasadizo_desemparats) and left out here.
#
# HEIGHTS: constrained camera solve (scratchpad bas/ba.py) on photos 02, 04, 10
# with EXIF focal lengths (02 Canon SX260 4.5 mm = 25 mm eq., 04 Canon A2500
# 5 mm = 28 mm eq.), people 1.75 m and eye height priors: plinth 1.4,
# architrave 11.9, cornice top 13.4, drum cornice 21.2, lantern base 28.3,
# lantern cornice 33.6, cap 35.3, cross ~37.5.

[landmark]
name = "Real Basilica de la Mare de Deu dels Desemparats"
slug = "basilica_dels_desemparats"
main_facade = "facing:w"
notes = "Baroque chapel-basilica (1652-1667) on the Placa de la Mare de Deu: an isolated pink-stuccoed block with cream giant pilasters, Godella stone portals and socle, a stone entablature with modillions, low tile roof, an elliptical brick drum with stone pilasters and pedimented windows, a blue-black glazed-tile dome and a brick lantern."

[landmark.info]
architect = "Diego Martinez Ponce de Urrana (camarin 1683-1694)"
built = "1652-1667"
style = "Baroque (Herrerian-classicist exterior)"
heritage = "BIC RI-51-0004498"
frame = "plan from OSM way 135630265; facade u from the left end seen from outside"

[defaults]
material = "stucco"
roof_material = "roof"
glass_material = "glass"
door_material = "doors"
