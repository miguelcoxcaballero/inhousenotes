# Sample: a Valencian Gothic church on an irregular plot between narrow
# streets. Synthetic, but built the way real landmarks should be: massing
# from the footprint, then roofs, tower and dome, then openings, then
# details. It exercises most element types of the spec language.

[landmark]
name = "Sample Gothic church"
slug = "gothic_church"
main_facade = "facing:w"
notes = "Nave with chapels between buttresses, polygonal apse, flying buttresses, bell tower turning octagonal, tiled dome, cloister loggia and a small plaza."

[landmark.info]
style = "Valencian Gothic (synthetic sample)"
period = "14th-15th c., dome 18th c."

[defaults]
material = "stone"
roof_material = "roof"
glass_material = "glass"

# ------------------------------------------------------------- materials

[material.stone]
kind = "ashlar"
tint = "#e4d5b6"
block = [0.95, 0.45]
weathering = 0.35

[material.stone_fine]
kind = "limestone"
tint = "#ece2cb"
weathering = 0.2

[material.roof]
kind = "roof_tiles"

[material.dome_tiles]
kind = "glazed_tiles"
pattern = "scales"
colors = ["#1f4f9c", "#f3efe4", "#2c62b0"]

[material.bronze]
kind = "bronze"

[material.plaza]
kind = "paving"
uv_scale = 2.4

[material.glass]
kind = "glass"

[material.water]
kind = "water"

# ------------------------------------------------------------ components

[component.pinnacle]
note = "Corner pinnacle, base at the origin."
[[component.pinnacle.children]]
type = "pinnacle"
width = 0.9
height = 5.5
crockets = 3
material = "stone_fine"

[component.aisle_buttress]
note = "Buttress on the aisle wall (frame: x along the wall, z outward)."
[[component.aisle_buttress.children]]
type = "buttress"
height = 10.5
width = 1.1
depth = 1.7
setoffs = 1
cap = "pinnacle"
plinth = true

# --------------------------------------------------------------- massing

[[element]]
type = "mass"
name = "nave"
polygon = [[-22, -7], [14, -7], [14, 7], [-22, 7]]
height = 19
cornice = { profile = "gothic", size = 0.7, edges = ["facing:n", "facing:s"], material = "stone_fine" }
string_courses = [11.2]

  # West portal: four recessed pointed orders with colonnettes and a hood.
  [[element.openings]]
  edges = "facing:w"
  kind = "portal"
  arch = "pointed"
  width = 3.0
  height = 6.4
  levels = [0.45]
  orders = 4
  order_step = 0.3
  colonnettes = true
  hood = { size = 0.18, gap = 0.08 }
  material = "stone_fine"

  # Rose window over the portal.
  [[element.openings]]
  edges = "facing:w"
  kind = "rose"
  width = 6.0
  levels = [9.8]
  depth = 0.7
  spokes = 12
  rings = 1
  hood = true
  material = "stone_fine"

  # Clerestory: two-light pointed windows with circle tracery.
  [[element.openings]]
  edges = ["facing:n", "facing:s"]
  kind = "window"
  arch = "pointed"
  width = 2.4
  height = 6.2
  levels = [11.8]
  bays = { spacing = 6.0, margin = 3.0 }
  infill = "stained"
  mullions = 1
  tracery = "circle"
  depth = 0.55
  hood = true
  material = "stone_fine"

[[element]]
type = "roof"
name = "nave_roof"
on = "nave"
shape = "gable"
pitch = 24
ridge = "long"
overhang = 0.35
  [[element.gable_openings]]
  edges = "facing:w"
  kind = "oculus"
  width = 1.5
  levels = [20.0]
  infill = "dark"

[[element]]
type = "mass"
name = "aisle_n"
polygon = [[-22, -11.5], [14, -11.5], [14, -7], [-22, -7]]
height = 10.5
mirror = "z"
plinth = { profile = "plinth", size = 0.7 }
crenellations = { shape = "rect", width = 0.7, gap = 0.55, height = 0.8, thickness = 0.45, wall = 0.6, edges = "facing:n" }
top_material = "plaza"

  [[element.openings]]
  edges = "facing:n"
  kind = "lancet"
  width = 1.4
  height = 4.6
  levels = [3.0]
  bays = { spacing = 6.0, margin = 3.0 }
  infill = "stained"
  hood = true
  material = "stone_fine"

[[element]]
type = "mass"
name = "apse"
polygon = [[14, -7], [18.95, -4.95], [21, 0], [18.95, 4.95], [14, 7]]
height = 19
cornice = { profile = "gothic", size = 0.7, edges = "not:facing:w", material = "stone_fine" }
roof = { shape = "hip", pitch = 24, overhang = 0.35 }

  [[element.openings]]
  edges = "not:facing:w"
  kind = "lancet"
  width = 1.5
  height = 8.0
  levels = [6.5]
  bays = 1
  infill = "stained"
  hood = true
  material = "stone_fine"

[[element]]
type = "mass"
name = "sacristy"
polygon = [[8, -15], [14, -15], [14, -11.5], [8, -11.5]]
height = 7
plinth = true

[[element]]
type = "parapet"
on = "sacristy"
edges = ["facing:n", "facing:e"]
height = 0.9
thickness = 0.3

[[element]]
type = "moulding"
on = "sacristy"
edges = ["facing:n", "facing:e"]
y = 5.0
profile = "cyma"
size = 0.35

[[element]]
type = "openings"
on = "sacristy"
edges = "facing:n"
kind = "door"
arch = "segmental"
width = 1.2
height = 2.6
surround = { width = 0.2, projection = 0.08, ears = true }

# Buttresses between the chapels, with pinnacles (both aisles via mirror).
[[element]]
type = "array"
mode = "edges"
polygon = [[-22, -11.5], [14, -11.5], [14, -7], [-22, -7]]
edges = "facing:n"
spacing = 6.0
margin = 0.0
component = "aisle_buttress"
mirror = "z"

# Flying buttresses from the aisle buttresses up to the clerestory.
[[element]]
type = "array"
mode = "linear"
count = 7
step = [6.0, 0.0, 0.0]
mirror = "z"
  [[element.children]]
  type = "flying_buttress"
  from = [-22.0, 11.0, -12.4]
  to = [-22.0, 17.2, -7.0]
  width = 0.75
  thickness = 0.75
  sag = 0.3
  pinnacle = { width = 0.8, height = 4.2 }

[[element]]
type = "gargoyles"
on = "nave"
edges = ["facing:n", "facing:s"]
y = 18.2
spacing = 6.0
corners = false

# Facade corner pinnacles and buttress-pilasters flanking the portal.
[[element]]
type = "array"
mode = "points"
points = [[-22.3, 19.0, -6.7], [-22.3, 19.0, 6.7], [-22.3, 10.5, -11.2], [-22.3, 10.5, 11.2]]
component = "pinnacle"

[[element]]
type = "pilaster"
at = [-22.0, 0.45, -3.6]
facing = "w"
height = 8.0
width = 0.7
depth = 0.35
order = "gothic"
mirror = "z"
material = "stone_fine"

# Stone cross on the west gable.
[[element]]
type = "extrude"
profile = [[-0.12, 0], [0.12, 0], [0.12, 0.9], [0.45, 0.9], [0.45, 1.15], [0.12, 1.15], [0.12, 1.6], [-0.12, 1.6], [-0.12, 1.15], [-0.45, 1.15], [-0.45, 0.9], [-0.12, 0.9]]
plane = "zy"
origin = [-22.3, 21.9, 0.0]
length = 0.25
material = "stone_fine"

# ----------------------------------------------------------------- tower

[[element]]
type = "tower"
name = "bell_tower"
polygon = { shape = "square", center = [-22, -15.5], width = 8 }
material = "stone"

  [[element.stages]]
  name = "tower_base"
  height = 17
  string_courses = [9.0]
  plinth = { size = 0.8 }
    [[element.stages.openings]]
    kind = "slit"
    width = 0.2
    height = 1.6
    levels = [5.0, 11.5]
    bays = 1

  [[element.stages]]
  name = "tower_mid"
  height = 10
  inset = 0.25
  cornice = { profile = "gothic", size = 0.45 }
    [[element.stages.openings]]
    kind = "twin"
    arch = "pointed"
    width = 2.0
    height = 3.4
    levels = [20.5]
    bays = 1
    hood = true

  [[element.stages]]
  name = "belfry"
  height = 9
  inset = 0.2
  belfry = true
  cornice = { profile = "gothic", size = 0.5 }
  pinnacles = { width = 0.7, height = 3.6 }

  [[element.stages]]
  name = "tower_oct"
  height = 4.0
  polygon = { shape = "octagon", width = 6.6 }
  crenellations = { shape = "rect", width = 0.6, gap = 0.5, height = 0.8, wall = 0.4 }

  [[element.top]]
  type = "roof"
  polygon = { ref = "parent", inset = 0.8 }
  shape = "spire"
  height = 8.5
  ribs = { count = 8, width = 0.18, depth = 0.12 }
  material = "stone_fine"

  [[element.top]]
  type = "finial"
  at = [0.0, 8.2, 0.0]
  style = "cross"
  size = 1.8
  material = "iron"

[[element]]
type = "machicolations"
on = "tower_oct"
y = 39.5
projection = 0.45
spacing = 1.0
corbel_height = 0.9
parapet = 0.0

# ------------------------------------------------------------------ dome

[[element]]
type = "dome"
name = "dome"
center = [7.0, 0.0]
y = 17.8
radius = 4.4
profile = "pointed"
height = 5.4
material = "dome_tiles"
drum_material = "stone"
ribs = { count = 8, width = 0.32, depth = 0.14, material = "stone_fine" }
drum = { height = 4.8, sides = 8, windows = 8, window_width = 1.0, window_height = 2.3, window_arch = "round", pilasters = true }
  [[element.lantern]]
  type = "lantern"
  radius = 0.85
  height = 2.0
  sides = 8
  cap = "dome"
  cap_material = "dome_tiles"
  material = "stone_fine"
  finial = "cross"

# ---------------------------------------------------------------- loggia

[[element]]
type = "arcade"
name = "loggia"
from = [-18.0, 17.6]
to = [10.0, 17.6]
face = "left"
bays = 7
arch = "pointed"
impost = 3.0
height = 7.2
depth = 0.8
gallery = 3.0
column = { order = "gothic", radius = 0.26, double = true }
hood = { size = 0.12 }
cornice = { profile = "gothic", size = 0.45 }

[[element]]
type = "balustrade"
polygon = [[-18.4, 13.4], [10.4, 13.4], [10.4, 18.0], [-18.4, 18.0]]
edges = "facing:s"
y = 7.2
height = 0.9
finials = "ball"
material = "stone_fine"

# ----------------------------------------------------------------- plaza

[[element]]
type = "stairs"
polygon = { shape = "rect", center = [-24.2, 0.0], size = [4.4, 9.0] }
y = 0.0
steps = 3
riser = 0.15
tread = 0.42
material = "stone_fine"

[[element]]
type = "sweep"
profile = { shape = "circle", radius = 0.03 }
path = { points = [[-27.0, 0.95, -4.8], [-25.6, 0.95, -4.8], [-22.4, 1.4, -4.8]] }
material = "iron"
mirror = "z"

[[element]]
type = "slab"
polygon = [[-58, -18], [-26, -20], [-24, 16], [-56, 22]]
y = 0.03
thickness = 0.03
material = "plaza"

[[element]]
type = "wall"
name = "churchyard_wall"
path = [[-50, -16.5], [-30, -17.5]]
height = 2.8
thickness = 0.6
coping = true
  [[element.openings]]
  kind = "arch"
  arch = "round"
  width = 2.4
  height = 2.6
  bays = 1
  infill = "void"
  hood = true

# Monument: a column carrying a statue.
[[element]]
type = "column"
at = [-40.0, 0.0, -9.0]
height = 9.0
radius = 0.42
order = "corinthian"
flutes = 20
pedestal = 1.8

[[element]]
type = "statue"
at = [-40.0, 9.0, -9.0]
facing = "e"
height = 2.2
style = "figure"
material = "bronze"

[[element]]
type = "statue"
at = [-36.0, 0.0, 8.0]
facing = "e"
height = 2.0
style = "equestrian"
pedestal = { height = 2.2, width = 2.4, material = "stone_fine" }
material = "bronze"

# Fountain: a group of generic primitives.
[[element]]
type = "group"
name = "fountain"
transform = { translate = [-44.0, 0.0, 2.0] }
material = "stone_fine"
  [[element.children]]
  type = "lathe"
  profile = [[0.0, 0.0], [3.0, 0.0], [3.1, 0.15], [3.1, 0.55], [2.9, 0.62], [2.8, 0.25], [0.0, 0.25]]
  segments = 48
  [[element.children]]
  type = "torus"
  center = [0.0, 0.6, 0.0]
  radius = 3.0
  tube = 0.12
  [[element.children]]
  type = "cylinder"
  at = [0.0, 0.0, 0.0]
  height = 0.02
  radius = 2.82
  material = "water"
  caps = true
  transform = { translate = [0.0, 0.48, 0.0] }
  [[element.children]]
  type = "cylinder"
  at = [0.0, 0.25, 0.0]
  height = 2.2
  radius = 0.25
  radius_top = 0.16
  [[element.children]]
  type = "cone"
  at = [0.0, 2.45, 0.0]
  height = 0.5
  radius = 0.7
  [[element.children]]
  type = "sphere"
  center = [0.0, 3.1, 0.0]
  radius = 0.22
  [[element.children]]
  type = "array"
  mode = "radial"
  count = 8
  radius = 4.2
    [[element.children.children]]
    type = "box"
    size = [0.5, 0.8, 0.5]
    center = [0.0, 0.4, 0.0]

[[element]]
type = "instance"
component = "pinnacle"
at = [-26.0, 0.0, -19.5]
enabled = false
note = "Disabled example: instances can be switched off while iterating."

# ----------------------------------------------------------------- views
# Views without a photo render photo_<n>.png only (close-ups for review).

[[view]]
name = "portal"
eye = [-37.0, 1.7, 3.0]
target = [-22.0, 6.5, 0.0]
fov_y = 50

[[view]]
name = "dome"
eye = [-4.0, 31.0, -24.0]
target = [7.0, 24.0, 0.0]
fov_y = 38

[[view]]
name = "loggia"
eye = [-26.0, 1.7, 30.0]
target = [-6.0, 4.5, 16.0]
fov_y = 55

[[view]]
name = "tower top"
eye = [-44.0, 34.0, -38.0]
target = [-22.0, 41.0, -15.5]
fov_y = 34

# A matched photo view. The "photo" here is a synthetic render taken at
# another time of day; for real landmarks it is a file listed in
# sources.toml. compare_<n>.jpg shows [photo | render | model edges].
[[view]]
name = "west square"
photo = "photos/west_synthetic.jpg"
eye = [-52.0, 1.7, -6.0]
target = [-22.0, 12.0, 0.0]
focal_35mm = 28
sun = [200, 58]
