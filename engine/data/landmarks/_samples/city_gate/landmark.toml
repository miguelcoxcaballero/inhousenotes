# Sample: a Valencian city gate in the manner of the Torres de Quart.
#
# Two D-shaped towers, round towards the field (west) and open towards the
# city (east), flank a gate block crossed by a pointed vaulted passage.
# Shows: `open_edges` shells (towers open at the back, floors visible),
# openings placed by compass azimuth on round walls, a `passage` cut
# through a mass, arcuated machicolations with merlons, polygon `union`
# and `subtract`, and a `[[view]]` solved from point matches. Synthetic.

[landmark]
name = "Sample city gate"
main_facade = "facing:w"
notes = "Synthetic sample in the manner of the Torres de Quart (1441-1460)."

[defaults]
material = "stone"

[render]
sun = [235, 38]

[material.stone]
kind = "ashlar"
tint = "#d8c6a6"
block = [0.9, 0.5]
weathering = 0.45
seed = 11

[material.rubble]
kind = "ashlar"
tint = "#c9b594"
block = [0.55, 0.32]
weathering = 0.5
seed = 5

[material.timber]
kind = "wood"
tint = "#5b4330"

# ----------------------------------------------------------- the towers

# Battered base around both towers and the gate (union of the three OSM
# parts, grown 0.4 m), with the passage cut out of it (subtract).
[[element]]
type = "mass"
name = "talus"
polygon = { ref = "part:0", union = ["part:1", "part:2"], offset = 0.4, subtract = [[[-3, -2.9], [9, -2.9], [9, 2.9], [-3, 2.9]]] }
height = 2.2
batter = 0.4
top = false
material = "rubble"

# Each tower: a shell 2.4 m thick, open on its city (east) side.
[[element]]
type = "mass"
name = "north_tower"
polygon = "part:0"
height = 26.5
open_edges = "facing:e"
wall_thickness = 2.4
smooth = true
string_courses = [9.5, 18.5]
note = "The D plan is one run: the semicircle (11 facets) and its flanks."

  # Arrow slits where the round wall faces south-west, west and north-west.
  [[element.openings]]
  edges = "not:facing:e"
  kind = "slit"
  width = 0.22
  height = 1.7
  levels = [5.0, 13.5, 22.0]
  bays = { azimuth = [235, 270, 305] }
  depth = 1.6

[[element]]
type = "mass"
name = "south_tower"
polygon = "part:1"
height = 26.5
open_edges = "facing:e"
wall_thickness = 2.4
smooth = true
string_courses = [9.5, 18.5]

  [[element.openings]]
  edges = "not:facing:e"
  kind = "slit"
  width = 0.22
  height = 1.7
  levels = [5.0, 13.5, 22.0]
  bays = { azimuth = [235, 270, 305] }
  depth = 1.6

# Timber floors inside the open towers.
[[element]]
type = "array"
mode = "linear"
count = 2
step = [0, 9, 0]
  [[element.children]]
  type = "slab"
  polygon = { ref = "part:0", inset = 2.4 }
  y = 9.5
  thickness = 0.35
  material = "timber"
  [[element.children]]
  type = "slab"
  polygon = { ref = "part:1", inset = 2.4 }
  y = 9.5
  thickness = 0.35
  material = "timber"

# Machicolations: corbels with pointed arches round the field side, a
# parapet on top and merlons on the parapet.
[[element]]
type = "machicolations"
polygon = "part:0"
edges = "not:facing:e"
y = 26.5
merlons = { shape = "rect", width = 1.1, gap = 0.7, height = 1.3, thickness = 0.55 }

[[element]]
type = "machicolations"
polygon = "part:1"
edges = "not:facing:e"
y = 26.5
merlons = { shape = "rect", width = 1.1, gap = 0.7, height = 1.3, thickness = 0.55 }

# -------------------------------------------------------------- the gate

[[element]]
type = "mass"
name = "gate"
polygon = "part:2"
height = 21.0
string_courses = [13.0]

  # The gate passage: through the whole block, west to east.
  [[element.openings]]
  edges = "facing:w"
  kind = "passage"
  arch = "pointed"
  width = 5.4
  height = 11.0
  bays = 1
  voussoirs = { count = 21, width = 0.75, projection = 0.04 }
  hood = { size = 0.22, gap = 0.08 }

  # A window over the gate on the field side.
  [[element.openings]]
  edges = "facing:w"
  kind = "twin"
  arch = "pointed"
  width = 2.2
  height = 3.2
  levels = [14.6]
  bays = 1

[[element]]
type = "machicolations"
polygon = "part:2"
edges = "facing:w"
y = 21.0
merlons = { shape = "rect", width = 1.1, gap = 0.7, height = 1.3, thickness = 0.55 }

# A view aligned from point matches (pixel [u, v] from the top-left of the
# photo, landmark-local world point). `check` and `render` solve the
# camera and print it; eye/target below are only a rough start.
[[view]]
name = "field side"
photo = "photos/field_synthetic.jpg"
eye = [-40.0, 1.6, 10.0]
target = [0.0, 12.0, 0.0]
fov_y = 50
