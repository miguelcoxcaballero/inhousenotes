# Test content for the sandbox, fetched with `cargo run -p forja_fetch -- fetch --all`.
#
# Every entry is openly licensed. CC0 needs no attribution; CC-BY and ODbL
# entries are listed in the generated assets/downloaded/ATTRIBUTION.md, which
# must ship with any build that includes them.
#
# Source kinds (exactly one per entry):
#   zip        = archive URL; `include` keeps paths with these prefixes and
#                `strip` removes a prefix when extracting. `page` is scraped for
#                a fresh link if the archive URL ever changes (Kenney).
#   files      = list of { url, path } single files.
#   polyhaven  = { id, res, format } through the Poly Haven API.
#   osm        = { bbox = [min_lon, min_lat, max_lon, max_lat] } real map data.
#   terrarium  = { z, x, y, tiles } elevation tiles (tiles x tiles grid).
#   manual     = { url, note } the user downloads it; `forja_fetch import`.
#
# SHA-256 hashes are pinned in assets.lock.toml on first download and
# verified afterwards.

# --------------------------------------------------------------------- maps

[[asset]]
id = "map_miami_beach_osm"
name = "Miami Beach (South Beach) from OpenStreetMap"
kind = "map"
license = "ODbL-1.0"
author = "OpenStreetMap contributors"
homepage = "https://www.openstreetmap.org/copyright"
osm = { bbox = [-80.1400, 25.7740, -80.1290, 25.7880] }

[[asset]]
id = "map_hollywood_hills_terrain"
name = "Hollywood Hills elevation (2x2 tiles, ~16 km)"
kind = "terrain"
license = "Terrain Tiles (SRTM/USGS, attribution)"
author = "Mapzen / Tilezen joerd (SRTM, USGS NED, ETOPO1)"
homepage = "https://github.com/tilezen/joerd/blob/master/docs/attribution.md"
terrarium = { z = 12, x = 701, y = 1634, tiles = 2 }

