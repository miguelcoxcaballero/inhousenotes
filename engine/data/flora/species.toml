# Forja procedural tree species (forja_flora).
#
# Each [[species]] picks a growth model:
#   model = "parametric"    Weber-Penn style levels ([[species.levels]] = branch
#                           orders 1, 2, 3 ...; level 1 grows on the trunk)
#   model = "colonization"  space colonization of the crown envelope from the
#                           trunk, then the LAST level as parametric twigs
#   kind = "palm"           trunk + [species.palm] fronds
# Angles in degrees, lengths in metres, colours sRGB "#rrggbb".
# Level fields: count (children per parent), start/end (where on the parent),
# length (ratio of the parent; level 1: of the tree height, times the crown
# `shape` ratio), down/down_end (angle from the parent axis at its base/tip),
# rotate (azimuth step; negative = alternate sides), curve/curve_var (bend
# toward +Y / random wiggle), gravity (tropism: + up, - droop), segments.
# `photos` are Wikimedia Commons reference files used by `treegen compare`.

