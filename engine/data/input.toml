# Key names follow winit's KeyCode debug names; mouse buttons are
# MouseLeft / MouseRight / MouseMiddle.
mouse_sensitivity = 0.0025

[actions]
forward = ["KeyW", "ArrowUp"]
back = ["KeyS", "ArrowDown"]
left = ["KeyA", "ArrowLeft"]
right = ["KeyD", "ArrowRight"]
sprint = ["ShiftLeft"]
jump = ["Space"]
handbrake = ["Space"]
enter_vehicle = ["KeyF"]
fire = ["MouseLeft"]
aim = ["MouseRight"]
reload = ["KeyR"]
inventory = ["Tab"]
use_item = ["KeyE"]
holster = ["KeyH"]
weapon_melee = ["Digit1"]
weapon_pistol = ["Digit2"]
weapon_smg = ["Digit3"]
weapon_shotgun = ["Digit4"]
weapon_rifle = ["Digit5"]
weapon_sniper = ["Digit6"]
camera = ["KeyV"]
debug_physics = ["F1"]
screenshot = ["F12"]
next_map = ["F2"]
time_of_day = ["F3"]
quit = ["Escape"]
