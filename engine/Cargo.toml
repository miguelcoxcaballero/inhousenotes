[workspace]
resolver = "2"
members = [
    "crates/forja_math",
    "crates/forja_core",
    "crates/forja_physics",
    "crates/forja_assets",
    "crates/forja_anim",
    "crates/forja_city",
    "crates/forja_world",
    "crates/forja_render",
    "crates/forja_input",
    "crates/forja_gameplay",
    "tools/forja_fetch",
    "apps/sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
forja_math = { path = "crates/forja_math" }
forja_core = { path = "crates/forja_core" }
forja_physics = { path = "crates/forja_physics" }
forja_assets = { path = "crates/forja_assets" }
forja_anim = { path = "crates/forja_anim" }
forja_city = { path = "crates/forja_city" }
forja_world = { path = "crates/forja_world" }
forja_render = { path = "crates/forja_render" }
forja_input = { path = "crates/forja_input" }
forja_gameplay = { path = "crates/forja_gameplay" }

glam = { version = "0.30", features = ["bytemuck", "serde"] }
hecs = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
bytemuck = { version = "1.23", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "extras", "extensions", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_texture_transform", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_volume", "KHR_materials_specular", "KHR_lights_punctual"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "tga"] }
flate2 = "1"
meshopt = "0.7"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["links", "wayland", "x11"] }
quick-xml = "0.38"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = { version = "3", features = ["platform-verifier", "json"] }
serde_json = "1"
i_overlay = "=9.1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
