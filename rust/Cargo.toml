# Inhouse Notes 6 — cargo workspace (ARCHITECTURE §2). No external crates, ever (§2.4).
[workspace]
resolver = "2"
members = ["crates/ihn-core", "crates/ihn-sync", "crates/ihn-app", "crates/ihn-wasm"]

[workspace.package]
version = "6.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# W6.2s: the UI/glue crate (dialogs, panels, migration, Drive flows, test API) is built for size; the hot crates
# (ihn-core: document, render, maths; ihn-sync: wire, apply) keep "s", so their code and speed are unchanged. With
# fat LTO the per-package level is carried by each function's attributes (measured: -140 KB raw, -48 KB gzip).
[profile.release.package.ihn-app]
opt-level = "z"
