name: Production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install release test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit and release checks
        run: npm run test:unit

      - name: Run browser and chaos checks
        run: npm run test:e2e

      - name: Install typed rebuild dependencies
        working-directory: rebuild-v2
        run: npm ci

      - name: Test typed rebuild
        working-directory: rebuild-v2
        run: npm test

      - name: Build typed rebuild
        working-directory: rebuild-v2
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
