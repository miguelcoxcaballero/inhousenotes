name: Production checks

# Inhouse Notes 6 (docs/v6/ARCHITECTURE.md §14.2):
#   checks  — every pull request and every push to v6 or main: cargo tests, a reproducible build from two paths,
#             browser smoke tests and the quick pixel-parity run.
#   full    — nightly on v6 and on the release pull request to main: the full parity matrix against 5.19.0 and
#             the performance report.
#   release — the release pull request to main only: the committed generated files equal a clean rebuild.
on:
  pull_request:
  push:
    branches: [main, v6]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Include pixel parity and performance alongside browser checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && !inputs.full_matrix && 'browser' || 'all' }}
  # Let the running full suite finish while frequent releases queue the newest head.
  cancel-in-progress: false

env:
  V5_COMMIT: 35d0f22 # 5.19.0, the parity reference

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 14b-sw-upgrade and the parity harness serve 5.19.0 from history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install the Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown

      - name: Run cargo tests
        run: npm run test:cargo

      - name: Run shell CSS checks
        run: npm run test:shell

      - name: Build
        run: npm run build

      - name: Verify the committed generated files equal the build (main)
        if: github.ref == 'refs/heads/main'
        run: |
          # On main the generated files are committed (ARCHITECTURE §14.2/§14.3): the deployed site must be this build.
          for file in wasm/ihn.wasm wasm/ihn-2.wasm offline-assets.js native-assets.json index.html; do
            git ls-files --error-unmatch "$file" >/dev/null
            cmp "build/$file" "$file"
          done

      - name: Verify the build is reproducible from another path
        run: |
          git worktree add --detach "$RUNNER_TEMP/ihn-second-path/checkout" HEAD
          # The same pinned devDependencies (binaryen's wasm-opt): under CI the build fails without them.
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/ihn-second-path/checkout/node_modules"
          (cd "$RUNNER_TEMP/ihn-second-path/checkout" && npm run build)
          (cd build && find . -type f | sort | xargs sha256sum) > "$RUNNER_TEMP/first.sha256"
          (cd "$RUNNER_TEMP/ihn-second-path/checkout/build" && find . -type f | sort | xargs sha256sum) > "$RUNNER_TEMP/second.sha256"
          cat "$RUNNER_TEMP/first.sha256"
          diff "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"
          git worktree remove --force "$RUNNER_TEMP/ihn-second-path/checkout"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Run quick pixel parity against 5.19.0
        if: github.event_name != 'workflow_dispatch' || inputs.full_matrix
        run: |
          # A = the 5.19.0 tree served next to this one (B = this checkout with build/ over it).
          git worktree add --detach "$RUNNER_TEMP/ihn-5.19.0" "$V5_COMMIT"
          npm run test:parity -- --quick --a-root "$RUNNER_TEMP/ihn-5.19.0"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report
            test-results
            test-results/parity-report
          if-no-files-found: ignore

  full:
    outputs:
      states: ${{ steps.states.outputs.names }}
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v6' || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Build
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          npm run test:cargo
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare full matrix
        id: states
        run: |
          git worktree add --detach "$RUNNER_TEMP/ihn-5.19.0" "$V5_COMMIT"
          node -e 'console.log("names=" + JSON.stringify(require("node:fs").readdirSync("tests/v6/parity/states").filter(x => x.endsWith(".mjs")).sort()))' >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: parity-build
          path: build/
          retention-days: 1

      - name: Run the performance check
        run: |
          # Same phases, document and Drive mock for both apps (TESTING §6); report only.
          mkdir -p test-results/perf
          npm run perf -- --app v5 --root "$RUNNER_TEMP/ihn-5.19.0" --short --out test-results/perf/v5.json
          npm run perf -- --app v6 --overlay build --short --out test-results/perf/v6.json

      - name: Upload parity and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-and-performance
          path: |
            test-results/parity-report
            test-results/perf
          if-no-files-found: ignore

  parity:
    needs: full
    if: ${{ !cancelled() && needs.full.outputs.states != '' }}
    strategy:
      fail-fast: false
      matrix:
        state: ${{ fromJSON(needs.full.outputs.states) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v6' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: parity-build
          path: build
      - run: npx playwright install --with-deps chromium
      - name: Compare every cell for this state file
        env:
          STATE: ${{ matrix.state }}
        run: npm run test:parity -- --states "$STATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.state }}
          path: |
            test-results/parity-report/REPORT.md
            test-results/parity-report/results.json
          if-no-files-found: error

  release:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the committed generated files equal a clean rebuild
        run: |
          npm ci
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          npm run build
          # The release pull request commits build/ over the tree (ARCHITECTURE §14.3); it must be byte-identical.
          cp -R build/. .
          # Three of them are ignored on v6 (.gitignore): an untracked file would pass `git diff`, and the site
          # would be published without it.
          git ls-files --error-unmatch wasm/ihn.wasm wasm/ihn-2.wasm offline-assets.js native-assets.json index.html vendor/fonts/ui.css
          git diff --exit-code -- wasm/ihn.wasm wasm/ihn-2.wasm offline-assets.js native-assets.json index.html vendor/fonts/ui.css
