name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages accepts one production deployment at a time. Keep later releases in
# this queue instead of cancelling a deployment that GitHub has already made.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare lean production site
        shell: bash
        run: |
          set -euo pipefail
          site_dir="$RUNNER_TEMP/pages-site"
          mkdir -p "$site_dir"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gh-config/' \
            --exclude 'android app/' \
            --exclude 'docs/' \
            --exclude 'node_modules/' \
            --exclude 'rebuild-v2/' \
            --exclude 'test-results/' \
            --exclude 'tests/' \
            --exclude 'tmp/' \
            --exclude '*.apk' \
            --exclude 'gh-*.tmp' \
            --exclude 'AGENTS.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'playwright.config.mjs' \
            --exclude 'README.md' \
            --exclude 'RELEASE_NOTES_*.md' \
            ./ "$site_dir/"
          test -f "$site_dir/index.html"
          test -f "$site_dir/CNAME"
          test -f "$site_dir/app-v5.js"
          test -f "$site_dir/scanner/script.js"
          echo "Production artifact: $(find "$site_dir" -type f | wc -l) files, $(du -sh "$site_dir" | cut -f1)"

      - name: Upload static site
        id: pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        timeout-minutes: 6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const buildVersion = context.sha;
            const artifactId = Number('${{ steps.pages-artifact.outputs.artifact_id }}');
            const finalFailures = new Set([
              'deployment_failed',
              'deployment_content_failed',
              'deployment_cancelled',
              'deployment_lost'
            ]);
            const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error(`Invalid Pages artifact id: ${artifactId}`);
            }

            const readStatus = async deploymentId => {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                { owner, repo, deployment_id: deploymentId }
              );
              return response.data;
            };

            let deploymentId = buildVersion;

            // Pages can leave a cancelled attempt looking active. A queued
            // workflow re-run must retire that stale attempt before uploading
            // a fresh artifact instead of attaching to the orphaned record.
            try {
              const existing = await readStatus(deploymentId);
              if (existing.status === 'succeed') {
                core.info('This commit is already deployed.');
                core.setOutput('page_url', existing.page_url || 'https://inhousenotes.com/');
                return;
              }
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
                { owner, repo, deployment_id: deploymentId }
              );
              core.info(`Retired stale Pages deployment ${deploymentId} (${existing.status}).`);
              await sleep(2_000);
            } catch (error) {
              if (error.status !== 404 && error.status !== 409) {
                core.warning(`Could not retire an earlier deployment: ${error.message}`);
              }
            }

            const oidcToken = await core.getIDToken();
            const response = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner,
                repo,
                artifact_id: artifactId,
                pages_build_version: buildVersion,
                oidc_token: oidcToken
              }
            );
            let deployment = response.data;
            deploymentId = deployment.id || deployment.status_url?.split('/').pop() || buildVersion;
            core.setOutput('page_url', deployment.page_url || 'https://inhousenotes.com/');
            core.info(`Created fresh Pages deployment ${deploymentId}.`);

            // A healthy Pages deployment normally completes quickly. Bound a
            // broken backend attempt instead of hiding it behind a long wait.
            const deadline = Date.now() + 5 * 60 * 1000;
            let consecutiveErrors = 0;
            while (Date.now() < deadline) {
              await sleep(10_000);
              try {
                deployment = await readStatus(deploymentId);
                consecutiveErrors = 0;
                core.info(`Pages status: ${deployment.status}`);

                if (deployment.status === 'succeed') {
                  core.setOutput('page_url', deployment.page_url || 'https://inhousenotes.com/');
                  core.info('GitHub Pages deployment succeeded.');
                  return;
                }
                if (finalFailures.has(deployment.status)) {
                  throw new Error(`GitHub Pages finished with ${deployment.status}.`);
                }
              } catch (error) {
                if (finalFailures.has(deployment?.status)) throw error;
                consecutiveErrors += 1;
                core.warning(`Pages status check ${consecutiveErrors} failed: ${error.message}`);
                if (consecutiveErrors >= 20) {
                  throw new Error('GitHub Pages status API failed 20 consecutive times.');
                }
              }
            }

            throw new Error(
              'GitHub Pages is still processing after 5 minutes; the deployment was left active and was not cancelled.'
            );
