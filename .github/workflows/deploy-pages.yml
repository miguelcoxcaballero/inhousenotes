name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Pages accepts one production deployment at a time. Keep later releases in
# this queue instead of cancelling a deployment that GitHub has already made.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare lean production site
        shell: bash
        run: |
          set -euo pipefail
          site_dir="$RUNNER_TEMP/pages-site"
          mkdir -p "$site_dir"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gh-config/' \
            --exclude 'android app/' \
            --exclude 'docs/' \
            --exclude 'node_modules/' \
            --exclude 'rebuild-v2/' \
            --exclude 'test-results/' \
            --exclude 'tests/' \
            --exclude 'tmp/' \
            --exclude '*.apk' \
            --exclude 'gh-*.tmp' \
            --exclude 'AGENTS.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'playwright.config.mjs' \
            --exclude 'README.md' \
            --exclude 'RELEASE_NOTES_*.md' \
            ./ "$site_dir/"
          touch "$site_dir/.nojekyll"
          test -f "$site_dir/index.html"
          test -f "$site_dir/CNAME"
          test -f "$site_dir/app-v5.js"
          test -f "$site_dir/scanner/script.js"
          echo "Production artifact: $(find "$site_dir" -type f | wc -l) files, $(du -sh "$site_dir" | cut -f1)"

      # Publishes straight to the gh-pages branch, which GitHub Pages is
      # configured (Settings -> Pages -> Source) to serve directly. This
      # replaced the Actions "workflow" deployment API (configure-pages /
      # upload-pages-artifact / pages deployments) after that API started
      # repeatedly timing out ("still processing after 5 minutes") and
      # taking the live site down with it. A plain branch push has no
      # server-side processing step to hang on.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/pages-site
          publish_branch: gh-pages
          force_orphan: true
