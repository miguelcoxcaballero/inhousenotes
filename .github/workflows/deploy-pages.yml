name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Pages accepts one production deployment at a time. Keep later releases in
# this queue instead of cancelling a deployment that GitHub has already made.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check that the committed generated files describe the committed bytes
        run: |
          # native-assets.json, the index.html native map and offline-assets.js are generated by `npm run build`
          # (ARCHITECTURE §14.1); a stale one would break the Android local assets and the service worker shell.
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('.')
          assets = json.loads((root / 'native-assets.json').read_text())['assets']
          html = (root / 'index.html').read_text()
          native_map = json.loads(re.search(r'id="inhouse-native-assets">(.*?)</script>', html, re.S)[1])
          for path, info in assets.items():
              data = (root / path.lstrip('/')).read_bytes()
              assert len(data) == info['size'] and hashlib.sha256(data).hexdigest() == info['sha256'], f'stale native-assets.json: {path}'
              assert native_map.get(path) == info['sha256'], f'stale index.html native map: {path}'
          shell = json.loads(re.search(r'=(\[.*\])', (root / 'offline-assets.js').read_text(), re.S)[1])
          missing = [path for path in shell if not (root / path.lstrip('/')).is_file()]
          assert not missing, f'offline-assets.js lists missing files: {missing}'
          print(f'Generated files verified: {len(assets)} native assets, {len(shell)} shell entries')
          PY

      - name: Prepare lean production site
        shell: bash
        run: |
          set -euo pipefail
          site_dir="$RUNNER_TEMP/pages-site"
          mkdir -p "$site_dir"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gh-config/' \
            --exclude 'android app/' \
            --exclude 'docs/' \
            --exclude 'node_modules/' \
            --exclude 'build/' \
            --exclude 'rust/' \
            --exclude 'rust-toolchain.toml' \
            --exclude 'wasm/ihn-test.wasm' \
            --exclude 'scripts/' \
            --exclude 'test-results/' \
            --exclude 'tests/' \
            --exclude 'tmp/' \
            --exclude '*.apk' \
            --exclude 'gh-*.tmp' \
            --exclude 'AGENTS.md' \
            --exclude '.claude/' \
            --exclude 'CLAUDE.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'playwright.config.mjs' \
            --exclude 'README.md' \
            --exclude 'RELEASE_NOTES_*.md' \
            ./ "$site_dir/"
          touch "$site_dir/.nojekyll"
          # Inhouse Notes 6 (docs/v6/ARCHITECTURE.md §14.2): the shell and the generated files committed by the release.
          for file in index.html CNAME boot.js host/main.js wasm/ihn.wasm service-worker.js offline-assets.js native-assets.json; do
            test -f "$site_dir/$file"
          done
          # 6.1.1: the 5.x runtime is no longer deployed (ARCHITECTURE §10.4).
          if ls "$site_dir"/*-v5.js >/dev/null 2>&1; then echo "5.x runtime files must not be deployed"; exit 1; fi
          grep -q "const APP_VERSION = '" "$site_dir/index.html"
          if grep -q 'native=__NATIVE__' "$site_dir/index.html"; then echo "index.html is not the generated build (npm run build)"; exit 1; fi
          echo "Production artifact: $(find "$site_dir" -type f | wc -l) files, $(du -sh "$site_dir" | cut -f1)"

      # Publishes straight to the gh-pages branch, which GitHub Pages is
      # configured (Settings -> Pages -> Source) to serve directly. This
      # replaced the Actions "workflow" deployment API (configure-pages /
      # upload-pages-artifact / pages deployments) after that API started
      # repeatedly timing out ("still processing after 5 minutes") and
      # taking the live site down with it. A plain branch push has no
      # server-side processing step to hang on.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/pages-site
          publish_branch: gh-pages
          force_orphan: true

      - name: Verify uncached public version and release files
        run: python3 .github/scripts/verify_live_release.py
