name: Build and publish signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --disable-pip-version-check pillow

      - name: Verify Android refresh policy and generated activity
        run: python -m unittest discover -s tests -p 'test_android_refresh_rate.py'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INHOUSE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inhousenotes-release.jks"

      - name: Build signed APK
        env:
          INHOUSE_KEYSTORE_PATH: ${{ runner.temp }}/inhousenotes-release.jks
          INHOUSE_KEYSTORE_PASSWORD: ${{ secrets.INHOUSE_ANDROID_KEYSTORE_PASSWORD }}
          INHOUSE_KEY_ALIAS: ${{ secrets.INHOUSE_ANDROID_KEY_ALIAS }}
        run: python .github/scripts/build_android_apk.py

      - name: Verify APK exists
        run: |
          test -s inhouse-notes-release-v1.0.28.apk
          ls -lh inhouse-notes-release-v1.0.28.apk

      - name: Verify signed APK and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download android-v1.0.27 --pattern inhouse-notes-release-v1.0.27.apk --dir "$RUNNER_TEMP/previous-apk"
          python .github/scripts/verify_release_apk.py inhouse-notes-release-v1.0.28.apk "$RUNNER_TEMP/previous-apk/inhouse-notes-release-v1.0.27.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: inhouse-notes-android-v1.0.28
          path: inhouse-notes-release-v1.0.28.apk
          if-no-files-found: error


      - name: Require passing shared Android installation tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          updater_revision="$(python -c 'import json; print(json.load(open("inhouse-updater.lock.json"))["revision"])')"
          passed="$(gh api "repos/miguelcoxcaballero/inhouse-services-updater/actions/workflows/android-session.yml/runs?head_sha=$updater_revision&status=success&per_page=1" --jq '.total_count')"
          test "$passed" -gt 0

      - name: Publish versioned APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.28 >/dev/null 2>&1; then
            echo "La versión ya está publicada; incrementa versionName/versionCode antes de generar otra APK."
            exit 1
          else
            gh release create android-v1.0.28 inhouse-notes-release-v1.0.28.apk \
              --target "$GITHUB_SHA" \
              --title "Inhouse Notes Android 1.0.28" \
              --notes "Fix in-app update installation." \
              --prerelease --latest=false
          fi

      - name: Verify public APK before its catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/public-apk"
          gh release download android-v1.0.28 --pattern inhouse-notes-release-v1.0.28.apk --dir "$RUNNER_TEMP/public-apk"
          cmp inhouse-notes-release-v1.0.28.apk "$RUNNER_TEMP/public-apk/inhouse-notes-release-v1.0.28.apk"
          python .github/scripts/verify_release_apk.py "$RUNNER_TEMP/public-apk/inhouse-notes-release-v1.0.28.apk" "$RUNNER_TEMP/previous-apk/inhouse-notes-release-v1.0.27.apk"

      # Catalogs are committed with the next visible web version only after the
      # exact public APK is verified. Never create an unversioned main commit.
      - name: Prepare verified catalog metadata
        run: python .github/scripts/update_services_manifest.py

      - name: Upload verified catalog metadata for the web release
        uses: actions/upload-artifact@v7
        with:
          name: verified-android-catalog
          path: |
            android-update.json
            updates/A.json
            updates/B.json
