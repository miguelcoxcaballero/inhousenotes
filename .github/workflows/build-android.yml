name: Build and publish signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rebuild-v2/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --disable-pip-version-check pillow

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INHOUSE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inhousenotes-release.jks"

      - name: Build signed APK
        env:
          INHOUSE_KEYSTORE_PATH: ${{ runner.temp }}/inhousenotes-release.jks
          INHOUSE_KEYSTORE_PASSWORD: ${{ secrets.INHOUSE_ANDROID_KEYSTORE_PASSWORD }}
          INHOUSE_KEY_ALIAS: ${{ secrets.INHOUSE_ANDROID_KEY_ALIAS }}
        run: python .github/scripts/build_android_apk.py

      - name: Verify APK exists
        run: |
          test -s inhouse-notes-release-v1.0.14.apk
          ls -lh inhouse-notes-release-v1.0.14.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: inhouse-notes-android-v1.0.14
          path: inhouse-notes-release-v1.0.14.apk
          if-no-files-found: error


      - name: Publish versioned APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.14 >/dev/null 2>&1; then
            echo "La versión ya está publicada; incrementa versionName/versionCode antes de generar otra APK."
            exit 1
          else
            gh release create android-v1.0.14 inhouse-notes-release-v1.0.14.apk \
              --target "$GITHUB_SHA" \
              --title "Inhouse Notes Android 1.0.14" \
              --notes "Live camera and simpler save status." \
              --prerelease --latest=false
          fi

      - name: Verify public APK before its catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/public-apk" "$RUNNER_TEMP/previous-apk"
          gh release download android-v1.0.14 --pattern inhouse-notes-release-v1.0.14.apk --dir "$RUNNER_TEMP/public-apk"
          gh release download android-v1.0.13 --pattern inhouse-notes-release-v1.0.13.apk --dir "$RUNNER_TEMP/previous-apk"
          cmp inhouse-notes-release-v1.0.14.apk "$RUNNER_TEMP/public-apk/inhouse-notes-release-v1.0.14.apk"
          python .github/scripts/verify_release_apk.py "$RUNNER_TEMP/public-apk/inhouse-notes-release-v1.0.14.apk" "$RUNNER_TEMP/previous-apk/inhouse-notes-release-v1.0.13.apk"

      - name: Publish matching channel A manifest
        run: |
          python .github/scripts/update_services_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-update.json updates/A.json updates/B.json
          git commit -m "Publish exact APK metadata in channel A"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
