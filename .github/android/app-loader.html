<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>Inhouse Notes</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f5f5f0; color: #1a1a1a; }
    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      font: 600 15px system-ui, sans-serif;
    }
    .launch-mark { display: grid; justify-items: center; gap: 12px; opacity: .82; }
    svg { width: 30px; height: 36px; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #151515; color: #f5f5f5; }
    }
  </style>
  <script>
    // Give Android one local painted frame before navigation starts. The shell
    // remains visible until the remote document commits, instead of a blank page.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        window.location.replace("https://inhousenotes.com/?inhouse_app=1");
      });
    });
  </script>
</head>
<body>
  <div class="launch-mark" aria-label="Opening Inhouse Notes">
    <svg viewBox="34 30 40 48" fill="none" aria-hidden="true">
        <path d="M42 30 H61 L74 43 V70 A8 8 0 0 1 66 78 H42 A8 8 0 0 1 34 70 V38 A8 8 0 0 1 42 30 Z" fill="#FF7F1F" />
        <path d="M61 30 V39 Q61 43 65 43 H74 Z" fill="#FFB984" />
        <path d="M45 62.5 L54 53.5 L63 62.5" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span>inhouse notes</span>
  </div>
</body>
</html>
