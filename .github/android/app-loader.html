<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>Inhouse Notes</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f5f5f0; color: #1a1a1a; }
    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      font: 600 15px system-ui, sans-serif;
    }
    .launch-mark { display: grid; justify-items: center; gap: 12px; opacity: .82; }
    svg { width: 54px; height: 34px; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #151515; color: #f5f5f5; }
    }
  </style>
  <script>
    // Give Android one local painted frame before navigation starts. The shell
    // remains visible until the remote document commits, instead of a blank page.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        window.location.replace("https://inhousenotes.com/?inhouse_app=1");
      });
    });
  </script>
</head>
<body>
  <div class="launch-mark" aria-label="Opening Inhouse Notes">
    <svg viewBox="0 0 40 24" fill="none" aria-hidden="true">
      <path d="M4 22 L20 6 L36 22" stroke="#E07A3C" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span>inhouse notes</span>
  </div>
</body>
</html>
